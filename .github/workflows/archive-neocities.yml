name: Archive Neocities site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/archive-neocities.yml'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Snapshot Neocities metadata
        env:
          NEOCITIES_TOKEN: ${{ secrets.NEOSITIES_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot/site snapshot/metadata snapshot/recovered
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${NEOCITIES_TOKEN}" \
            https://neocities.org/api/info \
            > snapshot/metadata/info.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${NEOCITIES_TOKEN}" \
            https://neocities.org/api/list \
            > snapshot/metadata/manifest-before.json

      - name: Download every listed file and verify SHA1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import email.utils
          import hashlib
          import json
          import os
          import pathlib
          import time
          import urllib.parse
          import urllib.request

          root = pathlib.Path('snapshot')
          site_root = root / 'site'
          metadata_root = root / 'metadata'

          info = json.loads((metadata_root / 'info.json').read_text(encoding='utf-8'))
          manifest = json.loads((metadata_root / 'manifest-before.json').read_text(encoding='utf-8'))
          if info.get('result') != 'success':
              raise SystemExit(f"Neocities info failed: {info}")
          if manifest.get('result') != 'success':
              raise SystemExit(f"Neocities list failed: {manifest}")

          sitename = info['info']['sitename']
          base_url = f'https://{sitename}.neocities.org/'
          results = []
          failures = []

          for entry in manifest.get('files', []):
              if entry.get('is_directory'):
                  continue
              rel = entry['path']
              expected_sha1 = entry.get('sha1_hash')
              expected_size = entry.get('size')
              target = site_root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              url = base_url + urllib.parse.quote(rel, safe='/')

              last_error = None
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(url, headers={
                          'User-Agent': 'subeha-neocities-archive/1.0',
                          'Cache-Control': 'no-cache',
                      })
                      with urllib.request.urlopen(req, timeout=60) as response:
                          data = response.read()
                      actual_sha1 = hashlib.sha1(data).hexdigest()
                      actual_size = len(data)
                      if expected_sha1 and actual_sha1 != expected_sha1:
                          raise ValueError(f'SHA1 mismatch expected={expected_sha1} actual={actual_sha1}')
                      if expected_size is not None and actual_size != expected_size:
                          raise ValueError(f'size mismatch expected={expected_size} actual={actual_size}')
                      target.write_bytes(data)
                      updated_at = entry.get('updated_at')
                      if updated_at:
                          try:
                              dt = email.utils.parsedate_to_datetime(updated_at)
                              ts = dt.timestamp()
                              os.utime(target, (ts, ts))
                          except Exception:
                              pass
                      results.append({
                          'path': rel,
                          'url': url,
                          'size': actual_size,
                          'sha1': actual_sha1,
                          'expected_sha1': expected_sha1,
                          'updated_at': entry.get('updated_at'),
                          'verified': True,
                      })
                      last_error = None
                      break
                  except Exception as exc:
                      last_error = repr(exc)
                      time.sleep(attempt * 2)
              if last_error is not None:
                  failures.append({'path': rel, 'url': url, 'error': last_error})

          verification = {
              'sitename': sitename,
              'base_url': base_url,
              'listed_file_count': len([x for x in manifest.get('files', []) if not x.get('is_directory')]),
              'downloaded_file_count': len(results),
              'failed_file_count': len(failures),
              'files': results,
              'failures': failures,
          }
          (metadata_root / 'verification.json').write_text(
              json.dumps(verification, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          if failures:
              raise SystemExit(f"Failed to archive {len(failures)} file(s): {failures}")
          PY

      - name: Confirm site did not change during snapshot
        env:
          NEOCITIES_TOKEN: ${{ secrets.NEOSITIES_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${NEOCITIES_TOKEN}" \
            https://neocities.org/api/list \
            > snapshot/metadata/manifest-after.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          def normalized(path):
              data = json.loads(Path(path).read_text(encoding='utf-8'))
              return sorted(
                  (x.get('path'), x.get('is_directory'), x.get('size'), x.get('sha1_hash'), x.get('updated_at'))
                  for x in data.get('files', [])
              )

          before = normalized('snapshot/metadata/manifest-before.json')
          after = normalized('snapshot/metadata/manifest-after.json')
          if before != after:
              raise SystemExit('Neocities changed while the snapshot was being taken; rerun for a coherent archive.')
          PY

      - name: Add recovered pre-migration index
        shell: bash
        run: |
          set -euo pipefail
          cat > snapshot/recovered/index-pre-migration-2026-08-26.html <<'EOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#efefeb"><title>すべての歯が見える</title><link rel="stylesheet" href="./assets/style.css"></head><body>
          <div class="wrap">
            <header class="sitebar"><div class="brand">すべての歯が見える</div><nav><a href="./work/">取扱</a><a href="#footer">連絡</a></nav></header>
            <main>
              <section class="hero"><img class="mark" src="./assets/mark.png" alt=""><p class="motto">遅滞なく、直ちに。</p></section>
              <section class="greeting"><h2 class="rule-title">ごあいさつ</h2><div class="body">
                <p>いつもお世話になっております。<br>バレたので、こちらでやり直します。</p>
                <p>今回から一般の方にも一部商品をお分けします。<br>同業各位におかれましては、一般向け商品の大量購入をご遠慮ください。同業向けに必要なものは別途用意します。</p>
                <p>引き続き、ジジイにはご内密にお願いいたします。</p>
                <p>Telegramでの販売は終了しました。<br>今後の販売はこちらで行います。</p>
              </div></section>
              <section><h1 class="rule-title">商品</h1><nav class="split" aria-label="商品区分"><a href="./trade/">同業者</a><a href="./general/">一般</a></nav></section>
            </main>
            <footer id="footer" class="footer"><span>仮設中</span><span>連絡・表示事項は公開時に整備</span></footer>
          </div></body></html>
          EOF
          cat > snapshot/recovered/README.txt <<'EOF'
          Recovered pre-migration homepage
          =================================

          index-pre-migration-2026-08-26.html was recovered from the user's prior
          ChatGPT file library after Neocities site/index.html had already been overwritten
          by the new GitHub-driven homepage.

          It is intentionally stored outside site/ so the archive does not falsely claim
          that this was the live index.html at snapshot time.

          The HTML references ./assets/style.css and ./assets/mark.png. If those historical
          assets are still present in site/assets/, copying this recovered file to the root
          as index.html reconstructs that earlier homepage against the archived assets.
          EOF

      - name: Write archive notes and checksums
        shell: bash
        run: |
          set -euo pipefail
          cat > snapshot/README.txt <<'EOF'
          Neocities complete archive
          ===========================

          site/
            Every non-directory file returned by the authenticated Neocities /api/list
            endpoint at snapshot time, preserving its original path.

          recovered/
            Files recovered from prior user-provided sources that had already been
            overwritten on the live Neocities site. These are separated from site/ to keep
            provenance explicit.

          metadata/info.json
            Authenticated Neocities site information.

          metadata/manifest-before.json
          metadata/manifest-after.json
            Authoritative Neocities file lists before and after capture. The job fails if
            they differ.

          metadata/verification.json
            Per-file size and SHA1 verification against the Neocities manifest.

          SHA1SUMS
            Local SHA1 checksums for both the live snapshot and recovered files.

          The job fails if any listed Neocities file cannot be downloaded, if its size or
          SHA1 differs from the API manifest, or if the site changes while capture is in
          progress. The recovered pre-migration index is separately labeled because it was
          no longer live when the authenticated snapshot was taken.
          EOF
          (cd snapshot && find site recovered -type f -print0 | sort -z | xargs -0 sha1sum) > snapshot/SHA1SUMS
          tar -C snapshot -czf neocities-complete-archive.tar.gz .

      - name: Upload complete verified archive
        uses: actions/upload-artifact@v4
        with:
          name: neocities-complete-archive
          path: neocities-complete-archive.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
