name: Assistant VRM Video Render

on:
  push:
    branches:
      - feature/vrm-studio-webapp
    paths:
      - 'jobs/assistant/current/**'
      - 'remotion/vrm-lipsync/**'
      - '.github/workflows/assistant-video-render.yml'
  workflow_dispatch:
    inputs:
      job_dir:
        description: 'edit-plan.json と音声を置いたjob directory'
        required: true
        default: 'jobs/assistant/current'
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Resolve job
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            job='${{ inputs.job_dir }}'
          else
            job='jobs/assistant/current'
          fi
          case "$job" in
            jobs/assistant/*) ;;
            *) echo 'job_dir must stay under jobs/assistant/' >&2; exit 1 ;;
          esac
          test -f "$job/edit-plan.json" || { echo "Missing $job/edit-plan.json" >&2; exit 1; }

          if [ -f "$job/source.m4a" ]; then
            audio="$job/source.m4a"
          elif [ -f "$job/source.wav" ]; then
            audio="$job/source.wav"
          elif [ -f "$job/source.opus" ]; then
            audio="$job/source.opus"
          elif [ -f "$job/source-parts.txt" ]; then
            joined="$RUNNER_TEMP/assistant-source.b64"
            : > "$joined"
            while IFS= read -r part || [ -n "$part" ]; do
              [ -z "$part" ] && continue
              case "$part" in
                jobs/assistant/assets/*) ;;
                *) echo "Audio chunk must stay under jobs/assistant/assets/: $part" >&2; exit 1 ;;
              esac
              test -f "$part" || { echo "Missing audio chunk: $part" >&2; exit 1; }
              cat "$part" >> "$joined"
            done < "$job/source-parts.txt"
            base64 --decode "$joined" > "$job/source.opus"
            test -s "$job/source.opus" || { echo 'Decoded audio is empty' >&2; exit 1; }
            audio="$job/source.opus"
          else
            echo "Missing $job/source.m4a/source.wav/source.opus or source-parts.txt" >&2
            exit 1
          fi

          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$audio"
          echo "ASSISTANT_JOB=$job" >> "$GITHUB_ENV"
          echo "ASSISTANT_AUDIO=$audio" >> "$GITHUB_ENV"

      - name: Require production video VRM
        shell: bash
        run: |
          if [ -f Subeha.vrm ]; then
            echo 'VIDEO_VRM_PATH=../../Subeha.vrm' >> "$GITHUB_ENV"
          elif [ -f remotion/vrm-lipsync/inputs/Subeha.vrm ]; then
            echo 'VIDEO_VRM_PATH=inputs/Subeha.vrm' >> "$GITHUB_ENV"
          else
            echo 'Production Subeha.vrm is not checked into this ref.' >&2
            echo 'The lightweight subeha-web-site.vrm is intentionally not accepted because it lacks aa/ih/ou/ee/oh mouth morphs.' >&2
            exit 1
          fi

      - name: Install Remotion dependencies
        working-directory: remotion/vrm-lipsync
        run: npm install --no-audit --no-fund

      - name: Render assistant plan
        working-directory: remotion/vrm-lipsync
        shell: bash
        run: |
          npm run render:assistant -- \
            --plan="../../${ASSISTANT_JOB}/edit-plan.json" \
            --audio="../../${ASSISTANT_AUDIO}" \
            --output=out/assistant-current.mp4

      - name: Upload final video and QC
        uses: actions/upload-artifact@v4
        with:
          name: assistant-vrm-video
          path: |
            remotion/vrm-lipsync/out/assistant-current.mp4
            remotion/vrm-lipsync/out/qc-frames/**
            remotion/vrm-lipsync/jobs/.generated/assistant-project.json
            ${{ env.ASSISTANT_JOB }}/edit-plan.json
          retention-days: 14
