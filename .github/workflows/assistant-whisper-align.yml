name: Assistant Whisper Transcription

on:
  workflow_dispatch:
    inputs:
      job_dir:
        description: '短尺音声を置いた assistant job directory'
        required: true
        default: 'jobs/assistant/current'
        type: string

permissions:
  contents: read

env:
  WHISPER_CPP_VERSION: '1.5.5'
  WHISPER_MODEL: small
  WHISPER_LANGUAGE: ja

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Resolve source audio
        shell: bash
        run: |
          set -euo pipefail
          job='${{ inputs.job_dir }}'
          case "$job" in
            jobs/assistant/*) ;;
            *) echo 'job_dir must stay under jobs/assistant/' >&2; exit 1 ;;
          esac

          if [ -f "$job/source.m4a" ]; then
            audio="$job/source.m4a"
          elif [ -f "$job/source.wav" ]; then
            audio="$job/source.wav"
          elif [ -f "$job/source.opus" ]; then
            audio="$job/source.opus"
          else
            echo "Missing $job/source.m4a/source.wav/source.opus" >&2
            echo 'Base64 audio reconstruction is intentionally unsupported.' >&2
            exit 1
          fi

          test -s "$audio"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$audio"
          echo "ASSISTANT_AUDIO=$(realpath "$audio")" >> "$GITHUB_ENV"

      - name: Cache whisper.cpp and model
        uses: actions/cache@v4
        with:
          path: remotion/vrm-lipsync/.cache/whisper-align
          key: ${{ runner.os }}-whispercpp-${{ env.WHISPER_CPP_VERSION }}-${{ env.WHISPER_MODEL }}

      - name: Install Whisper dependencies
        working-directory: remotion/vrm-lipsync
        run: npm install --no-audit --no-fund

      - name: Generate timed ASR with local whisper.cpp
        working-directory: remotion/vrm-lipsync
        run: |
          npm run transcribe -- \
            --audio="$ASSISTANT_AUDIO" \
            --output-dir=out/timed-asr \
            --force

      - name: Verify timed ASR artifacts
        working-directory: remotion/vrm-lipsync
        shell: bash
        run: |
          set -euo pipefail
          test -s out/timed-asr/timed-asr.json
          test -s out/timed-asr/timed-asr.srt
          test -s out/timed-asr/timed-asr.vtt
          test -s out/timed-asr/timed-asr.meta.json
          node -e "const fs=require('fs'); const rows=JSON.parse(fs.readFileSync('out/timed-asr/timed-asr.json','utf8')); if(!Array.isArray(rows)||!rows.length) process.exit(1); for(const r of rows){if(!(Number.isFinite(r.startMs)&&Number.isFinite(r.endMs)&&r.endMs>r.startMs)) process.exit(2)} console.log('verified timed captions:', rows.length)"

      - uses: actions/upload-artifact@v4
        with:
          name: assistant-timed-asr
          path: remotion/vrm-lipsync/out/timed-asr/
          retention-days: 14
