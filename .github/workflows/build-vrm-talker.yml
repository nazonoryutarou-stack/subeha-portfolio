name: Build VRM Studio

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/vrm-talker/**'
      - 'workers/vrm-studio-api/**'
      - '.github/workflows/build-vrm-talker.yml'
  pull_request:
    paths:
      - 'tools/vrm-talker/**'
      - 'workers/vrm-studio-api/**'
      - '.github/workflows/build-vrm-talker.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: |
          node --check workers/vrm-studio-api/src/index.js
          node --check workers/vrm-studio-api/src/openverse.js
      - name: Install VRM Studio dependencies
        working-directory: tools/vrm-talker
        run: npm install
      - name: Test streaming SHA-256
        working-directory: tools/vrm-talker
        run: npm run test:sha
      - name: Test project validation and source lock
        working-directory: tools/vrm-talker
        run: npm run test:project
      - name: Test long-audio chunk planning
        working-directory: tools/vrm-talker
        run: npm run test:chunks
      - name: Test browser VRM production preflight
        working-directory: tools/vrm-talker
        run: npm run test:vrm
      - name: Build VRM Studio with injected API base
        working-directory: tools/vrm-talker
        env:
          VITE_VRM_STUDIO_API_BASE: https://example.invalid/api
        run: npm run build
      - name: Verify API base reached the Vite bundle
        working-directory: tools/vrm-talker
        run: grep -R -q 'https://example.invalid/api' dist
      - name: Upload static app
        uses: actions/upload-artifact@v4
        with:
          name: vrm-studio-web
          path: tools/vrm-talker/dist
          retention-days: 14
