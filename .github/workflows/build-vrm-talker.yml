name: Build VRM Studio

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/vrm-talker/**'
      - 'workers/vrm-studio-api.js'
      - '.github/workflows/build-vrm-talker.yml'
  pull_request:
    paths:
      - 'tools/vrm-talker/**'
      - 'workers/vrm-studio-api.js'
      - '.github/workflows/build-vrm-talker.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: node --check workers/vrm-studio-api.js
      - name: Install VRM Studio dependencies
        working-directory: tools/vrm-talker
        run: npm install
      - name: Build VRM Studio
        working-directory: tools/vrm-talker
        run: npm run build
      - name: Upload static app
        uses: actions/upload-artifact@v4
        with:
          name: vrm-studio-web
          path: tools/vrm-talker/dist
          retention-days: 14
