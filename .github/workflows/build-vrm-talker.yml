name: Build VRM Talker

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/vrm-talker/**'
      - '.github/workflows/build-vrm-talker.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/vrm-talker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Upload static app
        uses: actions/upload-artifact@v4
        with:
          name: vrm-talker-web
          path: tools/vrm-talker/dist
          retention-days: 14
