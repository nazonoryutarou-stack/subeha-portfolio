name: Deploy Optional Openverse Proxy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'workers/vrm-studio-api/**'
      - '.github/workflows/deploy-vrm-studio-api.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: subeha-vrm-studio-api
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify optional proxy secrets exist
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          echo 'OPENAI_API_KEY is intentionally not used.'

      - name: Install Worker dependencies
        working-directory: workers/vrm-studio-api
        run: npm install

      - name: Check Worker syntax
        working-directory: workers/vrm-studio-api
        run: npm run check

      - name: Test Worker image import safety
        working-directory: workers/vrm-studio-api
        run: npm test

      - name: Deploy free-only Worker
        working-directory: workers/vrm-studio-api
        run: npx wrangler deploy

      - name: Resolve workers.dev URL and verify free-only deployment
        shell: bash
        run: |
          account_endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          worker_endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/subdomain"

          account_json="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$account_endpoint")"
          worker_json="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$worker_endpoint")"

          subdomain="$(printf '%s' "$account_json" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);if(j?.success&&j?.result?.subdomain)process.stdout.write(String(j.result.subdomain));})")"
          enabled="$(printf '%s' "$worker_json" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j?.success&&j?.result?.enabled===true?'true':'false');})")"

          test -n "$subdomain" || { echo 'Cloudflare account workers.dev subdomain could not be resolved'; exit 1; }
          test "$enabled" = 'true' || { echo "Worker ${WORKER_NAME} is not enabled on workers.dev"; exit 1; }

          api_base="https://${WORKER_NAME}.${subdomain}.workers.dev/api"
          health="$(curl -fsS "${api_base}/health")"
          printf '%s' "$health" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);if(j?.ok!==true)throw new Error('health.ok is not true');if(j?.freeOnly!==true||j?.paidAI!==false)throw new Error('Worker is not free-only');if(j?.openverseImport!==true)throw new Error('Openverse import unavailable');console.log('Free-only Worker health verified: API v'+(j.version||1));})"

          echo "VRM_STUDIO_API_BASE=${api_base}" >> "$GITHUB_ENV"
          {
            echo '### Optional Openverse proxy deployed'
            echo
            echo "- API base: \`${api_base}\`"
            echo '- Worker health: OK'
            echo '- paidAI: false'
            echo '- Openverse import: enabled'
            echo '- This proxy is optional and not part of canonical video rendering.'
          } >> "$GITHUB_STEP_SUMMARY"
