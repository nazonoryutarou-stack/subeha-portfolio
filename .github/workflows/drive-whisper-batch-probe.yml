name: Drive Whisper Batch Probe

on:
  push:
    branches: [work/drive-whisper-batch-probe]
    paths: ['.github/workflows/drive-whisper-batch-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
      HAS_WHISPER_API_KEY: ${{ secrets.WHISPER_API_KEY != '' }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          echo "OPENAI_API_KEY configured: $HAS_OPENAI_API_KEY"
          echo "WHISPER_API_KEY configured: $HAS_WHISPER_API_KEY"
          if [ "$HAS_OPENAI_API_KEY" != "true" ] && [ "$HAS_WHISPER_API_KEY" != "true" ]; then
            echo '::error::No transcription API secret detected.'
            exit 1
          fi
