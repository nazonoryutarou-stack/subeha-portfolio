name: Drive Whisper Batch Probe

on:
  push:
    branches: [work/drive-whisper-batch-probe]
    paths: ['.github/workflows/drive-whisper-batch-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API: ${{ secrets.OPENAI_API != '' }}
      OPENAI_KEY: ${{ secrets.OPENAI_KEY != '' }}
      OPENAI_TOKEN: ${{ secrets.OPENAI_TOKEN != '' }}
      API_KEY: ${{ secrets.API_KEY != '' }}
      WHISPER_KEY: ${{ secrets.WHISPER_KEY != '' }}
      WHISPER_TOKEN: ${{ secrets.WHISPER_TOKEN != '' }}
      OPENAI_WHISPER_API_KEY: ${{ secrets.OPENAI_WHISPER_API_KEY != '' }}
      GROQ_API: ${{ secrets.GROQ_API != '' }}
      GROQ_KEY: ${{ secrets.GROQ_KEY != '' }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY != '' }}
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY != '' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY != '' }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          for key in OPENAI_API OPENAI_KEY OPENAI_TOKEN API_KEY WHISPER_KEY WHISPER_TOKEN OPENAI_WHISPER_API_KEY GROQ_API GROQ_KEY GEMINI_KEY GOOGLE_GEMINI_API_KEY AI_API_KEY; do
            printf '%s configured: %s\n' "$key" "${!key}"
          done
