name: Drive Whisper Batch Probe

on:
  push:
    branches: [work/drive-whisper-batch-probe]
    paths: ['.github/workflows/drive-whisper-batch-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
      WHISPER_API_KEY: ${{ secrets.WHISPER_API_KEY != '' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY != '' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY != '' }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY != '' }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY != '' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN != '' }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON != '' }}
      GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN != '' }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          for key in OPENAI_API_KEY WHISPER_API_KEY GROQ_API_KEY GEMINI_API_KEY GOOGLE_API_KEY DEEPGRAM_API_KEY ASSEMBLYAI_API_KEY HF_TOKEN HUGGINGFACE_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_SERVICE_ACCOUNT_JSON GDRIVE_SERVICE_ACCOUNT_JSON GOOGLE_DRIVE_TOKEN; do
            printf '%s configured: %s\n' "$key" "${!key}"
          done
