name: Free Short Studio - Real Assets

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Japanese Wikipedia topic, e.g. 葛飾北斎 / 織田信長 / コーヒー"
        required: true
        default: "コーヒー"
      facts:
        description: "Number of Wikipedia facts"
        required: false
        default: "6"
  push:
    branches:
      - feature/free-short-studio-actions
    paths:
      - ".github/workflows/free-short-real-assets.yml"
      - "tools/free-short-action/**"

permissions:
  contents: read

concurrency:
  group: free-short-real-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOPIC: ${{ github.event.inputs.topic || 'コーヒー' }}
      FACTS: ${{ github.event.inputs.facts || '6' }}
      PYTHONPATH: tools/free-short-action
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/free-short-action/requirements.txt

      - name: Install Python dependencies
        run: pip install -r tools/free-short-action/requirements.txt

      - name: Verify real-image transport
        run: |
          python - <<'PY'
          import requests
          assert requests.get.__name__ == '_get', 'sitecustomize transport shim was not loaded'
          print('Wikimedia binary transport:', requests.get.__module__, requests.get.__name__)
          PY

      - name: Render real-asset short
        run: |
          python tools/free-short-action/render_topic.py \
            --topic "$TOPIC" \
            --facts "$FACTS" \
            --outdir dist/free-short

      - name: Validate output
        run: |
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of json dist/free-short/video.mp4
          test -s dist/free-short/video.mp4
          test -s dist/free-short/sources.json
          python - <<'PY'
          import json
          x=json.load(open('dist/free-short/metadata.json'))
          assert x['generated_images'] == 0
          assert x['real_assets'] >= 4
          assert x['duration'] > 10
          print(x)
          PY

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: free-short-${{ github.run_number }}
          path: |
            dist/free-short/video.mp4
            dist/free-short/contact.jpg
            dist/free-short/sources.json
            dist/free-short/CREDITS.txt
            dist/free-short/metadata.json
          if-no-files-found: error
          retention-days: 14
