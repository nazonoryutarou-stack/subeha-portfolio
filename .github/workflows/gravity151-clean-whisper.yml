name: Gravity 151 Clean Whisper

on:
  pull_request:
    branches:
      - feature/vrm-studio-webapp
    paths:
      - 'tmp/gravity151-clean/base64/**'
      - '.github/workflows/gravity151-clean-whisper.yml'
      - 'remotion/vrm-lipsync/scripts/transcribe-source.mjs'
  push:
    branches:
      - work/whisper-align-151
    paths:
      - 'tmp/gravity151-clean/base64/**'
      - '.github/workflows/gravity151-clean-whisper.yml'
      - 'remotion/vrm-lipsync/scripts/transcribe-source.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Reconstruct clean library clip
        shell: bash
        run: |
          mkdir -p tmp/gravity151-clean
          cat tmp/gravity151-clean/base64/part-*.txt | tr -d '\n\r' | base64 -d > tmp/gravity151-clean/source-clean.ogg
          ACTUAL_SIZE=$(stat -c%s tmp/gravity151-clean/source-clean.ogg)
          ACTUAL_SHA=$(sha256sum tmp/gravity151-clean/source-clean.ogg | awk '{print $1}')
          echo "bytes=$ACTUAL_SIZE"
          echo "sha256=$ACTUAL_SHA"
          test "$ACTUAL_SIZE" = "37248"
          test "$ACTUAL_SHA" = "eb977d851b6920b983079bbff0365afac20982a5c738e2e611fbf3e3d1036a17"
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 tmp/gravity151-clean/source-clean.ogg

      - name: Prepare Whisper job
        shell: bash
        run: |
          cat > tmp/gravity151-clean/job.json <<'JSON'
          {
            "sourceAudio": "../../tmp/gravity151-clean/source-clean.ogg"
          }
          JSON

      - name: Install Remotion dependencies
        working-directory: remotion/vrm-lipsync
        run: npm install --no-audit --no-fund

      - name: Run open-source whisper.cpp
        working-directory: remotion/vrm-lipsync
        env:
          WHISPER_MODEL: small
          WHISPER_LANGUAGE: ja
        run: node scripts/transcribe-source.mjs --job=../../tmp/gravity151-clean/job.json --force

      - name: Collect clean timing
        shell: bash
        run: |
          mkdir -p tmp/gravity151-clean/output
          cp remotion/vrm-lipsync/inputs/source.captions.json tmp/gravity151-clean/output/captions.json
          cp remotion/vrm-lipsync/inputs/source.captions.meta.json tmp/gravity151-clean/output/meta.json
          cp tmp/gravity151-clean/source-clean.ogg tmp/gravity151-clean/output/source-clean.ogg
          cat tmp/gravity151-clean/output/captions.json

      - uses: actions/upload-artifact@v4
        with:
          name: gravity151-clean-whisper
          path: tmp/gravity151-clean/output/
          retention-days: 2
