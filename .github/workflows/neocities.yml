name: Deploy site to Neocities

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'hitotsu-ore-choji.png'
      - '.github/workflows/neocities.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-to-neocities
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Stage shared assets
        shell: bash
        run: |
          set -euo pipefail
          test -f hitotsu-ore-choji.png
          cp hitotsu-ore-choji.png public/hitotsu-ore-choji.png

      - name: Validate public site
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/tree.js
          test -f public/tree.css
          test -f public/data/trade.json
          test -f public/data/general.json
          test -f public/hitotsu-ore-choji.png
          test -f public/arcade/index.html
          grep -q 'アーケードは未完成のため、現在は公開していません。' public/arcade/index.html
          ! grep -q '/arcade/' public/index.html

      - name: Deploy public directory to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOSITIES_API_TOKEN }}
          dist_dir: public
          cleanup: false
          neocities_supporter: false
          preview_before_deploy: true

      - name: Remove stale arcade implementation files
        env:
          NEOCITIES_TOKEN: ${{ secrets.NEOSITIES_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          listing="$(curl --fail --silent --show-error -H "Authorization: Bearer ${NEOCITIES_TOKEN}" https://neocities.org/api/list)"
          mapfile -t stale < <(LISTING_JSON="$listing" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['LISTING_JSON'])
          for item in data.get('files', []):
              path = item.get('path', '')
              if path.startswith('arcade/') and path != 'arcade/index.html' and not item.get('is_directory', False):
                  print(path)
          PY
          )
          if ((${#stale[@]})); then
            args=()
            for path in "${stale[@]}"; do
              args+=(--data-urlencode "filenames[]=${path}")
            done
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${NEOCITIES_TOKEN}" \
              "${args[@]}" \
              https://neocities.org/api/delete >/tmp/delete-arcade.json
            cat /tmp/delete-arcade.json
          else
            echo 'No stale arcade files remain.'
          fi

      - name: Verify arcade is not public
        env:
          NEOCITIES_TOKEN: ${{ secrets.NEOSITIES_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          info="$(curl --fail --silent --show-error -H "Authorization: Bearer ${NEOCITIES_TOKEN}" https://neocities.org/api/info)"
          sitename="$(INFO_JSON="$info" python3 -c 'import json,os; print(json.loads(os.environ["INFO_JSON"])["info"]["sitename"])')"
          root_url="https://${sitename}.neocities.org/"
          arcade_url="https://${sitename}.neocities.org/arcade/"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "${root_url}" -o /tmp/root.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "${arcade_url}" -o /tmp/arcade.html
          ! grep -q '/arcade/' /tmp/root.html
          grep -q 'アーケードは未完成のため、現在は公開していません。' /tmp/arcade.html
          echo "Verified unpublished arcade placeholder: ${arcade_url}"
