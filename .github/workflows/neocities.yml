name: Deploy site to Neocities

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'arcade/**'
      - 'hitotsu-ore-choji.png'
      - '.github/workflows/neocities.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-to-neocities
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Stage shared assets
        shell: bash
        run: |
          set -euo pipefail
          test -f hitotsu-ore-choji.png
          cp hitotsu-ore-choji.png public/hitotsu-ore-choji.png

      - name: Stage Astra arcade for Neocities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin feature/arcade-permanent-space
          rm -rf public/arcade
          git checkout FETCH_HEAD -- public/arcade
          test -f public/arcade/index.html
          test -f public/arcade/arcade.css
          test -f public/arcade/boot.js
          test -f public/arcade/main.js
          test -f public/arcade/world.js
          test -f public/arcade/shops.js
          test -f public/arcade/vendor/three.module.min.js
          grep -q '不氣屋界隈の、歩けるアーケード' public/arcade/index.html

      - name: Validate public site
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/tree.js
          test -f public/tree.css
          test -f public/data/trade.json
          test -f public/data/general.json
          test -f public/hitotsu-ore-choji.png
          test -f public/arcade/index.html
          test -f public/arcade/boot.js

      - name: Deploy public directory to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOSITIES_API_TOKEN }}
          dist_dir: public
          cleanup: false
          neocities_supporter: false
          preview_before_deploy: true

      - name: Verify public Astra arcade URL
        env:
          NEOCITIES_TOKEN: ${{ secrets.NEOSITIES_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          info="$(curl --fail --silent --show-error -H "Authorization: Bearer ${NEOCITIES_TOKEN}" https://neocities.org/api/info)"
          sitename="$(INFO_JSON="$info" python3 -c 'import json,os; print(json.loads(os.environ["INFO_JSON"])["info"]["sitename"])')"
          arcade_url="https://${sitename}.neocities.org/arcade/"
          echo "Public Astra arcade URL: ${arcade_url}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "${arcade_url}" -o /tmp/arcade.html
          grep -q '不氣屋界隈の、歩けるアーケード' /tmp/arcade.html
          grep -q './boot.js' /tmp/arcade.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "${arcade_url}boot.js" -o /tmp/boot.js
          grep -q 'main.js' /tmp/boot.js
          echo "Verified Astra arcade page and module boot: ${arcade_url}"
