name: Deploy site to Neocities

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'arcade/**'
      - 'hitotsu-ore-choji.png'
      - '.github/workflows/neocities.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-to-neocities
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stage shared assets
        shell: bash
        run: |
          set -euo pipefail
          test -f hitotsu-ore-choji.png
          cp hitotsu-ore-choji.png public/hitotsu-ore-choji.png

      - name: Stage arcade for Neocities
        shell: bash
        run: |
          set -euo pipefail
          test -f arcade/app.html
          mkdir -p public/arcade
          cp arcade/app.html public/arcade/index.html
          cp arcade/app.html public/arcade/app.html

      - name: Validate public site
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/tree.js
          test -f public/tree.css
          test -f public/data/trade.json
          test -f public/data/general.json
          test -f public/hitotsu-ore-choji.png
          test -f public/arcade/index.html
          test -f public/arcade/app.html

      - name: Deploy public directory to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOSITIES_API_TOKEN }}
          dist_dir: public
          cleanup: false
          neocities_supporter: false
          preview_before_deploy: true

      - name: Verify public arcade URL
        env:
          NEOCITIES_TOKEN: ${{ secrets.NEOSITIES_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          info="$(curl --fail --silent --show-error -H "Authorization: Bearer ${NEOCITIES_TOKEN}" https://neocities.org/api/info)"
          sitename="$(INFO_JSON="$info" python3 -c 'import json,os; print(json.loads(os.environ["INFO_JSON"])["info"]["sitename"])')"
          arcade_url="https://${sitename}.neocities.org/arcade/"
          echo "Public arcade URL: ${arcade_url}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "${arcade_url}" -o /tmp/arcade.html
          grep -q '不氣屋アーケード' /tmp/arcade.html
          echo "Verified arcade page: ${arcade_url}"
