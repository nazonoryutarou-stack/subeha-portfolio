name: Deploy cold monochrome site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare site
        shell: bash
        run: |
          rm -rf _site
          cp -R public _site
          # Publish the existing source VRM without duplicating a 19.6 MB binary in Git.
          test -s Subeha.vrm
          mkdir -p _site/models
          cp Subeha.vrm _site/models/Subeha.vrm
          cp hitotsu-ore-choji.png _site/hitotsu-ore-choji.png
          node scripts/build-komonjo.mjs _site/komonjo/data.json
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # The Pages API can briefly return zero artifacts immediately after upload.
      # Give artifact indexing time before deploy-pages asks for metadata.
      - name: Wait for uploaded Pages artifact to be indexed
        shell: bash
        run: sleep 25

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
