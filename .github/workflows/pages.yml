name: Deploy cold monochrome site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare cold monochrome site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/trade _site/general
          cp hitotsu-ore-choji.png _site/hitotsu-ore-choji.png

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <meta name="theme-color" content="#eeeeea">
            <title>すべての歯が見える</title>
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;min-height:100%;background:#eeeeea;color:#111}
              body{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;-webkit-font-smoothing:antialiased}
              main{min-height:100svh;display:flex;justify-content:center;padding:28px 24px 64px}
              .shell{width:min(100%,560px)}
              .site-name{margin:0;text-align:center;font-size:12px;font-weight:400;letter-spacing:.36em;text-indent:.36em}
              .hero{text-align:center;padding-top:10svh}
              .mark{display:block;width:min(35vw,150px);height:auto;margin:0 auto 34px;filter:grayscale(1) contrast(1.45)}
              .motto{margin:0;font-size:clamp(13px,3.2vw,16px);font-weight:400;letter-spacing:.28em;text-indent:.28em}
              .greeting{margin:13svh 0 11svh;padding-top:18px;border-top:1px solid #111}
              .greeting h2{margin:0 0 24px;text-align:center;font-size:13px;font-weight:400;letter-spacing:.38em;text-indent:.38em}
              .greeting p{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:12.5px;font-weight:400;line-height:2.05;letter-spacing:.04em;text-align:left}
              .section-title{margin:0 0 22px;text-align:center;font-size:13px;font-weight:400;letter-spacing:.42em;text-indent:.42em}
              .split{position:relative;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #111}
              .split::after{content:"";position:absolute;left:50%;top:0;width:1px;height:18px;background:#111}
              .split a{display:block;padding:28px 12px 16px;color:#111;text-align:center;text-decoration:none;font-size:14px;letter-spacing:.34em;text-indent:.34em}
              .split a:hover,.split a:focus-visible{text-decoration:underline;text-underline-offset:5px}
              .split a:focus-visible{outline:1px solid #111;outline-offset:4px}
              @media(max-width:420px){
                main{padding:22px 24px 52px}
                .hero{padding-top:9svh}
                .greeting{margin-top:12svh;margin-bottom:10svh}
                .greeting p{font-size:12px;line-height:2}
                .split a{font-size:13px;letter-spacing:.26em;text-indent:.26em}
              }
            </style>
          </head>
          <body>
            <main>
              <div class="shell">
                <p class="site-name">すべての歯が見える</p>
                <div class="hero">
                  <img class="mark" src="./hitotsu-ore-choji.png" alt="">
                  <p class="motto">遅滞なく、直ちに。</p>
                </div>
                <section class="greeting" aria-labelledby="greeting-title">
                  <h2 id="greeting-title">ごあいさつ</h2>
                  <p>
                    いつもお世話になっております。<br>
                    バレたので作り直しました。一般の方も利用できるようになっております。同業各位におかれましては、一般向け商品の大量購入をご遠慮ください。<br>
                    引き続き、ジジイには内緒でお願いいたします。<br>
                    なお、サイトの仮設にともないTelegram（テレグラム）での販売は終了いたしました。
                  </p>
                </section>
                <h1 class="section-title">商品</h1>
                <nav class="split" aria-label="商品区分">
                  <a href="./trade/">同業者</a>
                  <a href="./general/">一般</a>
                </nav>
              </div>
            </main>
          </body>
          </html>
          HTML

          cat > _site/tree.css <<'CSS'
          *{box-sizing:border-box}
          html,body{margin:0;min-height:100%;background:#eeeeea;color:#111}
          body{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;-webkit-font-smoothing:antialiased}
          main{min-height:100svh;width:min(calc(100% - 48px),1180px);margin:0 auto;padding:7svh 0 80px}
          header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:14px;border-bottom:1px solid #111}
          h1{margin:0;font-size:15px;font-weight:400;letter-spacing:.36em;text-indent:.36em}
          a{color:#111;text-decoration:none}
          a:hover,a:focus-visible{text-decoration:underline;text-underline-offset:4px}
          .back{font-size:11px;letter-spacing:.18em}
          .lead{margin:26px 0 0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:11px;line-height:1.9;color:#333}
          .test-label{display:inline-block;margin-left:8px;padding:3px 6px;border:1px solid #777;font:500 9px/1 system-ui,-apple-system,"Yu Gothic",sans-serif;letter-spacing:.12em;vertical-align:2px}

          .tree-wrap{margin:clamp(56px,8svh,96px) -8px 64px;overflow-x:auto;overflow-y:hidden;padding:12px 8px 36px}
          .tree,.tree ul{list-style:none;margin:0;padding:0}
          .tree{min-width:1080px;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
          .tree li{position:relative;display:flex;align-items:flex-start}
          .node{position:relative;z-index:2;display:inline-flex;align-items:baseline;gap:8px;min-height:38px;padding:7px 8px;background:#eeeeea;white-space:nowrap}
          .node strong{font-size:15px;line-height:1.45;font-weight:600;letter-spacing:.03em}
          .node small{font-size:8px;letter-spacing:.12em;color:#777}
          .root{min-width:150px;padding-left:0}
          .root strong{font-size:clamp(30px,4vw,44px);font-weight:700;letter-spacing:0}
          .category{min-width:132px}
          .category strong{font-size:18px;font-weight:650}
          .product strong{font-size:14px;font-weight:500}

          .tree ul{position:relative;margin-left:48px;padding-left:34px}
          .tree ul::before{content:"";position:absolute;left:0;top:19px;bottom:19px;width:1.5px;background:#111}
          .tree ul>li{padding:0 0 20px 32px}
          .tree ul>li::before{content:"";position:absolute;left:0;top:19px;width:32px;height:1.5px;background:#111}
          .tree ul>li:last-child{padding-bottom:0}
          .tree ul>li:last-child::after{content:"";position:absolute;z-index:1;left:-2px;top:20px;bottom:-3px;width:5px;background:#eeeeea}
          .tree .has-children>.node::after,.tree>li>.root::after{content:"";position:absolute;right:-49px;top:19px;width:49px;height:1.5px;background:#111}

          .legend{display:flex;flex-wrap:wrap;gap:10px 22px;padding-top:14px;border-top:1px solid #111;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;font-size:9.5px;line-height:1.8;color:#555}
          .legend span::before{content:"";display:inline-block;width:18px;height:1px;margin:0 7px 3px 0;background:#111}
          .note{margin:38px 0 0;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;font-size:10.5px;line-height:1.9;color:#333}

          @media(max-width:620px){
            main{width:min(calc(100% - 36px),1180px);padding-top:6svh}
            .tree-wrap{margin-top:46px;margin-right:-18px;padding-right:18px}
            .tree{min-width:940px}
            .root{min-width:116px}
            .root strong{font-size:28px}
            .category{min-width:108px}
            .category strong{font-size:16px}
            .tree ul{margin-left:34px;padding-left:27px}
            .tree ul>li{padding-left:26px;padding-bottom:17px}
            .tree ul>li::before{width:26px}
            .tree .has-children>.node::after,.tree>li>.root::after{right:-35px;width:35px}
          }
          CSS

