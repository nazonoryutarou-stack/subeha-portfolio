name: Deploy cold monochrome site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare cold monochrome site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/trade _site/general
          cp hitotsu-ore-choji.png _site/hitotsu-ore-choji.png

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <meta name="theme-color" content="#eeeeea">
            <title>すべての歯が見える</title>
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;min-height:100%;background:#eeeeea;color:#111}
              body{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;-webkit-font-smoothing:antialiased}
              main{min-height:100svh;display:flex;justify-content:center;padding:28px 24px 64px}
              .shell{width:min(100%,560px)}
              .site-name{margin:0;text-align:center;font-size:12px;font-weight:400;letter-spacing:.36em;text-indent:.36em}
              .hero{text-align:center;padding-top:10svh}
              .mark{display:block;width:min(35vw,150px);height:auto;margin:0 auto 34px;filter:grayscale(1) contrast(1.45)}
              .motto{margin:0;font-size:clamp(13px,3.2vw,16px);font-weight:400;letter-spacing:.28em;text-indent:.28em}
              .greeting{margin:13svh 0 11svh;padding-top:18px;border-top:1px solid #111}
              .greeting h2{margin:0 0 24px;text-align:center;font-size:13px;font-weight:400;letter-spacing:.38em;text-indent:.38em}
              .greeting p{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:12.5px;font-weight:400;line-height:2.05;letter-spacing:.04em;text-align:left}
              .section-title{margin:0 0 22px;text-align:center;font-size:13px;font-weight:400;letter-spacing:.42em;text-indent:.42em}
              .split{position:relative;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #111}
              .split::after{content:"";position:absolute;left:50%;top:0;width:1px;height:18px;background:#111}
              .split a{display:block;padding:28px 12px 16px;color:#111;text-align:center;text-decoration:none;font-size:14px;letter-spacing:.34em;text-indent:.34em}
              .split a:hover,.split a:focus-visible{text-decoration:underline;text-underline-offset:5px}
              .split a:focus-visible{outline:1px solid #111;outline-offset:4px}
              @media(max-width:420px){
                main{padding:22px 24px 52px}
                .hero{padding-top:9svh}
                .greeting{margin-top:12svh;margin-bottom:10svh}
                .greeting p{font-size:12px;line-height:2}
                .split a{font-size:13px;letter-spacing:.26em;text-indent:.26em}
              }
            </style>
          </head>
          <body>
            <main>
              <div class="shell">
                <p class="site-name">すべての歯が見える</p>
                <div class="hero">
                  <img class="mark" src="./hitotsu-ore-choji.png" alt="">
                  <p class="motto">遅滞なく、直ちに。</p>
                </div>
                <section class="greeting" aria-labelledby="greeting-title">
                  <h2 id="greeting-title">ごあいさつ</h2>
                  <p>
                    いつもお世話になっております。<br>
                    バレたので作り直しました。一般の方も利用できるようになっております。同業各位におかれましては、一般向け商品の大量購入をご遠慮ください。<br>
                    引き続き、ジジイには内緒でお願いいたします。<br>
                    なお、サイトの仮設にともないTelegram（テレグラム）での販売は終了いたしました。
                  </p>
                </section>
                <h1 class="section-title">商品</h1>
                <nav class="split" aria-label="商品区分">
                  <a href="./trade/">同業者</a>
                  <a href="./general/">一般</a>
                </nav>
              </div>
            </main>
          </body>
          </html>
          HTML

          cat > _site/tree.css <<'CSS'
          :root{
            --paper:#f5f2ea;
            --ink:#181612;
            --muted:#756f65;
            --hair:rgba(24,22,18,.34);
            --connector:rgba(24,22,18,.62);
          }
          *{box-sizing:border-box}
          html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
          body{
            font-family:"Yu Mincho","Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif JP",serif;
            -webkit-font-smoothing:antialiased;
            text-rendering:optimizeLegibility;
            font-feature-settings:"palt" 1;
          }
          ::selection{background:#d8d1c3;color:var(--ink)}
          main{min-height:100svh;width:min(calc(100% - 56px),1240px);margin:0 auto;padding:7.5svh 0 92px}
          header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:0 2px 17px;border-bottom:.75px solid var(--hair)}
          h1{margin:0;font-size:13px;font-weight:500;letter-spacing:.42em;text-indent:.42em}
          a{color:var(--ink);text-decoration:none}
          a:hover,a:focus-visible{text-decoration:underline;text-decoration-thickness:.75px;text-underline-offset:5px}
          .back{font-size:10px;font-weight:500;letter-spacing:.24em;color:var(--muted)}
          .lead{max-width:600px;margin:30px 2px 0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:10.5px;font-weight:400;line-height:2.05;letter-spacing:.035em;color:var(--muted)}
          .test-label{display:inline-block;margin-left:12px;font:500 8px/1.2 system-ui,-apple-system,"Yu Gothic",sans-serif;letter-spacing:.2em;color:var(--muted);vertical-align:2px}

          .tree-wrap{
            margin:clamp(68px,9svh,112px) -10px 76px;
            overflow-x:auto;
            overflow-y:hidden;
            padding:16px 10px 44px;
            scrollbar-width:thin;
            scrollbar-color:rgba(24,22,18,.22) transparent;
          }
          .tree-wrap::-webkit-scrollbar{height:5px}
          .tree-wrap::-webkit-scrollbar-thumb{background:rgba(24,22,18,.18);border-radius:999px}
          .tree,.tree ul{list-style:none;margin:0;padding:0}
          .tree{min-width:1120px}
          .tree li{position:relative;display:flex;align-items:flex-start}

          .node{
            position:relative;
            z-index:2;
            display:inline-flex;
            align-items:baseline;
            gap:9px;
            min-height:42px;
            padding:8px 11px;
            background:var(--paper);
            white-space:nowrap;
          }
          .node strong{line-height:1.5;font-weight:500;letter-spacing:.055em}
          .node small{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;font-size:7.5px;font-weight:500;letter-spacing:.16em;color:var(--muted)}

          .root{min-width:168px;padding-left:2px;padding-top:3px}
          .root strong{font-size:clamp(34px,4vw,47px);font-weight:600;letter-spacing:.015em}
          .category{min-width:152px;padding-top:7px}
          .category strong{font-size:18px;font-weight:600;letter-spacing:.08em}
          .product{padding-top:8px}
          .product strong{font-size:14px;font-weight:450;letter-spacing:.09em}

          /* Rounded connector system: each branch draws its own soft elbow. */
          .tree ul{position:relative;margin-left:52px;padding-left:38px}
          .tree ul>li{padding:0 0 25px 36px}
          .tree ul>li::before{
            content:"";
            position:absolute;
            left:0;
            top:0;
            width:36px;
            height:21px;
            border-left:1px solid var(--connector);
            border-bottom:1px solid var(--connector);
            border-bottom-left-radius:15px;
          }
          .tree ul>li:not(:last-child)::after{
            content:"";
            position:absolute;
            left:0;
            top:21px;
            bottom:0;
            width:1px;
            background:var(--connector);
          }
          .tree ul>li:last-child{padding-bottom:0}
          .tree .has-children>.node::after,
          .tree>li>.root::after{
            content:"";
            position:absolute;
            right:-53px;
            top:20px;
            width:53px;
            height:1px;
            background:var(--connector);
            border-radius:999px;
          }

          .legend{display:flex;flex-wrap:wrap;gap:12px 26px;padding:17px 2px 0;border-top:.75px solid var(--hair);font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;font-size:9px;line-height:1.9;letter-spacing:.04em;color:var(--muted)}
          .legend span::before{content:"";display:inline-block;width:20px;height:1px;margin:0 8px 3px 0;background:var(--connector);border-radius:999px}
          .note{max-width:620px;margin:42px 2px 0;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;font-size:10px;line-height:2;letter-spacing:.025em;color:var(--muted)}

          @media(max-width:620px){
            main{width:min(calc(100% - 36px),1240px);padding-top:6svh;padding-bottom:70px}
            header{padding-bottom:15px}
            h1{font-size:12px}
            .lead{font-size:10px}
            .tree-wrap{margin-top:54px;margin-right:-18px;padding-right:18px;padding-bottom:36px}
            .tree{min-width:980px}
            .root{min-width:126px}
            .root strong{font-size:29px}
            .category{min-width:120px}
            .category strong{font-size:16px}
            .product strong{font-size:13px}
            .tree ul{margin-left:38px;padding-left:30px}
            .tree ul>li{padding-left:29px;padding-bottom:20px}
            .tree ul>li::before{width:29px;height:20px;border-bottom-left-radius:12px}
            .tree ul>li:not(:last-child)::after{top:20px}
            .tree .has-children>.node::after,.tree>li>.root::after{right:-39px;top:20px;width:39px}
          }
          CSS

          cat > _site/trade/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <meta name="theme-color" content="#f5f2ea">
            <title>同業者｜すべての歯が見える</title>
            <link rel="stylesheet" href="../tree.css">
          </head>
          <body>
            <main>
              <header><h1>同業者 <span class="test-label">仮商品</span></h1><a class="back" href="../">戻</a></header>
              <p class="lead">分岐表示確認用の仮商品です。名称・分類・取扱内容はすべて仮置きです。</p>
              <section class="tree-wrap" aria-label="同業者向け仮商品系統図">
