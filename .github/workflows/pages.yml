name: Deploy monochrome shell to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare monochrome shell
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp hitotsu-ore-choji.png _site/hitotsu-ore-choji.png
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <meta name="theme-color" content="#f2f2ef">
            <title>不氣屋</title>
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;min-height:100%;background:#f2f2ef;color:#111}
              body{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif}
              main{min-height:100svh;display:grid;place-items:center;padding:32px 24px}
              .shell{width:min(100%,420px);text-align:center}
              .mark{display:block;width:min(42vw,180px);height:auto;margin:0 auto 42px;filter:grayscale(1) contrast(1.25)}
              .line{margin:0;font-size:clamp(14px,4vw,18px);font-weight:400;letter-spacing:.24em;text-indent:.24em}
            </style>
          </head>
          <body>
            <main>
              <div class="shell">
                <img class="mark" src="./hitotsu-ore-choji.png" alt="">
                <p class="line">遅滞なく、直ちに。</p>
              </div>
            </main>
          </body>
          </html>
          HTML
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
