name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build VRM Talker
        working-directory: tools/vrm-talker
        run: |
          npm install
          npm run build

      - name: Setup Python for DeepDream model
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache DeepDream Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-deepdream-tf215-tfjs422-fusedbn-v19

      - name: Build local multi-layer DeepDream models
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tensorflow-cpu==2.15.1" "tensorflowjs==4.22.0"
          python deepdream/build_dream_models.py

      - name: Prepare static site for project Pages path
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

          rm -rf _site/vrm-talker
          mkdir -p _site/vrm-talker
          cp -a tools/vrm-talker/dist/. _site/vrm-talker/

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = '_site';
          const base = '/subeha-portfolio';
          const legalTag = `<script src="${base}/assets/legal-footer.js" defer></script>`;

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (file.endsWith('.html')) {
                let html = fs.readFileSync(file, 'utf8');
                if (!html.includes('assets/legal-footer.js')) {
                  if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, `${legalTag}\n</body>`);
                  else html += `\n${legalTag}\n`;
                }
                if (!file.includes(path.join('vrm-talker', 'index.html'))) {
                  html = html.replace(/\b(href|src)="\/(?!\/)/g, `$1="${base}/`);
                }
                fs.writeFileSync(file, html);
              }
            }
          }
          walk(root);
          NODE
          touch _site/.nojekyll

      - name: Verify DeepDream models exist
        shell: bash
        run: |
          for layer in mixed3 mixed5 mixed7; do
            test -f "_site/deepdream/model/dreams/${layer}/model.json"
            grep -q "classic_deepdream_${layer}_fusedbn" "_site/deepdream/model/dreams/${layer}/model.json"
            if grep -q 'BatchNormalization' "_site/deepdream/model/dreams/${layer}/model.json"; then
              echo "BatchNormalization unexpectedly present in ${layer} browser model"
              exit 1
            fi
          done
          du -sh _site/deepdream/model/dreams/*

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
