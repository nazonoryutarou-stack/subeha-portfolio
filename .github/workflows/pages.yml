                  <li class="has-children"><div class="node category"><strong>仮商品種 01</strong></div><ul>
                    <li><div class="node product"><strong>仮商品 01-01</strong></div></li><li><div class="node product"><strong>仮商品 01-02</strong></div></li><li><div class="node product"><strong>仮商品 01-03</strong></div></li><li><div class="node product"><strong>仮商品 01-04</strong></div></li><li><div class="node product"><strong>仮商品 01-05</strong></div></li>
                  </ul></li>
                  <li class="has-children"><div class="node category"><strong>仮商品種 02</strong></div><ul>
                    <li><div class="node product"><strong>仮商品 02-01</strong></div></li><li><div class="node product"><strong>仮商品 02-02</strong></div></li><li><div class="node product"><strong>仮商品 02-03</strong></div></li><li><div class="node product"><strong>仮商品 02-04</strong></div></li><li><div class="node product"><strong>仮商品 02-05</strong></div></li>
                  </ul></li>
                  <li class="has-children"><div class="node category"><strong>仮商品種 03</strong></div><ul>
                    <li><div class="node product"><strong>仮商品 03-01</strong></div></li><li><div class="node product"><strong>仮商品 03-02</strong></div></li><li><div class="node product"><strong>仮商品 03-03</strong></div></li><li><div class="node product"><strong>仮商品 03-04</strong></div></li><li><div class="node product"><strong>仮商品 03-05</strong></div></li>
                  </ul></li>
                  <li class="has-children"><div class="node category"><strong>仮商品種 04</strong></div><ul>
                    <li><div class="node product"><strong>仮商品 04-01</strong></div></li><li><div class="node product"><strong>仮商品 04-02</strong></div></li><li><div class="node product"><strong>仮商品 04-03</strong></div></li><li><div class="node product"><strong>仮商品 04-04</strong></div></li><li><div class="node product"><strong>仮商品 04-05</strong></div></li>
                  </ul></li>
                  <li class="has-children"><div class="node category"><strong>仮商品種 05</strong></div><ul>
                    <li><div class="node product"><strong>仮商品 05-01</strong></div></li><li><div class="node product"><strong>仮商品 05-02</strong></div></li><li><div class="node product"><strong>仮商品 05-03</strong></div></li><li><div class="node product"><strong>仮商品 05-04</strong></div></li><li><div class="node product"><strong>仮商品 05-05</strong></div></li>
                  </ul></li>
                </ul></li></ul>
              </section>
              <div class="legend"><span>5分類</span><span>各分類から5商品へ分岐</span><span>計25商品</span></div>
              <p class="note">このページは商品系統図の表示試験です。実商品への置換を前提としています。</p>
            </main>
          </body>
          </html>
          HTML

