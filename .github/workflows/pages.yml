name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build VRM Talker
        working-directory: tools/vrm-talker
        run: |
          npm install
          npm run build

      - name: Setup Python for DeepDream model
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache DeepDream Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-deepdream-tf215-tfjs422-v17

      - name: Build local classic DeepDream model
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tensorflow-cpu==2.15.1" "tensorflowjs==4.22.0"
          rm -rf deepdream/model/classic
          mkdir -p deepdream/model/classic
          python <<'PY'
          import tensorflow as tf
          import tensorflowjs as tfjs

          base = tf.keras.applications.InceptionV3(
              include_top=False,
              weights='imagenet'
          )
          dream = tf.keras.Model(
              inputs=base.input,
              outputs=base.get_layer('mixed5').output,
              name='classic_deepdream_mixed5'
          )

          # Build-time smoke test using the exact tile size used by the browser.
          probe = tf.random.uniform([1, 96, 96, 3], -1.0, 1.0, dtype=tf.float32, seed=156)
          with tf.GradientTape() as tape:
              tape.watch(probe)
              activation = dream(probe, training=False)
              loss = tf.reduce_mean(activation)
          grad = tape.gradient(loss, probe)
          if grad is None:
              raise RuntimeError('DeepDream source-model gradient is None')
          if not bool(tf.reduce_all(tf.math.is_finite(grad)).numpy()):
              raise RuntimeError('DeepDream source-model gradient contains non-finite values')

          tfjs.converters.save_keras_model(dream, 'deepdream/model/classic')
          print('Classic DeepDream mixed5 model saved:', dream.input_shape, dream.output_shape)
          print('96px gradient smoke test passed:', grad.shape)
          PY

      - name: Prepare static site for project Pages path
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

          rm -rf _site/vrm-talker
          mkdir -p _site/vrm-talker
          cp -a tools/vrm-talker/dist/. _site/vrm-talker/

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = '_site';
          const base = '/subeha-portfolio';
          const legalTag = `<script src="${base}/assets/legal-footer.js" defer></script>`;

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (file.endsWith('.html')) {
                let html = fs.readFileSync(file, 'utf8');
                if (!html.includes('assets/legal-footer.js')) {
                  if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, `${legalTag}\n</body>`);
                  else html += `\n${legalTag}\n`;
                }
                if (!file.includes(path.join('vrm-talker', 'index.html'))) {
                  html = html.replace(/\b(href|src)="\/(?!\/)/g, `$1="${base}/`);
                }
                fs.writeFileSync(file, html);
              }
            }
          }
          walk(root);
          NODE
          touch _site/.nojekyll

      - name: Verify DeepDream model exists
        shell: bash
        run: |
          test -f _site/deepdream/model/classic/model.json
          ls -lh _site/deepdream/model/classic/
          grep -q 'classic_deepdream_mixed5' _site/deepdream/model/classic/model.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
