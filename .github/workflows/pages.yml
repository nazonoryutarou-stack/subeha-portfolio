name: Deploy cold monochrome shell to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare cold monochrome shell
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/trade _site/general
          cp hitotsu-ore-choji.png _site/hitotsu-ore-choji.png

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <meta name="theme-color" content="#eeeeea">
            <title>不氣屋</title>
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;min-height:100%;background:#eeeeea;color:#111}
              body{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;-webkit-font-smoothing:antialiased}
              main{min-height:100svh;display:flex;justify-content:center;padding:9svh 24px 48px}
              .shell{width:min(100%,520px);text-align:center}
              .mark{display:block;width:min(35vw,150px);height:auto;margin:0 auto 34px;filter:grayscale(1) contrast(1.45)}
              .motto{margin:0 0 16svh;font-size:clamp(13px,3.2vw,16px);font-weight:400;letter-spacing:.28em;text-indent:.28em}
              .section-title{margin:0 0 22px;font-size:13px;font-weight:400;letter-spacing:.42em;text-indent:.42em}
              .split{position:relative;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #111}
              .split::after{content:"";position:absolute;left:50%;top:0;width:1px;height:18px;background:#111}
              .split a{display:block;padding:28px 12px 16px;color:#111;text-decoration:none;font-size:14px;letter-spacing:.34em;text-indent:.34em}
              .split a:hover,.split a:focus-visible{text-decoration:underline;text-underline-offset:5px}
              .split a:focus-visible{outline:1px solid #111;outline-offset:4px}
              @media (max-width:420px){
                main{padding-top:8svh}
                .motto{margin-bottom:14svh}
                .split a{font-size:13px;letter-spacing:.26em;text-indent:.26em}
              }
            </style>
          </head>
          <body>
            <main>
              <div class="shell">
                <img class="mark" src="./hitotsu-ore-choji.png" alt="">
                <p class="motto">遅滞なく、直ちに。</p>
                <h1 class="section-title">商品</h1>
                <nav class="split" aria-label="商品区分">
                  <a href="./trade/">同業者</a>
                  <a href="./general/">一般</a>
                </nav>
              </div>
            </main>
          </body>
          </html>
          HTML

          cat > _site/trade/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <meta name="theme-color" content="#eeeeea">
            <title>同業者｜不氣屋</title>
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;min-height:100%;background:#eeeeea;color:#111}
              body{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;-webkit-font-smoothing:antialiased}
              main{min-height:100svh;width:min(calc(100% - 48px),680px);margin:0 auto;padding:11svh 0 60px}
              header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:14px;border-bottom:1px solid #111}
              h1{margin:0;font-size:15px;font-weight:400;letter-spacing:.36em;text-indent:.36em}
              a{color:#111;text-decoration:none;font-size:11px;letter-spacing:.18em}
              a:hover,a:focus-visible{text-decoration:underline;text-underline-offset:4px}
              .empty{height:56svh;border-bottom:1px solid #111}
            </style>
          </head>
          <body>
            <main>
              <header>
                <h1>同業者</h1>
                <a href="../">戻</a>
              </header>
              <div class="empty" aria-hidden="true"></div>
            </main>
          </body>
          </html>
          HTML

          cat > _site/general/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <meta name="theme-color" content="#eeeeea">
            <title>一般｜不氣屋</title>
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;min-height:100%;background:#eeeeea;color:#111}
              body{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;-webkit-font-smoothing:antialiased}
              main{min-height:100svh;width:min(calc(100% - 48px),680px);margin:0 auto;padding:11svh 0 60px}
              header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:14px;border-bottom:1px solid #111}
              h1{margin:0;font-size:15px;font-weight:400;letter-spacing:.36em;text-indent:.36em}
              a{color:#111;text-decoration:none;font-size:11px;letter-spacing:.18em}
              a:hover,a:focus-visible{text-decoration:underline;text-underline-offset:4px}
              .empty{height:56svh;border-bottom:1px solid #111}
            </style>
          </head>
          <body>
            <main>
              <header>
                <h1>一般</h1>
                <a href="../">戻</a>
              </header>
              <div class="empty" aria-hidden="true"></div>
            </main>
          </body>
          </html>
          HTML

          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
