name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site for project Pages path
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = '_site';
          const base = '/subeha-portfolio';

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (file.endsWith('.html')) {
                let html = fs.readFileSync(file, 'utf8');
                html = html.replace(/\b(href|src)="\/(?!\/)/g, `$1="${base}/`);
                fs.writeFileSync(file, html);
              }
            }
          }
          walk(root);

          const bootstrap = path.join(root, 'assets', 'bootstrap.js');
          let js = fs.readFileSync(bootstrap, 'utf8');
          js = js.replace(
            "const path=location.pathname.endsWith('/')?location.pathname:location.pathname+'/';const page=data.pages[path]||data.pages['/'];",
            "const base=location.hostname.endsWith('github.io')?'/subeha-portfolio':'';const cleanPath=base&&location.pathname.startsWith(base)?location.pathname.slice(base.length):location.pathname;const path=cleanPath.endsWith('/')?cleanPath:cleanPath+'/';const page=data.pages[path]||data.pages['/'];const rewrite=h=>base?h.replace(/(href|src)=\\\"\\/(?!\\/)/g,(_,a)=>a+'=\\\"'+base+'/'):h;"
          );
          js = js.replace(
            "document.body.innerHTML=header+`<main id=\"main\">${page.main}</main>`+footer;",
            "document.body.innerHTML=rewrite(header+`<main id=\"main\">${page.main}</main>`+footer);"
          );
          fs.writeFileSync(bootstrap, js);
          NODE
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
