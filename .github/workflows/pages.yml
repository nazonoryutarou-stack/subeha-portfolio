name: Deploy cold monochrome site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare cold monochrome site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/trade _site/general
          cp hitotsu-ore-choji.png _site/hitotsu-ore-choji.png

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <meta name="theme-color" content="#eeeeea">
            <title>すべての歯が見える</title>
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;min-height:100%;background:#eeeeea;color:#111}
              body{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;-webkit-font-smoothing:antialiased}
              main{min-height:100svh;display:flex;justify-content:center;padding:28px 24px 64px}
              .shell{width:min(100%,560px)}
              .site-name{margin:0;text-align:center;font-size:12px;font-weight:400;letter-spacing:.36em;text-indent:.36em}
              .hero{text-align:center;padding-top:10svh}
              .mark{display:block;width:min(35vw,150px);height:auto;margin:0 auto 34px;filter:grayscale(1) contrast(1.45)}
              .motto{margin:0;font-size:clamp(13px,3.2vw,16px);font-weight:400;letter-spacing:.28em;text-indent:.28em}
              .greeting{margin:13svh 0 11svh;padding-top:18px;border-top:1px solid #111}
              .greeting h2{margin:0 0 24px;text-align:center;font-size:13px;font-weight:400;letter-spacing:.38em;text-indent:.38em}
              .greeting p{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:12.5px;font-weight:400;line-height:2.05;letter-spacing:.04em;text-align:left}
              .section-title{margin:0 0 22px;text-align:center;font-size:13px;font-weight:400;letter-spacing:.42em;text-indent:.42em}
              .split{position:relative;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #111}
              .split::after{content:"";position:absolute;left:50%;top:0;width:1px;height:18px;background:#111}
              .split a{display:block;padding:28px 12px 16px;color:#111;text-align:center;text-decoration:none;font-size:14px;letter-spacing:.34em;text-indent:.34em}
              .split a:hover,.split a:focus-visible{text-decoration:underline;text-underline-offset:5px}
              .split a:focus-visible{outline:1px solid #111;outline-offset:4px}
              @media (max-width:420px){
                main{padding:22px 24px 52px}
                .hero{padding-top:9svh}
                .greeting{margin-top:12svh;margin-bottom:10svh}
                .greeting p{font-size:12px;line-height:2}
                .split a{font-size:13px;letter-spacing:.26em;text-indent:.26em}
              }
            </style>
          </head>
          <body>
            <main>
              <div class="shell">
                <p class="site-name">すべての歯が見える</p>

                <div class="hero">
                  <img class="mark" src="./hitotsu-ore-choji.png" alt="">
                  <p class="motto">遅滞なく、直ちに。</p>
                </div>

                <section class="greeting" aria-labelledby="greeting-title">
                  <h2 id="greeting-title">ごあいさつ</h2>
                  <p>
                    いつもお世話になっております。<br>
                    バレたので作り直しました。一般の方も利用できるようになっております。同業各位におかれましては、一般向け商品の大量購入をご遠慮ください。<br>
                    引き続き、ジジイには内緒でお願いいたします。<br>
                    なお、サイトの仮設にともないTelegram（テレグラム）での販売は終了いたしました。
                  </p>
                </section>

                <h1 class="section-title">商品</h1>
                <nav class="split" aria-label="商品区分">
                  <a href="./trade/">同業者</a>
                  <a href="./general/">一般</a>
                </nav>
              </div>
            </main>
          </body>
          </html>
          HTML

          cat > _site/trade/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <meta name="theme-color" content="#eeeeea">
            <title>同業者｜すべての歯が見える</title>
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;min-height:100%;background:#eeeeea;color:#111}
              body{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;-webkit-font-smoothing:antialiased}
              main{min-height:100svh;width:min(calc(100% - 48px),920px);margin:0 auto;padding:8svh 0 76px}
              header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:14px;border-bottom:1px solid #111}
              h1{margin:0;font-size:15px;font-weight:400;letter-spacing:.36em;text-indent:.36em}
              a{color:#111;text-decoration:none}
              a:hover,a:focus-visible{text-decoration:underline;text-underline-offset:4px}
              .back{font-size:11px;letter-spacing:.18em}
              .lead{margin:27px 0 0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:11px;line-height:1.9;color:#333}

              .tree-wrap{margin:clamp(58px,9svh,108px) 0 72px;overflow-x:auto;overflow-y:hidden;padding:10px 6px 30px}
              .product-tree,.product-tree ul{list-style:none;margin:0;padding:0}
              .product-tree{min-width:760px;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
              .product-tree>li,.product-tree ul>li{display:flex;position:relative;align-items:flex-start}

              .tree-node{position:relative;display:inline-flex;align-items:baseline;gap:9px;min-height:42px;padding:8px 0;white-space:nowrap;background:#eeeeea;z-index:2}
              .tree-node strong{font-size:19px;line-height:1.35;font-weight:650;letter-spacing:.02em}
              .tree-node small{font-size:9px;line-height:1;letter-spacing:.12em;color:#666}
              .root-node{min-width:132px;padding-top:5px}
              .root-node strong{font-size:clamp(28px,4vw,42px);font-weight:700;letter-spacing:.01em}
              .group-node strong{font-size:18px}
              .version-node strong{font-size:15px;font-weight:600}

              .product-tree ul{position:relative;margin-left:48px;padding-left:34px}
              .product-tree ul::before{content:"";position:absolute;left:0;top:21px;bottom:21px;width:1.5px;background:#111}
              .product-tree ul>li{padding:0 0 28px 32px}
              .product-tree ul>li::before{content:"";position:absolute;left:0;top:21px;width:32px;height:1.5px;background:#111}
              .product-tree ul>li:last-child{padding-bottom:0}
              .product-tree ul>li:last-child::after{content:"";position:absolute;left:-1px;top:22px;bottom:-2px;width:4px;background:#eeeeea;z-index:1}
              .product-tree .has-children>.tree-node::after{content:"";position:absolute;right:-49px;top:21px;width:49px;height:1.5px;background:#111}
              .product-tree>li>.root-node::after{content:"";position:absolute;right:-49px;top:21px;width:49px;height:1.5px;background:#111}

              .node-link{border-bottom:1px solid transparent}
              .node-link:hover,.node-link:focus-visible{border-bottom-color:#111;text-decoration:none}
              .pending{color:#777}
              .pending strong{font-weight:500}

              .legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:34px;padding-top:14px;border-top:1px solid #111;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;font-size:9.5px;line-height:1.8;color:#555}
              .legend span::before{content:"";display:inline-block;width:18px;height:1px;margin:0 7px 3px 0;background:#111}
              .note{margin:44px 0 0;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;font-size:10.5px;line-height:1.9;color:#333}

              @media(max-width:620px){
                main{width:min(calc(100% - 36px),920px);padding-top:6svh}
                .lead{font-size:10.5px}
                .tree-wrap{margin-top:50px;margin-right:-18px;padding-right:18px}
                .product-tree{min-width:650px}
                .root-node{min-width:112px}
                .root-node strong{font-size:28px}
                .product-tree ul{margin-left:36px;padding-left:28px}
                .product-tree ul>li{padding-left:27px;padding-bottom:24px}
                .product-tree ul>li::before{width:27px}
                .product-tree .has-children>.tree-node::after,.product-tree>li>.root-node::after{right:-37px;width:37px}
              }
            </style>
          </head>
          <body>
            <main>
              <header>
                <h1>同業者</h1>
                <a class="back" href="../">戻</a>
              </header>
              <p class="lead">商品は系統・種類・版ごとに分岐しています。枝の先にある名称が現在の取扱単位です。</p>

              <section class="tree-wrap" aria-label="同業者向け商品系統図">
                <ul class="product-tree">
                  <li>
                    <div class="tree-node root-node"><strong>同業者</strong></div>
                    <ul>
                      <li class="has-children">
                        <div class="tree-node group-node"><strong>御札</strong></div>
                        <ul>
                          <li><div class="tree-node"><strong>GI札</strong><small>準備中</small></div></li>
                        </ul>
                      </li>

                      <li class="has-children">
                        <div class="tree-node group-node"><strong>斎串</strong></div>
                        <ul>
                          <li><div class="tree-node version-node"><strong>v2</strong><small>準備中</small></div></li>
                        </ul>
                      </li>

                      <li>
                        <div class="tree-node"><strong>論理写真</strong><small>準備中</small></div>
                      </li>

                      <li>
                        <div class="tree-node"><strong>テルテルボット</strong><small>準備中</small></div>
                      </li>
                    </ul>
                  </li>
                </ul>
              </section>

              <div class="legend" aria-label="系統図の見方"><span>コネクタラインは商品系統を示します</span><span>版がある商品は右へさらに分岐します</span></div>
              <p class="note">一般向け商品の大量購入はご遠慮ください。同業者向けの販売条件・取扱品は、確定したものから枝先に追加します。</p>
            </main>
          </body>
          </html>
          HTML

          cat > _site/general/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <meta name="theme-color" content="#eeeeea">
            <title>一般｜すべての歯が見える</title>
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;min-height:100%;background:#eeeeea;color:#111}
              body{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;-webkit-font-smoothing:antialiased}
              main{min-height:100svh;width:min(calc(100% - 48px),680px);margin:0 auto;padding:11svh 0 72px}
              header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:14px;border-bottom:1px solid #111}
              h1{margin:0;font-size:15px;font-weight:400;letter-spacing:.36em;text-indent:.36em}
              a{color:#111;text-decoration:none}
              a:hover,a:focus-visible{text-decoration:underline;text-underline-offset:4px}
              .back{font-size:11px;letter-spacing:.18em}
              .lead{margin:34px 0 48px;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:12px;line-height:2;color:#222}
              .catalog{border-top:1px solid #111}
              .item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;padding:24px 0;border-bottom:1px solid #aaa}
              .meta{display:flex;gap:8px;align-items:center;margin:0 0 9px;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;font-size:9px;letter-spacing:.13em}
              .meta span{padding:3px 6px;border:1px solid #777}
              h2{margin:0 0 9px;font-size:18px;font-weight:400;letter-spacing:.08em}
              .desc{margin:0;max-width:500px;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;font-size:11.5px;line-height:1.9}
              .side{text-align:right;align-self:center;min-width:118px}
              .price{display:block;margin-bottom:9px;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;font-size:12px;font-weight:600;white-space:nowrap}
              .buy{display:inline-block;padding:8px 11px;border:1px solid #111;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;font-size:10px;letter-spacing:.08em}
              .buy:hover,.buy:focus-visible{background:#111;color:#eeeeea;text-decoration:none}
              .pending{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;font-size:10px;letter-spacing:.1em;color:#555}
              .note{margin:46px 0 0;padding-top:16px;border-top:1px solid #111;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;font-size:10.5px;line-height:1.9}
              @media(max-width:520px){
                main{width:min(calc(100% - 36px),680px);padding-top:8svh}
                .item{grid-template-columns:1fr;gap:14px}
                .side{text-align:left;min-width:0}
                h2{font-size:17px}
              }
            </style>
          </head>
          <body>
            <main>
              <header>
                <h1>一般</h1>
                <a class="back" href="../">戻</a>
              </header>
              <p class="lead">一般の方向けの商品・相談窓口です。現在購入または予約できるものから掲載しています。</p>
              <section class="catalog" aria-label="一般向け商品一覧">
                <article class="item">
                  <div>
                    <p class="meta"><span>相談</span><span>予約制</span></p>
                    <h2>人生相談</h2>
                    <p class="desc">霊視・占い・未来予測を行わず、相談内容を言葉にし、状況と現実的な選択肢を整理する60分の対話サービス。</p>
                  </div>
                  <div class="side">
                    <strong class="price">60分 5,000円</strong>
                    <a class="buy" href="https://book.stripe.com/28E28q9owdqi6jV2m3gjC04">予約する</a>
                  </div>
                </article>

                <article class="item">
                  <div>
                    <p class="meta"><span>札</span><span>受注生産</span></p>
                    <h2>パワーワード札</h2>
                  </div>
                  <div class="side">
                    <strong class="price">1,000円</strong>
                    <a class="buy" href="https://buy.stripe.com/28E28q1W4gCu6jV5yfgjC01">購入する</a>
                  </div>
                </article>

                <article class="item">
                  <div>
                    <p class="meta"><span>札</span></p>
                    <h2>絵画札（最高に本気EDITION）</h2>
                  </div>
                  <div class="side">
                    <strong class="price">100,000円</strong>
                    <a class="buy" href="https://buy.stripe.com/14AbJ0eIQbia37JbWDgjC02">購入する</a>
                  </div>
                </article>

                <article class="item">
                  <div>
                    <p class="meta"><span>異物製品</span><span>受注生産</span></p>
                    <h2>テルテルボット</h2>
                    <p class="desc">てるてる坊主の上位機種。機械化したため、雨に弱い。</p>
                  </div>
                  <div class="side"><span class="pending">販売準備中</span></div>
                </article>
              </section>
              <p class="note">人生相談は医療・法律・金融その他の専門判断の代替ではありません。各商品の詳細・販売条件は決済画面の表示を優先します。</p>
            </main>
          </body>
          </html>
          HTML

          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
