name: Site QA

on:
  push:
    branches:
      - main
      - agent/site-rescan-qa
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run static QA
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import re, sys

          root = Path('.')
          excluded = {'.git', '.github'}
          public_html = []
          for p in root.rglob('*.html'):
              if any(part in excluded for part in p.parts):
                  continue
              if p.parts and p.parts[0] in {'archive', 'legacy'}:
                  continue
              public_html.append(p)

          errors=[]
          warnings=[]

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]; self.ids=set(); self.images=[]; self.desc=False
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.add(a['id'])
                  if tag=='a' and 'href' in a: self.links.append(a['href'])
                  if tag=='img': self.images.append(a)
                  if tag=='meta' and a.get('name')=='description' and a.get('content','').strip(): self.desc=True

          forbidden = [
              re.compile(r'spectrum', re.I),
              re.compile(r'スペクトゥルム'),
              re.compile(r'すほての歯が見える'),
          ]

          all_text_files=[]
          for ext in ('*.html','*.js','*.css','*.md'):
              for p in root.rglob(ext):
                  if '.git' in p.parts: continue
                  if p.parts and p.parts[0] in {'archive','legacy'}: continue
                  all_text_files.append(p)
          for p in all_text_files:
              text=p.read_text(encoding='utf-8', errors='ignore')
              for pat in forbidden:
                  if pat.search(text): errors.append(f'{p}: obsolete/typo text matches {pat.pattern}')

          def resolve_link(src, href):
              if not href or href.startswith(('http://','https://','mailto:','tel:','javascript:')): return None
              if href == '#': return ('dummy', None)
              clean=href.split('?',1)[0]
              pathpart, _, frag = clean.partition('#')
              if not pathpart:
                  target=src
              elif pathpart.startswith('/'):
                  target=root / pathpart.lstrip('/')
              else:
                  target=(src.parent / pathpart)
              if str(pathpart).endswith('/'):
                  target=target/'index.html'
              elif target.exists() and target.is_dir():
                  target=target/'index.html'
              return target, frag

          for p in public_html:
              text=p.read_text(encoding='utf-8', errors='ignore')
              parser=Parser(); parser.feed(text)
              if not re.search(r'<title>\s*[^<]+\s*</title>', text, re.I|re.S): errors.append(f'{p}: missing title')
              if not parser.desc: errors.append(f'{p}: missing meta description')
              for img in parser.images:
                  if 'alt' not in img: errors.append(f'{p}: image missing alt: {img.get("src","")}')
              for href in parser.links:
                  r=resolve_link(p, href)
                  if not r: continue
                  if r[0]=='dummy': errors.append(f'{p}: dummy href="#"'); continue
                  target, frag=r
                  if not target.exists():
                      errors.append(f'{p}: broken local link {href} -> {target}')
                      continue
                  if frag and target.suffix.lower()=='.html':
                      t=target.read_text(encoding='utf-8', errors='ignore')
                      if not re.search(r'\bid=["\']'+re.escape(frag)+r'["\']', t):
                          errors.append(f'{p}: missing fragment #{frag} in {target}')

          home=Path('home.html').read_text(encoding='utf-8', errors='ignore')
          for marker in ['home-vrm','three-vrm','data-home-vrm','subeha-vrm-poster']:
              if marker in home: errors.append(f'home.html: VRM marker remains: {marker}')

          print(f'public HTML checked: {len(public_html)}')
          if warnings:
              print('WARNINGS:')
              for x in warnings: print('-',x)
          if errors:
              print('ERRORS:')
              for x in errors: print('-',x)
              sys.exit(1)
          print('QA PASS')
