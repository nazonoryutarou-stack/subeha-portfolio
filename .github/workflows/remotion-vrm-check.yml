name: Remotion VRM Check

on:
  push:
    branches:
      - feature/remotion-workflow-v2
      - feature/vrm-studio-webapp
    paths:
      - 'remotion/vrm-lipsync/**'
      - 'scripts/check-vrm.mjs'
      - '.github/workflows/remotion-vrm-check.yml'
  pull_request:
    paths:
      - 'remotion/vrm-lipsync/**'
      - 'scripts/check-vrm.mjs'
      - '.github/workflows/remotion-vrm-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion/vrm-lipsync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Check pipeline script syntax
        working-directory: .
        run: |
          node --check scripts/check-vrm.mjs
          node --check remotion/vrm-lipsync/scripts/ensure-video-vrm.mjs
          node --check remotion/vrm-lipsync/scripts/studio-project-validation.mjs
          node --check remotion/vrm-lipsync/scripts/import-studio-project.mjs
          node --check remotion/vrm-lipsync/scripts/import-assistant-plan.mjs
          node --check remotion/vrm-lipsync/scripts/render-assistant.mjs
          node --check remotion/vrm-lipsync/scripts/materialize-visuals.mjs
          node --check remotion/vrm-lipsync/scripts/prepare-studio.mjs
          node --check remotion/vrm-lipsync/scripts/render-studio.mjs
          node --check remotion/vrm-lipsync/scripts/validate-render.mjs
          node --check remotion/vrm-lipsync/scripts/generate-envelope.mjs
          node --check remotion/vrm-lipsync/scripts/prepare-clip.mjs
      - name: Test Studio project validator
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {validateStudioProject} from './scripts/studio-project-validation.mjs';
          const sha = 'a'.repeat(64);
          const valid = {
            version: 1,
            source: {sha256: sha, durationMs: 10000},
            clip: {startMs: 1000, endMs: 9000},
            avatar: {speaker: 'HOST'},
            captions: [{text: 'hello', startMs: 1200, endMs: 2000, speaker: 'HOST'}],
            speakerTurns: [{speaker: 'HOST', startMs: 1000, endMs: 3000}],
            visualReferences: [{id: 'v', startMs: 1500, endMs: 2500, url: 'data:image/png;base64,AA=='}],
            layout: {width: 720, height: 1280},
          };
          assert.deepEqual(validateStudioProject(valid), {durationMs: 10000, width: 720, height: 1280, avatarSpeaker: 'HOST'});
          assert.throws(() => validateStudioProject({...valid, clip: {startMs: 1000, endMs: 11000}}), /元音声長/);
          assert.throws(() => validateStudioProject({...valid, avatar: {speaker: 'GUEST'}}), /speakerTurnsに存在しません/);
          assert.throws(() => validateStudioProject({...valid, layout: {width: 800, height: 800}}), /未対応の出力サイズ/);
          console.log('Studio project validator fixtures passed');
          NODE
      - name: Test ChatGPT assistant edit-plan bridge
        run: |
          mkdir -p jobs/.generated
          python3 - <<'PY'
          import math, struct, wave
          with wave.open('jobs/.generated/assistant-fixture.wav', 'wb') as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(16000)
              frames = bytearray()
              for i in range(3 * 16000):
                  sample = int(math.sin(i / 13.0) * 2500)
                  frames += struct.pack('<h', sample)
              w.writeframes(frames)
          PY
          cat > jobs/.generated/assistant-plan.json <<'JSON'
          {
            "version": 1,
            "sourceLabel": "assistant-fixture.wav",
            "selection": {"reason":"CI fixture","hook":"HOST/GUEST/UNKNOWN gate","summary":"bridge test"},
            "clip": {"startMs":0,"endMs":3000},
            "layout": {"width":720,"height":1280,"captionBottomPx":290},
            "text": {"title":"Assistant fixture","telop":""},
            "captions": [
              {"startMs":0,"endMs":800,"speaker":"HOST","text":"host one","speakerConfidence":0.99},
              {"startMs":800,"endMs":1600,"speaker":"GUEST","text":"guest","speakerConfidence":0.95},
              {"startMs":1600,"endMs":2200,"speaker":"UNKNOWN","text":"unclear","speakerConfidence":0.4},
              {"startMs":2200,"endMs":3000,"speaker":"HOST","text":"host two","speakerConfidence":0.98}
            ],
            "visualReferences": [],
            "motion": {"profile":"normal","notes":"CI"}
          }
          JSON
          npm run import:assistant -- --plan=jobs/.generated/assistant-plan.json --audio=jobs/.generated/assistant-fixture.wav --output-project=jobs/.generated/assistant-project.json
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('jobs/.generated/assistant-project.json', 'utf8'));
          if (p.avatar?.speaker !== 'HOST') throw new Error('avatar speaker is not HOST');
          if (!p.speakerTurns.some(x => x.speaker === 'HOST')) throw new Error('HOST turn missing');
          if (!p.speakerTurns.some(x => x.speaker === 'GUEST')) throw new Error('GUEST turn missing');
          if (!p.speakerTurns.some(x => x.speaker === 'UNKNOWN')) throw new Error('UNKNOWN turn missing');
          if (p.source?.sha256?.length !== 64) throw new Error('source SHA missing');
          console.log('Assistant plan bridge fixture passed');
          NODE
          npm run render:assistant -- --plan=jobs/.generated/assistant-plan.json --audio=jobs/.generated/assistant-fixture.wav --output=out/assistant-fixture.mp4 --plan-only | grep -q '"composition":"VrmLipSync"'
          rm -rf jobs/.generated
      - name: Test visual and background materialization
        run: |
          mkdir -p public
          cat > public/clip.json <<'JSON'
          {
            "backgroundDataUrl": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZVZsAAAAASUVORK5CYII=",
            "visualReferences": [
              {
                "id": "ci-visual",
                "kind": "generated",
                "startMs": 0,
                "endMs": 1000,
                "url": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZVZsAAAAASUVORK5CYII="
              }
            ]
          }
          JSON
          node scripts/materialize-visuals.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const clip = JSON.parse(fs.readFileSync('public/clip.json', 'utf8'));
          const renderFile = clip.visualReferences?.[0]?.renderFile;
          if (!renderFile) throw new Error('renderFile was not written');
          if (!fs.existsSync(`public/${renderFile}`)) throw new Error(`materialized file missing: ${renderFile}`);
          if (!clip.backgroundFile) throw new Error('backgroundFile was not written');
          if (!fs.existsSync(`public/${clip.backgroundFile}`)) throw new Error(`background file missing: ${clip.backgroundFile}`);
          if ('backgroundDataUrl' in clip) throw new Error('backgroundDataUrl should be removed after materialization');
          console.log(`Materialized visual fixture: ${renderFile}`);
          console.log(`Materialized background fixture: ${clip.backgroundFile}`);
          NODE
          rm -rf public/visuals public/clip.json
      - name: Reject remote visuals by default
        run: |
          mkdir -p public
          cat > public/clip.json <<'JSON'
          {
            "visualReferences": [
              {
                "id": "remote-visual",
                "kind": "search",
                "startMs": 0,
                "endMs": 1000,
                "url": "https://example.com/image.jpg"
              }
            ]
          }
          JSON
          if node scripts/materialize-visuals.mjs; then
            echo 'ERROR: remote visual URL was fetched without explicit opt-in'
            exit 1
          fi
          echo 'PASS: remote visual URL is blocked by default'
          rm -rf public/visuals public/clip.json
      - name: Test studio composition planning
        run: |
          mkdir -p jobs/.generated
          cat > jobs/.generated/vertical.json <<'JSON'
          {"source":{"durationMs":1000},"clip":{"startMs":0,"endMs":1000},"layout":{"width":720,"height":1280}}
          JSON
          cat > jobs/.generated/square.json <<'JSON'
          {"source":{"durationMs":1000},"clip":{"startMs":0,"endMs":1000},"layout":{"width":900,"height":900}}
          JSON
          cat > jobs/.generated/landscape.json <<'JSON'
          {"source":{"durationMs":1000},"clip":{"startMs":0,"endMs":1000},"layout":{"width":1280,"height":720}}
          JSON
          npm run render:studio -- --project=jobs/.generated/vertical.json --audio=dummy.m4a --plan-only | grep -q '"composition":"VrmLipSync"'
          npm run render:studio -- --project=jobs/.generated/square.json --audio=dummy.m4a --plan-only | grep -q '"composition":"VrmLipSyncSquare"'
          npm run render:studio -- --project=jobs/.generated/landscape.json --audio=dummy.m4a --plan-only | grep -q '"composition":"VrmLipSyncLandscape"'
          rm -rf jobs/.generated
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run check
