name: Render Teruteru Bot CM

on:
  workflow_dispatch:
  push:
    paths:
      - 'remotion/teruteru-bot/**'
      - '.github/workflows/render-teruteru-bot.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion/teruteru-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate synchronized soundtrack
        run: |
          mkdir -p public/audio
          ffmpeg -y \
            -f lavfi -i "anoisesrc=color=pink:amplitude=0.22:d=15" \
            -f lavfi -i "sine=frequency=58:duration=4.3" \
            -f lavfi -i "sine=frequency=880:duration=3" \
            -f lavfi -i "anoisesrc=color=white:amplitude=0.65:d=0.9" \
            -f lavfi -i "sine=frequency=520:duration=1.1" \
            -filter_complex "\
              [0:a]highpass=f=180,lowpass=f=7000,volume=0.32[rain];\
              [1:a]volume=0.20,afade=t=in:st=0:d=.3,afade=t=out:st=3.7:d=.6,adelay=2700|2700[hum];\
              [2:a]volume='if(lt(mod(t,0.42),0.12),0.32,0)':eval=frame,adelay=6900|6900[alarm];\
              [3:a]highpass=f=900,lowpass=f=9000,volume=0.52,afade=t=out:st=.45:d=.45,adelay=7750|7750[zap];\
              [4:a]volume=0.24,afade=t=out:st=.55:d=.55,adelay=12000|12000[chime];\
              [rain][hum][alarm][zap][chime]amix=inputs=5:normalize=0,alimiter=limit=0.92[a]" \
            -map "[a]" -ar 48000 -ac 2 public/audio/teruteru-soundtrack.wav

      - name: Render MP4 with Remotion
        run: npm run render

      - name: Verify audio and duration
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,codec_name -of json out/teruteru-bot-cg.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: teruteru-bot-cg
          path: remotion/teruteru-bot/out/teruteru-bot-cg.mp4
          retention-days: 14
