name: VRM Studio Candidate Deploy & Live Smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '検証するbranch / tag / commit'
        required: true
        default: 'feature/vrm-studio-webapp'
        type: string
      test_openverse:
        description: 'Openverse importも実画像で確認する'
        required: true
        default: true
        type: boolean
      test_image_generation:
        description: 'GPT Imageを1枚生成する（API課金あり）'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  candidate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WORKER_NAME: subeha-vrm-studio-api-candidate
    steps:
      - name: Verify required secrets exist
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo 'Missing OPENAI_API_KEY'; exit 1; }

      - name: Checkout candidate ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Point Wrangler config at candidate Worker
        working-directory: workers/vrm-studio-api
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'wrangler.jsonc';
          const name = process.env.WORKER_NAME;
          let text = fs.readFileSync(path, 'utf8');
          if (!/"name"\s*:\s*"[^"]+"/.test(text)) throw new Error('wrangler.jsonc has no Worker name');
          text = text.replace(/"name"\s*:\s*"[^"]+"/, `"name": "${name}"`);
          fs.writeFileSync(path, text);
          console.log(`Candidate Worker name: ${name}`);
          NODE

      - name: Install and test Worker candidate
        working-directory: workers/vrm-studio-api
        run: |
          npm install
          npm run check
          npm test

      - name: Deploy candidate Worker
        working-directory: workers/vrm-studio-api
        run: npx wrangler deploy

      - name: Sync OpenAI secret to candidate
        working-directory: workers/vrm-studio-api
        shell: bash
        run: printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY

      - name: Resolve candidate Worker URL
        shell: bash
        run: |
          account_endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          worker_endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/subdomain"
          account_json="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$account_endpoint")"
          worker_json="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$worker_endpoint")"
          subdomain="$(printf '%s' "$account_json" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);if(j?.success&&j?.result?.subdomain)process.stdout.write(String(j.result.subdomain));})")"
          enabled="$(printf '%s' "$worker_json" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j?.success&&j?.result?.enabled===true?'true':'false');})")"
          test -n "$subdomain" || { echo 'workers.dev subdomain could not be resolved'; exit 1; }
          test "$enabled" = 'true' || { echo "Candidate Worker ${WORKER_NAME} is not enabled on workers.dev"; exit 1; }
          api_base="https://${WORKER_NAME}.${subdomain}.workers.dev/api"
          echo "VRM_STUDIO_API_BASE=${api_base}" >> "$GITHUB_ENV"
          echo "Candidate API base: ${api_base}"

      - name: Verify candidate health
        shell: bash
        run: |
          health="$(curl -fsS --retry 2 --retry-all-errors "${VRM_STUDIO_API_BASE}/health")"
          printf '%s' "$health" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);if(j?.ok!==true)throw new Error('health.ok is not true');if(j?.openaiConfigured!==true)throw new Error('Worker does not see OPENAI_API_KEY');console.log(JSON.stringify(j,null,2));})"

      - name: Install speech fixture generator
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng

      - name: Live transcription through candidate Worker
        shell: bash
        run: |
          espeak-ng -v en-us -s 135 -w /tmp/vrm-studio-candidate.wav 'hello from the vrm studio candidate live smoke test. this sentence checks timed transcription and speaker segmentation.'
          response="$(curl -fsS --max-time 180 --retry 1 --retry-all-errors \
            -X POST "${VRM_STUDIO_API_BASE}/transcribe" \
            -F 'audio=@/tmp/vrm-studio-candidate.wav;type=audio/wav')"
          printf '%s' "$response" > /tmp/transcription.json
          node - <<'NODE'
          const fs = require('node:fs');
          const j = JSON.parse(fs.readFileSync('/tmp/transcription.json', 'utf8'));
          if (j?.model !== 'gpt-4o-transcribe-diarize') throw new Error(`unexpected model: ${j?.model}`);
          if (!Array.isArray(j?.captions) || !j.captions.length) throw new Error('no captions');
          if (!Array.isArray(j?.speakerTurns) || !j.speakerTurns.length) throw new Error('no speaker turns');
          for (const [i, c] of j.captions.entries()) {
            if (!Number.isFinite(Number(c?.startMs)) || !Number.isFinite(Number(c?.endMs)) || Number(c.endMs) <= Number(c.startMs)) throw new Error(`caption ${i} timing invalid`);
            if (!String(c?.speaker || '').trim()) throw new Error(`caption ${i} speaker missing`);
          }
          console.log(`Transcription OK: ${j.captions.length} captions / ${j.speakerTurns.length} turns`);
          NODE

      - name: Live Visual Director through candidate Worker
        shell: bash
        run: |
          cat > /tmp/visual-request.json <<'JSON'
          {"captions":[
            {"text":"I found an old photograph of Tokyo Station.","speaker":"HOST","startMs":0,"endMs":1800},
            {"text":"Then I imagined a glass animal walking through it.","speaker":"HOST","startMs":1800,"endMs":3800}
          ]}
          JSON
          response="$(curl -fsS --max-time 120 --retry 1 --retry-all-errors -X POST "${VRM_STUDIO_API_BASE}/visual-cues" -H 'content-type: application/json' --data-binary @/tmp/visual-request.json)"
          printf '%s' "$response" > /tmp/visual-response.json
          node - <<'NODE'
          const fs = require('node:fs');
          const j = JSON.parse(fs.readFileSync('/tmp/visual-response.json', 'utf8'));
          if (!String(j?.model || '').trim()) throw new Error('Visual Director model missing');
          if (!Array.isArray(j?.cues)) throw new Error('Visual Director cues missing');
          for (const [i, cue] of j.cues.entries()) {
            if (!Number.isInteger(Number(cue?.startIndex)) || !Number.isInteger(Number(cue?.endIndex))) throw new Error(`cue ${i} indexes invalid`);
            if (!Number.isFinite(Number(cue?.startMs)) || !Number.isFinite(Number(cue?.endMs)) || Number(cue.endMs) <= Number(cue.startMs)) throw new Error(`cue ${i} timing invalid`);
          }
          console.log(`Visual Director OK: ${j.cues.length} cues`);
          NODE

      - name: Live Openverse import
        if: ${{ inputs.test_openverse }}
        shell: bash
        run: |
          metadata="$(curl -fsS --max-time 30 'https://api.openverse.org/v1/images/?q=public%20domain%20flower&page_size=8')"
          printf '%s' "$metadata" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);for(const x of j?.results||[])if(x?.id)console.log(x.id);})" > /tmp/openverse-ids.txt
          success='false'
          while read -r image_id; do
            [ -n "$image_id" ] || continue
            if curl -fsS --max-time 90 -X POST "${VRM_STUDIO_API_BASE}/images/import-openverse" -H 'content-type: application/json' --data "{\"id\":\"${image_id}\"}" > /tmp/openverse-import.json; then
              if node -e "const j=require('/tmp/openverse-import.json');if(!/^data:image\/(png|jpeg|jpg|webp|gif);base64,/.test(String(j?.dataUrl||'')))process.exit(1)"; then
                success='true'
                break
              fi
            fi
          done < /tmp/openverse-ids.txt
          test "$success" = 'true' || { echo 'No sampled Openverse image could be safely imported'; exit 1; }
          node -e "const j=require('/tmp/openverse-import.json');console.log('Openverse import OK:',j.id,j.mime)"

      - name: Optional live GPT Image generation
        if: ${{ inputs.test_image_generation }}
        shell: bash
        run: |
          response="$(curl -fsS --max-time 240 -X POST "${VRM_STUDIO_API_BASE}/images/generate" -H 'content-type: application/json' --data '{"prompt":"A simple white circle on a plain black background, test fixture only","size":"1024x1024","quality":"low"}')"
          printf '%s' "$response" > /tmp/image-generation.json
          node -e "const j=require('/tmp/image-generation.json');const b64=j?.data?.[0]?.b64_json;if(!b64||b64.length<100)throw new Error('GPT Image returned no image bytes');console.log('GPT Image OK:',b64.length)"

      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '### VRM Studio candidate live smoke'
            echo
            echo "- Candidate ref: \`${{ inputs.ref }}\`"
            echo "- Candidate API: \`${VRM_STUDIO_API_BASE:-unresolved}\`"
            echo '- Candidate Worker is isolated from the production Worker name.'
            echo "- Openverse requested: \`${{ inputs.test_openverse }}\`"
            echo "- GPT Image requested: \`${{ inputs.test_image_generation }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
