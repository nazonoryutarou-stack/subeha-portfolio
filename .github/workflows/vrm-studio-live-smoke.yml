name: VRM Studio API Live Smoke

on:
  workflow_dispatch:
    inputs:
      test_openverse:
        description: 'Openverse import endpointも実画像で確認する'
        required: true
        default: true
        type: boolean
      test_image_generation:
        description: 'GPT Imageを1枚生成する（API課金あり）'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WORKER_NAME: subeha-vrm-studio-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify required secrets exist
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo 'Missing OPENAI_API_KEY'; exit 1; }

      - name: Resolve deployed Worker URL
        shell: bash
        run: |
          account_endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          worker_endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/subdomain"

          account_json="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$account_endpoint")"
          worker_json="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$worker_endpoint")"

          subdomain="$(printf '%s' "$account_json" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);if(j?.success&&j?.result?.subdomain)process.stdout.write(String(j.result.subdomain));})")"
          enabled="$(printf '%s' "$worker_json" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j?.success&&j?.result?.enabled===true?'true':'false');})")"

          test -n "$subdomain" || { echo 'Cloudflare workers.dev subdomain could not be resolved'; exit 1; }
          test "$enabled" = 'true' || { echo "Worker ${WORKER_NAME} is not enabled on workers.dev"; exit 1; }

          api_base="https://${WORKER_NAME}.${subdomain}.workers.dev/api"
          echo "VRM_STUDIO_API_BASE=${api_base}" >> "$GITHUB_ENV"
          echo "API base: ${api_base}"

      - name: Verify Worker health
        shell: bash
        run: |
          health="$(curl -fsS --retry 2 --retry-all-errors "${VRM_STUDIO_API_BASE}/health")"
          printf '%s' "$health" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);if(j?.ok!==true)throw new Error('health.ok is not true');if(j?.openaiConfigured!==true)throw new Error('Worker does not see OPENAI_API_KEY');console.log(JSON.stringify(j,null,2));})"

      - name: Install speech fixture generator
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng

      - name: Generate tiny speech WAV
        shell: bash
        run: |
          espeak-ng -v en-us -s 145 -w /tmp/vrm-studio-live-smoke.wav 'hello from vrm studio live smoke test'
          test -s /tmp/vrm-studio-live-smoke.wav
          bytes="$(wc -c < /tmp/vrm-studio-live-smoke.wav)"
          echo "Speech fixture bytes: ${bytes}"
          test "$bytes" -lt 2000000

      - name: Live transcription through Worker and OpenAI
        shell: bash
        run: |
          response="$(curl -fsS --max-time 180 --retry 1 --retry-all-errors \
            -X POST "${VRM_STUDIO_API_BASE}/transcribe" \
            -F 'audio=@/tmp/vrm-studio-live-smoke.wav;type=audio/wav')"

          printf '%s' "$response" > /tmp/transcription.json
          node - <<'NODE'
          const fs = require('node:fs');
          const j = JSON.parse(fs.readFileSync('/tmp/transcription.json', 'utf8'));
          if (j?.model !== 'gpt-4o-transcribe-diarize') throw new Error(`unexpected transcription model: ${j?.model}`);
          if (!Array.isArray(j?.captions) || !j.captions.length) throw new Error('live transcription returned no captions');
          if (!Array.isArray(j?.speakerTurns) || !j.speakerTurns.length) throw new Error('live transcription returned no speaker turns');
          for (const [index, caption] of j.captions.entries()) {
            if (!Number.isFinite(Number(caption?.startMs)) || !Number.isFinite(Number(caption?.endMs)) || Number(caption.endMs) <= Number(caption.startMs)) {
              throw new Error(`caption ${index} has invalid timing`);
            }
            if (!String(caption?.speaker || '').trim()) throw new Error(`caption ${index} has no speaker`);
          }
          console.log(`Live transcription OK: ${j.captions.length} captions / ${j.speakerTurns.length} turns / ${j.durationMs}ms`);
          NODE

      - name: Live Visual Director through Worker and OpenAI
        shell: bash
        run: |
          cat > /tmp/visual-request.json <<'JSON'
          {
            "captions": [
              {"text":"I found an old photograph of Tokyo Station.","speaker":"HOST","startMs":0,"endMs":1800},
              {"text":"Then I imagined a glass animal walking through it.","speaker":"HOST","startMs":1800,"endMs":3800}
            ]
          }
          response="$(curl -fsS --max-time 120 --retry 1 --retry-all-errors \
            -X POST "${VRM_STUDIO_API_BASE}/visual-cues" \
            -H 'content-type: application/json' \
            --data-binary @/tmp/visual-request.json)"
          printf '%s' "$response" > /tmp/visual-response.json
          node - <<'NODE'
          const fs = require('node:fs');
          const j = JSON.parse(fs.readFileSync('/tmp/visual-response.json', 'utf8'));
          if (!String(j?.model || '').trim()) throw new Error('Visual Director response has no model');
          if (!Array.isArray(j?.cues)) throw new Error('Visual Director cues is not an array');
          for (const [index, cue] of j.cues.entries()) {
            if (!Number.isInteger(Number(cue?.startIndex)) || !Number.isInteger(Number(cue?.endIndex))) throw new Error(`cue ${index} has invalid caption indexes`);
            if (!Number.isFinite(Number(cue?.startMs)) || !Number.isFinite(Number(cue?.endMs)) || Number(cue.endMs) <= Number(cue.startMs)) throw new Error(`cue ${index} has invalid timing`);
          }
          console.log(`Live Visual Director OK: ${j.cues.length} cues`);
          NODE

      - name: Live Openverse import
        if: ${{ inputs.test_openverse }}
        shell: bash
        run: |
          metadata="$(curl -fsS --max-time 30 'https://api.openverse.org/v1/images/?q=public%20domain%20flower&page_size=10')"
          image_id="$(printf '%s' "$metadata" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);const item=(j?.results||[]).find(x=>x?.id);if(item)process.stdout.write(String(item.id));})")"
          test -n "$image_id" || { echo 'Openverse search returned no image id'; exit 1; }

          response="$(curl -fsS --max-time 90 \
            -X POST "${VRM_STUDIO_API_BASE}/images/import-openverse" \
            -H 'content-type: application/json' \
            --data "{\"id\":\"${image_id}\"}")"
          printf '%s' "$response" > /tmp/openverse-import.json
          node - <<'NODE'
          const fs = require('node:fs');
          const j = JSON.parse(fs.readFileSync('/tmp/openverse-import.json', 'utf8'));
          if (!/^data:image\/(png|jpeg|jpg|webp|gif);base64,/.test(String(j?.dataUrl || ''))) throw new Error('Openverse import returned no safe image data URL');
          if (!j?.id) throw new Error('Openverse import returned no id');
          console.log(`Live Openverse import OK: ${j.id} / ${j.mime}`);
          NODE

      - name: Optional live GPT Image generation
        if: ${{ inputs.test_image_generation }}
        shell: bash
        run: |
          response="$(curl -fsS --max-time 240 \
            -X POST "${VRM_STUDIO_API_BASE}/images/generate" \
            -H 'content-type: application/json' \
            --data '{"prompt":"A simple white circle on a plain black background, test fixture only","size":"1024x1024","quality":"low"}')"
          printf '%s' "$response" > /tmp/image-generation.json
          node - <<'NODE'
          const fs = require('node:fs');
          const j = JSON.parse(fs.readFileSync('/tmp/image-generation.json', 'utf8'));
          const b64 = j?.data?.[0]?.b64_json;
          if (!b64 || b64.length < 100) throw new Error('GPT Image live smoke returned no image bytes');
          console.log(`Live GPT Image OK: base64 length ${b64.length}`);
          NODE

      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '### VRM Studio API Live Smoke'
            echo
            echo "- API base: \`${VRM_STUDIO_API_BASE:-unresolved}\`"
            echo '- Health: tested'
            echo '- Worker → OpenAI transcription: tested'
            echo '- Worker → OpenAI Visual Director: tested'
            echo "- Openverse import requested: \`${{ inputs.test_openverse }}\`"
            echo "- GPT Image requested: \`${{ inputs.test_image_generation }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
