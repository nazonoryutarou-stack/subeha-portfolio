name: VTuber Audio Inbox

on:
  push:
    branches:
      - feature/vtuber-auto-director
    paths:
      - 'jobs/vtuber-inbox/**/manifest.json'
  workflow_dispatch:
    inputs:
      inbox_id:
        description: 'Folder name under jobs/vtuber-inbox'
        required: true
        type: string

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: remotion/vrm-lipsync

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Resolve inbox folder
        id: inbox
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            id='${{ inputs.inbox_id }}'
          else
            id="$(find ../../jobs/vtuber-inbox -mindepth 2 -maxdepth 2 -type f -name manifest.json -printf '%h\n' | xargs -r -n1 basename | sort | tail -n 1)"
          fi
          test -n "$id"
          test -f "../../jobs/vtuber-inbox/$id/manifest.json"
          if [ ! -f "../../jobs/vtuber-inbox/$id/audio.b64" ]; then
            compgen -G "../../jobs/vtuber-inbox/$id/audio.b64.part-*" >/dev/null
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Assemble connector chunks when needed
        shell: bash
        run: |
          set -euo pipefail
          inbox="../../jobs/vtuber-inbox/${{ steps.inbox.outputs.id }}"
          if [ ! -f "$inbox/audio.b64" ]; then
            mapfile -t parts < <(find "$inbox" -maxdepth 1 -type f -name 'audio.b64.part-*' | sort -V)
            test "${#parts[@]}" -gt 0
            cat "${parts[@]}" > "$inbox/audio.b64"
          fi

      - name: Decode and validate audio
        run: |
          node scripts/ingest-audio-inbox.mjs \
            --inbox=../../jobs/vtuber-inbox/${{ steps.inbox.outputs.id }} \
            --output=out/audio-ingest/${{ steps.inbox.outputs.id }}

      - name: Upload normalized ingress artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtuber-audio-${{ steps.inbox.outputs.id }}
          path: |
            remotion/vrm-lipsync/out/audio-ingest/${{ steps.inbox.outputs.id }}/source.*
            remotion/vrm-lipsync/out/audio-ingest/${{ steps.inbox.outputs.id }}/ingest-manifest.json
          if-no-files-found: error
          retention-days: 7
