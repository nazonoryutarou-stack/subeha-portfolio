name: VTuber Dropbox Secret Probe

on:
  push:
    branches:
      - feature/vrm-studio-webapp
    paths:
      - '.github/workflows/vtuber-dropbox-secret-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe candidate Dropbox secrets without printing values
        shell: bash
        env:
          T1: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          T2: ${{ secrets.DROPBOX_TOKEN }}
          T3: ${{ secrets.DROPBOX_API_TOKEN }}
        run: |
          set -euo pipefail
          token=""
          label=""
          if [ -n "$T1" ]; then token="$T1"; label="DROPBOX_ACCESS_TOKEN"; fi
          if [ -z "$token" ] && [ -n "$T2" ]; then token="$T2"; label="DROPBOX_TOKEN"; fi
          if [ -z "$token" ] && [ -n "$T3" ]; then token="$T3"; label="DROPBOX_API_TOKEN"; fi
          if [ -z "$token" ]; then
            echo "NO_CANDIDATE_DROPBOX_SECRET"
            exit 0
          fi
          code="$(curl -sS -o /tmp/dbx.json -w '%{http_code}'             -X POST https://api.dropboxapi.com/2/users/get_current_account             -H "Authorization: Bearer $token")"
          unset token T1 T2 T3
          if [ "$code" = "200" ]; then
            echo "DROPBOX_SECRET_AUTH_OK:$label"
          else
            echo "DROPBOX_SECRET_PRESENT_BUT_AUTH_FAILED:$label:$code"
            cat /tmp/dbx.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('error_summary','unknown_error').split(':')[0])" || true
          fi
