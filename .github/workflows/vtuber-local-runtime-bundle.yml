name: VTuber Local Runtime Bundle

on:
  push:
    branches:
      - feature/vtuber-auto-director
    paths:
      - '.tmp/vtuber-local-runtime-trigger.txt'
      - '.github/workflows/vtuber-local-runtime-bundle.yml'
      - 'remotion/vrm-lipsync/scripts/prefetch-local-runtime.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Install project dependencies
        working-directory: remotion/vrm-lipsync
        run: npm install

      - name: Validate golden contract
        working-directory: remotion/vrm-lipsync
        run: npm run check:golden

      - name: Prefetch Whisper runtime and model
        working-directory: remotion/vrm-lipsync
        env:
          WHISPER_CPP_VERSION: '1.5.5'
          WHISPER_MODEL: small
        run: node scripts/prefetch-local-runtime.mjs

      - name: Build portable bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vtuber-local-runtime/remotion
          cp -a remotion/vrm-lipsync /tmp/vtuber-local-runtime/remotion/
          cp -a Subeha.vrm /tmp/vtuber-local-runtime/Subeha.vrm
          cat > /tmp/vtuber-local-runtime/README.txt <<'EOF'
          Portable VTuber runtime.
          Audio is intentionally NOT included.
          Feed Library materialized audio directly to remotion/vrm-lipsync.

          Example:
            cd remotion/vrm-lipsync
            npm run vtuber:auto -- --audio=/mnt/data/input.m4a
          EOF
          find /tmp/vtuber-local-runtime -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/vtuber-local-runtime/BUNDLE-SHA256SUMS.txt

      - name: Upload portable runtime
        uses: actions/upload-artifact@v4
        with:
          name: vtuber-local-runtime
          path: /tmp/vtuber-local-runtime
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          include-hidden-files: true
