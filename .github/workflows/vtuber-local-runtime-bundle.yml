name: VTuber Local Runtime Bundle

on:
  push:
    branches:
      - feature/vtuber-auto-director
    paths:
      - '.tmp/vtuber-local-runtime-trigger.txt'
      - '.github/workflows/vtuber-local-runtime-bundle.yml'
      - 'remotion/vrm-lipsync/**'
      - 'docs/vtuber-golden-reference-v1.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Install project dependencies
        working-directory: remotion/vrm-lipsync
        run: npm install

      - name: Validate golden contract
        working-directory: remotion/vrm-lipsync
        run: npm run check:golden

      - name: Prefetch Whisper runtime and model
        working-directory: remotion/vrm-lipsync
        env:
          WHISPER_CPP_VERSION: '1.5.5'
          WHISPER_MODEL: small
        run: node scripts/prefetch-local-runtime.mjs

      - name: Prefetch Remotion headless browser
        working-directory: remotion/vrm-lipsync
        run: npx --no-install remotion browser ensure

      - name: Build split portable bundles
        shell: bash
        run: |
          set -euo pipefail

          CORE=/tmp/vtuber-local-runtime-core
          WRUN=/tmp/vtuber-whisper-runtime
          WMODEL=/tmp/vtuber-whisper-small-model
          PROJECT=remotion/vrm-lipsync
          WHISPER="$PROJECT/.cache/whisper-align/whisper.cpp-1.5.5"
          MODEL_FILE="$(find "$WHISPER" -maxdepth 2 -type f -name 'ggml-small*.bin' | head -n 1)"
          test -n "$MODEL_FILE"
          test -f "$MODEL_FILE"
          test -d "$PROJECT/node_modules/.remotion/chrome-headless-shell"

          mkdir -p "$CORE/remotion" "$CORE/docs" "$CORE/scripts" "$WRUN/remotion/vrm-lipsync/.cache/whisper-align" "$WMODEL/remotion/vrm-lipsync/.cache/whisper-align/whisper.cpp-1.5.5"

          cp -a "$PROJECT" "$CORE/remotion/"
          rm -rf "$CORE/remotion/vrm-lipsync/.cache"
          cp -a Subeha.vrm "$CORE/Subeha.vrm"
          cp -a docs/vtuber-golden-reference-v1.json "$CORE/docs/vtuber-golden-reference-v1.json"
          cp -a scripts/. "$CORE/scripts/"

          cp -a "$WHISPER" "$WRUN/remotion/vrm-lipsync/.cache/whisper-align/"
          find "$WRUN" -type f -name 'ggml-small*.bin' -delete

          cp -a "$MODEL_FILE" "$WMODEL/remotion/vrm-lipsync/.cache/whisper-align/whisper.cpp-1.5.5/"

          cat > "$CORE/README.txt" <<'EOF'
          Portable VTuber local runtime.
          Audio is intentionally NOT included.

          GitHub artifacts contain tar archives so node_modules symlinks and executable bits survive transport.
          Extract the artifact ZIPs, then unpack these archives into the same directory:
            vtuber-local-runtime-core.tar.gz
            vtuber-whisper-runtime.tar.gz
            vtuber-whisper-small-model.tar

          The core contains Remotion's tested Chrome Headless Shell, so rendering does not need to download a browser.
          Root repository scripts used by the renderer, including scripts/check-vrm.mjs, are included in core.

          Then feed Library materialized audio directly:
            cd remotion/vrm-lipsync
            npm run vtuber:auto -- --audio=/mnt/data/input.m4a
          EOF

          for dir in "$CORE" "$WRUN" "$WMODEL"; do
            find "$dir" -type f -print0 | sort -z | xargs -0 sha256sum > "$dir/BUNDLE-SHA256SUMS.txt"
            du -sh "$dir"
          done

          tar -C "$CORE" -czf /tmp/vtuber-local-runtime-core.tar.gz .
          tar -C "$WRUN" -czf /tmp/vtuber-whisper-runtime.tar.gz .
          tar -C "$WMODEL" -cf /tmp/vtuber-whisper-small-model.tar .
          ls -lh /tmp/vtuber-local-runtime-core.tar.gz /tmp/vtuber-whisper-runtime.tar.gz /tmp/vtuber-whisper-small-model.tar

      - name: Upload core runtime
        uses: actions/upload-artifact@v4
        with:
          name: vtuber-local-runtime-core
          path: /tmp/vtuber-local-runtime-core.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Whisper runtime
        uses: actions/upload-artifact@v4
        with:
          name: vtuber-whisper-runtime
          path: /tmp/vtuber-whisper-runtime.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Whisper small model
        uses: actions/upload-artifact@v4
        with:
          name: vtuber-whisper-small-model
          path: /tmp/vtuber-whisper-small-model.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
