name: Whisper Alignment

on:
  pull_request:
    branches:
      - feature/vrm-studio-webapp
    paths:
      - 'tmp/whisper/source.ogg'
      - '.github/workflows/whisper-align.yml'
  push:
    branches:
      - work/whisper-align-151
    paths:
      - 'tmp/whisper/source.ogg'

permissions:
  contents: read

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remotion/vrm-lipsync/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify temporary source clip
        run: ffprobe -v error -show_entries format=duration,size -of default=nw=1 tmp/whisper/source.ogg

      - name: Prepare alignment job
        shell: bash
        run: |
          cat > tmp/whisper/job.json <<'JSON'
          {
            "sourceAudio": "../../tmp/whisper/source.ogg"
          }
          JSON

      - name: Install Remotion dependencies
        working-directory: remotion/vrm-lipsync
        run: npm ci

      - name: Transcribe source clip with local whisper.cpp
        working-directory: remotion/vrm-lipsync
        env:
          WHISPER_MODEL: small
        run: node scripts/transcribe-source.mjs --job=../../tmp/whisper/job.json --force

      - name: Collect alignment result
        shell: bash
        run: |
          mkdir -p tmp/whisper/output
          cp remotion/vrm-lipsync/inputs/source.captions.json tmp/whisper/output/captions.json
          cp remotion/vrm-lipsync/inputs/source.captions.meta.json tmp/whisper/output/meta.json
          cat tmp/whisper/output/captions.json

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-align-151
          path: tmp/whisper/output/
          retention-days: 1
