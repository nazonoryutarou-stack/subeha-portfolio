name: Whisper Benchmark Assets

on:
  push:
    branches: [work/drive-whisper-batch-probe]
    paths: ['.github/workflows/whisper-benchmark-assets.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download base q5_1 and Silero VAD
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin?download=true' \
            -o /tmp/assets/ggml-base-q5_1.bin
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin?download=true' \
            -o /tmp/assets/ggml-silero-v6.2.0.bin
          ls -lh /tmp/assets
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-benchmark-assets
          path: /tmp/assets
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
