name: Whisper Local Toolkit Refresh

on:
  push:
    branches: [work/drive-whisper-batch-probe]
    paths: ['.github/workflows/whisper-local-toolkit-refresh.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Build whisper.cpp runtime
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build /tmp/whisper.cpp/build -j2
          mkdir -p /tmp/toolkit/bin /tmp/toolkit/lib /tmp/toolkit/models
          cp /tmp/whisper.cpp/build/bin/whisper-cli /tmp/toolkit/bin/
          find /tmp/whisper.cpp/build -type f -name '*.so*' -exec cp -L {} /tmp/toolkit/lib/ \;
          chmod +x /tmp/toolkit/bin/whisper-cli
      - name: Download multilingual small q5_1 model
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin?download=true' \
            -o /tmp/toolkit/models/ggml-small-q5_1.bin
          test $(stat -c%s /tmp/toolkit/models/ggml-small-q5_1.bin) -gt 150000000
          sha256sum /tmp/toolkit/models/ggml-small-q5_1.bin
          LD_LIBRARY_PATH=/tmp/toolkit/lib /tmp/toolkit/bin/whisper-cli --help >/tmp/whisper-help.txt 2>&1 || true
          head -40 /tmp/whisper-help.txt
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-local-small-q5_1-toolkit
          path: /tmp/toolkit
          retention-days: 2
          if-no-files-found: error
