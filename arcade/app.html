<!doctype html>

<style>
:root{--ink:#eee6dc;--dim:#95887e;--bg:#050606;--serif:'Shippori Mincho B1',serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}body{font-family:var(--serif);touch-action:none}#c{position:fixed;inset:0;width:100%;height:100%;display:block}.grade{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,transparent 38%,rgba(0,0,0,.58) 100%),linear-gradient(180deg,rgba(24,4,28,.06),rgba(0,0,0,.22));mix-blend-mode:multiply}.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.09;background-image:radial-gradient(circle,rgba(255,255,255,.18) 0 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}.top{position:fixed;z-index:8;left:0;right:0;top:0;display:flex;gap:9px;align-items:center;padding:calc(9px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(180deg,rgba(4,5,5,.9),transparent);pointer-events:none}.top small{font:500 .48rem var(--mono);letter-spacing:.2em;color:#a99c91}.top b{font-size:.84rem;letter-spacing:.16em}.top .sp{flex:1}.top button{pointer-events:auto;border:1px solid #5d4b43;background:rgba(8,8,8,.8);color:#ddd1c5;padding:7px 9px;font:500 .53rem var(--mono)}.readout{position:fixed;z-index:8;left:12px;top:calc(47px + env(safe-area-inset-top));font:500 .44rem/1.72 var(--mono);letter-spacing:.07em;color:#9d9188;text-shadow:0 1px 6px #000;pointer-events:none}.caption{position:fixed;z-index:8;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));width:min(54vw,340px);padding:10px 12px;border:1px solid rgba(100,85,78,.4);background:rgba(7,7,8,.7);backdrop-filter:blur(5px)}.caption b{font-size:.76rem;letter-spacing:.15em}.caption p{margin:5px 0 0;color:#b9aea4;font-size:.61rem;line-height:1.8}.controls{position:fixed;z-index:10;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px}.controls button{min-height:54px;border:1px solid #4d423c;background:linear-gradient(180deg,rgba(30,21,22,.94),rgba(7,7,8,.94));color:#eee4d8;font:800 .68rem var(--serif);letter-spacing:.06em;touch-action:none}.controls button.is-held{background:#eee4d8;color:#160f10}.veil{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(ellipse at center,#241522,#050606 72%)}.veil.off{display:none}.veil small{font:.52rem var(--mono);letter-spacing:.32em;color:#a18d87}.veil h1{margin:14px 0 8px;font-size:clamp(2.2rem,10vw,4.4rem);letter-spacing:.11em}.veil p{max-width:31em;font-size:.76rem;line-height:2;color:#b9aaa1}.veil button{margin-top:26px;border:1px solid #827168;background:#090808;color:#eee4d8;padding:14px 44px;font:800 .9rem var(--serif);letter-spacing:.24em}.cross{position:fixed;z-index:7;left:50%;top:50%;width:5px;height:5px;border:1px solid rgba(230,220,210,.28);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}@media(max-width:700px){.caption{width:58vw}.controls button{font-size:.64rem}.top b{font-size:.76rem}}
</style>

<canvas id="c"></canvas><div class="grade"></div><div class="grain"></div><div class="cross"></div>

<div class="caption"><b id="shopName">妹字屋</b><p id="shopText">読める。意味は、まだ読めない。</p></div>
<div class="controls"><button id="back">後退</button><button id="forward">前進</button><button id="strafeL">左移動</button><button id="strafeR">右移動</button></div>
<div class="veil" id="veil"><small>観測所・余興 / 改装中</small><h1>不氣屋アーケード</h1><p>妹字屋の外装工事が進んだ。<br>他の区画はまだ壁しかない。</p><button id="enter">入る</button></div>
