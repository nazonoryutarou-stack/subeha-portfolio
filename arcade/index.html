<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>不氣屋アーケード｜すべての歯が見える</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#eee6dc;--dim:#8b827a;--line:#3a302b;--bg:#070807;--red:#ff3155;--cyan:#47f3df;--vio:#aa68ff;--serif:'Shippori Mincho B1',serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}body{font-family:var(--serif);touch-action:none}#c{position:fixed;inset:0;width:100%;height:100%;display:block}.grade{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.68) 100%),linear-gradient(180deg,rgba(20,8,30,.14),rgba(0,0,0,.2));mix-blend-mode:multiply}.grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.14;background-image:radial-gradient(circle,rgba(255,255,255,.22) 0 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}.top{position:fixed;left:0;right:0;top:0;z-index:8;display:flex;align-items:center;gap:10px;padding:calc(9px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(180deg,rgba(5,6,6,.8),transparent);pointer-events:none}.top b{font-size:.84rem;letter-spacing:.18em}.top small{font:500 .48rem/1 var(--mono);letter-spacing:.2em;color:#a99c91}.top .sp{flex:1}.top button{pointer-events:auto;border:1px solid #5a4d46;background:rgba(8,8,8,.7);color:#ddd1c5;padding:7px 9px;font:500 .54rem var(--mono)}.hud{position:fixed;left:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:8;padding:9px 11px;border:1px solid rgba(140,120,105,.28);background:rgba(5,6,6,.62);backdrop-filter:blur(4px);font:.5rem/1.8 var(--mono);letter-spacing:.08em;color:#9f938a;pointer-events:none}.caption{position:fixed;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:8;width:min(48vw,360px);padding:10px 12px;border:1px solid rgba(110,97,89,.34);background:rgba(8,7,8,.73);backdrop-filter:blur(5px)}.caption b{font-size:.76rem;letter-spacing:.16em}.caption p{margin:6px 0 0;font-size:.62rem;line-height:1.8;color:#bbb0a6}.controls{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px}.controls button{min-height:54px;border:1px solid #4d423c;background:linear-gradient(180deg,rgba(28,21,22,.92),rgba(8,8,8,.92));color:#eee4d8;font:800 .76rem var(--serif);letter-spacing:.12em}.veil{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(ellipse at center,#1f1520,#070807 70%)}.veil.off{display:none}.veil small{font:.54rem var(--mono);letter-spacing:.36em;color:#a18d87}.veil h1{margin:15px 0 8px;font-size:clamp(2.2rem,10vw,4.5rem);letter-spacing:.12em}.veil p{max-width:32em;font-size:.76rem;line-height:2;color:#b8aaa0}.veil button{margin-top:28px;border:1px solid #827168;background:#0a090a;color:#eee4d8;padding:14px 44px;font:800 .9rem var(--serif);letter-spacing:.25em}.neonLegend{display:flex;gap:6px;margin-top:14px}.neonLegend i{display:block;width:34px;height:2px;box-shadow:0 0 12px currentColor}.neonLegend i:nth-child(1){color:var(--red);background:var(--red)}.neonLegend i:nth-child(2){color:var(--cyan);background:var(--cyan)}.neonLegend i:nth-child(3){color:var(--vio);background:var(--vio)}
@media(max-width:700px){.caption{width:54vw}.hud{display:none}.controls{grid-template-columns:repeat(4,1fr)}.controls button{font-size:.66rem;letter-spacing:.06em}}
</style>
</head>
<body>
<canvas id="c"></canvas><div class="grade"></div><div class="grain"></div>
<div class="top"><small>BUKIYA ARCADE / WIP 0.1</small><b>不氣屋アーケード</b><span class="sp"></span><button id="reset">視点戻</button></div>
<div class="hud">ドラッグ：見る<br>ホイール：寄る / 引く<br>前後：店を送る<br>アーケード幅：狭い</div>
<div class="caption"><b id="name">不氣屋 仮店舗</b><p id="whisper">何のための配管か、誰も説明できない。</p></div>
<div class="controls"><button id="prev">前</button><button id="next">次</button><button id="left">左列</button><button id="right">右列</button></div>
<div class="veil" id="veil"><small>観測所・余興 / 改装中</small><h1>不氣屋アーケード</h1><p>狭い。汚い。天井は低い。<br>看板は半分死んでいて、配管はどこにも繋がっていない。<br>それでも店だけは、まだ残っている。</p><div class="neonLegend"><i></i><i></i><i></i></div><button id="enter">入る</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
if(!window.THREE)return;
const cv=document.getElementById('c');
const r=new THREE.WebGLRenderer({canvas:cv,antialias:true});r.setPixelRatio(Math.min(2,devicePixelRatio||1));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=.9;if(THREE.sRGBEncoding)r.outputEncoding=THREE.sRGBEncoding;
const s=new THREE.Scene();s.background=new THREE.Color(0x060707);s.fog=new THREE.Fog(0x0b0a0c,8,62);
const cam=new THREE.PerspectiveCamera(47,1,.1,120);
const resize=()=>{r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};addEventListener('resize',resize);resize();
const std=(c,rough=.92,metal=.04,extra={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:rough,metalness:metal},extra));
const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
const cyl=(a,b,h,n,m)=>new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,n||10),m);
const lineMat=c=>new THREE.MeshStandardMaterial({color:c,emissive:new THREE.Color(c),emissiveIntensity:1.5,roughness:.5,metalness:.1});
const dirty=(base)=>{const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,512,512);for(let i=0;i<1800;i++){g.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,255,255'},${Math.random()*.05})`;g.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*18,1+Math.random()*3)}for(let i=0;i<30;i++){g.fillStyle=`rgba(60,35,25,${.03+Math.random()*.08})`;g.fillRect(Math.random()*500,280+Math.random()*220,6+Math.random()*25,30+Math.random()*140)}const t=new THREE.CanvasTexture(c);if(THREE.sRGBEncoding)t.encoding=THREE.sRGBEncoding;return t};
const signTex=(text,bg,fg)=>{const c=document.createElement('canvas');c.width=640;c.height=180;const g=c.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,c.width,c.height);g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';g.font="800 64px 'Shippori Mincho B1',serif";g.fillText(text,320,92);for(let i=0;i<140;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.1})`;g.fillRect(Math.random()*640,Math.random()*180,Math.random()*15,1)}const t=new THREE.CanvasTexture(c);if(THREE.sRGBEncoding)t.encoding=THREE.sRGBEncoding;return t};
const stores=[
['不氣屋 仮店舗','#171311','#8d6930','#f4d99b','何のための配管か、誰も説明できない。'],
['妹字屋','#171015','#5a315f','#ffd2fb','読める。意味は、まだ読めない。'],
['ヤニヴ','#181410','#6b3d26','#ffb37c','店内より灰皿の方が多い。'],
['理論堂','#11161a','#234f55','#9ffbf1','説明は増えたが、納得は減った。'],
['空店舗','#161616','#3d3b39','#9b918b','閉店理由だけが貼られていない。'],
['妹字材料','#15120f','#554529','#ead39b','黒い紙と金だけは、いつでも足りない。'],
['壊傘','#141518','#33385d','#b9c8ff','壊れたものだけを、壊れていない顔で売る。'],
['祭祀具','#15100f','#5b222d','#ff9aa7','効能より先に、置いた時の気配を考える。']
];
const arcade=new THREE.Group();s.add(arcade);
const road=box(4.2,.12,110,std(0x242322,.98,0));road.position.y=-.06;arcade.add(road);
const walkL=box(1.5,.16,110,std(0x4a4540,.98,0));walkL.position.set(-2.75,0,0);arcade.add(walkL);const walkR=walkL.clone();walkR.position.x=2.75;arcade.add(walkR);
// low translucent arcade roof
const roof=box(7.3,.12,110,new THREE.MeshStandardMaterial({color:0x2e3033,transparent:true,opacity:.28,roughness:.35,metalness:.18,side:THREE.DoubleSide}));roof.position.y=5.9;arcade.add(roof);
for(let z=-52;z<=52;z+=5.5){const rib=box(7.1,.12,.16,std(0x3b3c3d,.75,.18));rib.position.set(0,5.82,z);arcade.add(rib)}
function addPipe(side,z,seed){const g=new THREE.Group();const x=side*3.22;const col=[0x5d5a55,0x6b4a3d,0x455a59][seed%3];for(let i=0;i<3+(seed%4);i++){const p=cyl(.035,.035,2.2+(i%3)*.7,8,std(col,.78,.18));p.position.set(x+side*(.08*i),2.7+(i%2)*.7,z-2.6+i*.9);p.rotation.z=(i%2?.18:-.12)*side;g.add(p)}for(let j=0;j<2;j++){const q=cyl(.03,.03,2.2,8,std(col,.78,.18));q.rotation.z=Math.PI/2;q.position.set(x+side*.05,3.4+j*.8,z-1.2+j*1.9);g.add(q)}arcade.add(g)}
function addNeon(side,z,idx){const colors=[0xff3155,0x47f3df,0xaa68ff];const c=colors[idx%3];const bar=box(.12,.12,1.9,lineMat(c));bar.position.set(side*2.92,3.35,z+2.7);bar.rotation.x=.2*(idx%2?-1:1);arcade.add(bar);const pl=new THREE.PointLight(c,.8,6);pl.position.set(side*2.5,3.2,z+2.7);arcade.add(pl);pl.userData={seed:idx*7.13};neons.push(pl)}
const neons=[];const anchors=[];const gap=7.4;const start=-26;
for(let i=0;i<stores.length;i++){
 const z=start+i*gap;for(const side of [-1,1]){const d=stores[(i+(side>0?3:0))%stores.length];const g=new THREE.Group();arcade.add(g);const wall=new THREE.MeshStandardMaterial({map:dirty(d[1]),roughness:.98,metalness:.01});const b=box(2.6,5.5,6.6,wall);b.position.set(side*4.0,2.75,z);g.add(b);const shutter=box(.12,2.2,3.3,std(0x53504c,.9,.1));shutter.position.set(side*2.65,1.2,z);g.add(shutter);for(let sy=0;sy<9;sy++){const sl=box(.08,.03,3.18,std(0x272626,.9,.04));sl.position.set(side*2.56,.3+sy*.23,z);g.add(sl)}const sign=box(.25,.88,4.7,std(parseInt(d[2].slice(1),16),.82,.04));sign.position.set(side*2.58,4.08,z);g.add(sign);const face=new THREE.Mesh(new THREE.PlaneGeometry(4.5,.75),new THREE.MeshBasicMaterial({map:signTex(d[0],d[2],d[3]),side:THREE.DoubleSide}));face.position.set(side*2.43,4.08,z);face.rotation.y=side<0?Math.PI/2:-Math.PI/2;g.add(face);for(let j=0;j<3;j++){const crate=box(.55,.36,.55,std(0x46392f,.96,.01));crate.position.set(side*2.25,.2+j*.22,z-2.1+j*.45);g.add(crate)}addPipe(side,z,i+(side>0?11:0));if((i+side+5)%2===0)addNeon(side,z,i+(side>0?4:0));anchors.push({side,z,name:d[0],whisper:d[4],target:new THREE.Vector3(side*2.55,2.0,z)});g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}})}
}
// hanging meaningless service cables
for(let z=-42;z<44;z+=9){for(let k=0;k<3;k++){const p=cyl(.022,.022,5.8,6,std(k===0?0x493f3d:0x303638,.82,.15));p.rotation.z=Math.PI/2;p.position.set(0,4.9-k*.22,z+k*.3);arcade.add(p)}}
const hemi=new THREE.HemisphereLight(0x5d6070,0x1c1518,.35);s.add(hemi);const amb=new THREE.AmbientLight(0x30272e,.42);s.add(amb);for(let z=-40;z<45;z+=13){const l=new THREE.PointLight(0xd4c0a8,.45,10);l.position.set(0,5.2,z);s.add(l)}
let idx=0,side=-1,drag=false,lx=0,ly=0,yaw=0,pitch=.08,dist=6.3;const target=new THREE.Vector3(),curT=new THREE.Vector3(),curP=new THREE.Vector3();
const getA=()=>anchors.find(a=>a.side===side&&Math.abs(a.z-(start+idx*gap))<.1)||anchors[0];
function updateCaption(){const a=getA();document.getElementById('name').textContent=a.name;document.getElementById('whisper').textContent=a.whisper}
function sph(t,y,p,d){const cp=Math.cos(p);return new THREE.Vector3(t.x+Math.cos(y)*d*cp,t.y+Math.sin(p)*d,t.z+Math.sin(y)*d*cp)}
function baseYaw(){return side<0?-.42:Math.PI+.42}
function reset(){yaw=0;pitch=.08;dist=6.3}
document.getElementById('reset').onclick=reset;document.getElementById('prev').onclick=()=>{idx=Math.max(0,idx-1);reset();updateCaption()};document.getElementById('next').onclick=()=>{idx=Math.min(stores.length-1,idx+1);reset();updateCaption()};document.getElementById('left').onclick=()=>{side=-1;reset();updateCaption()};document.getElementById('right').onclick=()=>{side=1;reset();updateCaption()};
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw+=dx*.005;pitch=Math.max(-.02,Math.min(.32,pitch-dy*.003))});cv.addEventListener('pointerup',()=>drag=false);addEventListener('wheel',e=>{dist=Math.max(4.1,Math.min(9.4,dist+e.deltaY*.004))},{passive:true});
let running=false;function anim(t){if(!running)return;const a=getA();target.copy(a.target);curT.lerp(target,.09);const dp=sph(curT,baseYaw()+yaw,pitch,dist);curP.lerp(dp,.085);cam.position.copy(curP);cam.lookAt(curT);neons.forEach((n,i)=>{const f=Math.sin(t*.007+n.userData.seed)*Math.sin(t*.0023+n.userData.seed*1.7);n.intensity=f>-.35?.45+(i%3)*.18:.04});r.render(s,cam);requestAnimationFrame(anim)}
updateCaption();const a0=getA();curT.copy(a0.target);curP.copy(sph(curT,baseYaw(),pitch,dist));cam.position.copy(curP);cam.lookAt(curT);r.render(s,cam);
document.getElementById('enter').onclick=()=>{document.getElementById('veil').classList.add('off');running=true;requestAnimationFrame(anim)};
})();
</script>
</body>
</html>
