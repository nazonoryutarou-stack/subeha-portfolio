<!doctype html>
<html lang="ja">
<head>

<title>不氣屋アーケード WIP 0.8</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#eee6dc;--dim:#95887e;--bg:#050606;--serif:'Shippori Mincho B1',serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}body{font-family:var(--serif);touch-action:none}#c{position:fixed;inset:0;width:100%;height:100%;display:block}.grade{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,transparent 30%,rgba(0,0,0,.67) 100%),linear-gradient(180deg,rgba(24,4,28,.08),rgba(0,0,0,.28));mix-blend-mode:multiply}.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.10;background-image:radial-gradient(circle,rgba(255,255,255,.18) 0 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}.top{position:fixed;z-index:8;left:0;right:0;top:0;display:flex;gap:10px;align-items:center;padding:calc(9px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(180deg,rgba(4,5,5,.9),transparent);pointer-events:none}.top small{font:500 .48rem var(--mono);letter-spacing:.2em;color:#a99c91}.top b{font-size:.86rem;letter-spacing:.17em}.top .sp{flex:1}.top button{pointer-events:auto;border:1px solid #5d4b43;background:rgba(8,8,8,.78);color:#ddd1c5;padding:7px 9px;font:500 .54rem var(--mono)}.readout{position:fixed;z-index:8;left:12px;top:calc(48px + env(safe-area-inset-top));font:500 .45rem/1.72 var(--mono);letter-spacing:.08em;color:#9d9188;text-shadow:0 1px 6px #000;pointer-events:none}.caption{position:fixed;z-index:8;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));width:min(54vw,340px);padding:10px 12px;border:1px solid rgba(100,85,78,.4);background:rgba(7,7,8,.72);backdrop-filter:blur(5px)}.caption b{font-size:.76rem;letter-spacing:.15em}.caption p{margin:5px 0 0;color:#b9aea4;font-size:.61rem;line-height:1.8}.controls{position:fixed;z-index:10;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px}.controls button{min-height:54px;border:1px solid #4d423c;background:linear-gradient(180deg,rgba(30,21,22,.94),rgba(7,7,8,.94));color:#eee4d8;font:800 .69rem var(--serif);letter-spacing:.08em;touch-action:none}.controls button.is-held{background:#eee4d8;color:#160f10}.veil{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(ellipse at center,#241522,#050606 72%)}.veil.off{display:none}.veil small{font:.52rem var(--mono);letter-spacing:.32em;color:#a18d87}.veil h1{margin:14px 0 8px;font-size:clamp(2.2rem,10vw,4.4rem);letter-spacing:.11em}.veil p{max-width:31em;font-size:.76rem;line-height:2;color:#b9aaa1}.veil button{margin-top:26px;border:1px solid #827168;background:#090808;color:#eee4d8;padding:14px 44px;font:800 .9rem var(--serif);letter-spacing:.24em}.cross{position:fixed;z-index:7;left:50%;top:50%;width:5px;height:5px;border:1px solid rgba(230,220,210,.3);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}@media(max-width:700px){.caption{width:58vw}.controls button{font-size:.65rem}}

<body>
<canvas id="c"></canvas><div class="grade"></div><div class="grain"></div><div class="cross"></div>
<div class="top"><small>BUKIYA ARCADE / WIP 0.8</small><b>不氣屋アーケード</b><span class="sp"></span><button id="reset">正面</button></div>
<div class="readout">一人称視点 / 目線高 約1.72m<br>施工中：妹字屋のみ営業形態<br>他区画：コンクリート躯体</div>
<div class="caption"><b id="shopName">妹字屋</b><p id="shopText">読める。意味は、まだ読めない。</p></div>
<div class="controls"><button id="back">後退</button><button id="forward">前進</button><button id="turnL">左を見る</button><button id="turnR">右を見る</button></div>
<div class="veil" id="veil"><small>観測所・余興 / 改装中</small><h1>不氣屋アーケード</h1><p>狭い。暗い。配管は多い。<br>妹字屋だけが先に店の顔を持っている。</p><button id="enter">入る</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.92;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050607);scene.fog=new THREE.Fog(0x08090a,6,42);const camera=new THREE.PerspectiveCamera(62,1,.04,100);const resize=()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()};addEventListener('resize',resize);resize();
const mat=(c,r=.92,m=.03,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:e?new THREE.Color(c):new THREE.Color(0),emissiveIntensity:e});const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);const cyl=(r,h,m,seg=10)=>new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),m);const add=(o,x,y,z)=>{o.position.set(x,y,z);scene.add(o);return o};
scene.add(new THREE.HemisphereLight(0x76687d,0x181313,.66));const key=new THREE.DirectionalLight(0x9b745e,.46);key.position.set(-3,7,4);scene.add(key);
const PASSAGE_HALF=1.72,SHOP_FRONT=1.92,ROOF_Y=3.72;
function texConcrete(){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#5b5855';g.fillRect(0,0,512,512);for(let i=0;i<1500;i++){const a=.02+Math.random()*.07;g.fillStyle=`rgba(${Math.random()<.45?20:220},${Math.random()<.45?18:215},${Math.random()<.45?17:205},${a})`;g.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*14,1+Math.random()*3)}for(let i=0;i<12;i++){g.strokeStyle='rgba(24,20,18,.16)';g.beginPath();let x=Math.random()*512,y=Math.random()*512;g.moveTo(x,y);for(let j=0;j<6;j++){x+=(Math.random()-.5)*36;y+=18+Math.random()*25;g.lineTo(x,y)}g.stroke()}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}const concreteTex=texConcrete();
const concrete=new THREE.MeshStandardMaterial({map:concreteTex,roughness:.99,metalness:0});
add(box(PASSAGE_HALF*2,.08,100,mat(0x232323,.99,0)),0,-.04,-18);add(box(.13,.10,100,mat(0x514b47,.98,0)),-PASSAGE_HALF,.03,-18);add(box(.13,.10,100,mat(0x514b47,.98,0)),PASSAGE_HALF,.03,-18);
add(box(3.72,.07,100,new THREE.MeshStandardMaterial({color:0x242629,transparent:true,opacity:.5,roughness:.45,metalness:.12})),0,ROOF_Y,-18);for(let z=-65;z<30;z+=2.7)add(box(3.9,.08,.10,mat(0x363739,.82,.14)),0,ROOF_Y-.04,z);
// アーケード中央の古い蛍光灯
const lights=[];for(let z=18;z>-62;z-=6.1){const warm=(Math.floor(z)%3===0);const c=warm?0xffd6a6:0xcfe8df;const tube=add(box(.95,.035,.08,new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.7,roughness:.5})),0,3.47,z);const p=new THREE.PointLight(c,.23,4.4);p.position.set(0,3.25,z);p.userData.seed=z*.71;scene.add(p);lights.push(p)}
function texSign(text,bg,fg,sub=''){const c=document.createElement('canvas');c.width=700;c.height=220;const g=c.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,700,220);for(let i=0;i<180;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.15})`;g.fillRect(Math.random()*700,Math.random()*220,2+Math.random()*28,1+Math.random()*3)}g.strokeStyle='rgba(255,255,255,.08)';g.strokeRect(10,10,680,200);g.fillStyle=fg;g.font="800 76px 'Shippori Mincho B1',serif";g.textAlign='center';g.textBaseline='middle';g.fillText(text,350,104);if(sub){g.font="500 20px 'IBM Plex Mono',monospace";g.fillText(sub,350,174)}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function planeFace(w,h,tex,side,x,y,z){const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide,transparent:true}));p.position.set(x,y,z);p.rotation.y=side<0?Math.PI/2:-Math.PI/2;scene.add(p);return p}
const shopCenters=[],neons=[];
function rawUnit(side,z){const x=side*2.85;const shell=box(1.85,3.55,5.85,concrete);shell.position.set(x,1.78,z);scene.add(shell);const front=box(.10,3.35,5.55,concrete);front.position.set(side*SHOP_FRONT,1.68,z);scene.add(front);for(let i=0;i<4;i++){const rust=box(.025,.8+.3*(i%2),.04,mat(0x665249,.92,.12));rust.position.set(side*(SHOP_FRONT-.08),.62+i*.7,z-2.15+i*1.3);scene.add(rust)}shopCenters.push({z,side,name:'未施工',text:'まだコンクリートの壁しかない。'})}
function imojiShop(side,z,idx){const x=side*2.86;add(box(1.9,3.65,5.9,mat(0x141313,.98,.01)),x,1.83,z);const frontX=side*SHOP_FRONT;
// 黒い外壁と奥まった開口
add(box(.12,3.45,5.55,mat(0x171514,.95,.02)),frontX,1.72,z);add(box(.10,2.18,2.55,mat(0x050505,.99,0)),frontX-side*.05,1.18,z-.25);
// 引戸の金属枠と半透明ガラス
for(const zz of [-1.12,.62])add(box(.07,2.18,.06,mat(0x5d524a,.7,.22)),frontX-side*.12,1.18,z+zz);add(box(.07,.06,2.5,mat(0x5d524a,.7,.22)),frontX-side*.12,2.26,z-.25);add(box(.07,.06,2.5,mat(0x5d524a,.7,.22)),frontX-side*.12,.10,z-.25);
// 看板
add(box(.22,.82,4.55,mat(0x231321,.78,.04)),frontX,3.02,z);planeFace(4.32,.67,texSign('妹字屋','#241321','#ffd39a','IM0JI / PRIVATE SCRIPT'),side,frontX-side*.13,3.02,z);
// 小さい縦看板
add(box(.20,1.5,.62,mat(0x2a171f,.8,.05)),frontX,2.02,z+2.17);planeFace(.52,1.36,texSign('妹字','#2a171f','#ffd39a'),side,frontX-side*.12,2.02,z+2.17);
// 店内の黒棚と金色の妹字札
for(let r=0;r<3;r++){add(box(.42,.05,2.25,mat(0x302723,.9,.03)),side*1.54,.52+r*.57,z-.2);for(let k=0;k<5;k++){const plate=add(box(.04,.24,.26,mat(0x0b0a09,.95,.01)),side*1.31,.70+r*.57,z-1.05+k*.48);const mark=new THREE.Mesh(new THREE.PlaneGeometry(.20,.18),new THREE.MeshBasicMaterial({color:0xd9ad54,side:THREE.DoubleSide}));mark.position.set(side*1.285,.70+r*.57,z-1.05+k*.48);mark.rotation.y=side<0?Math.PI/2:-Math.PI/2;scene.add(mark)}}
// 黒和紙の束、作業台、瓶
add(box(.56,.72,1.15,mat(0x33251f,.93,.02)),side*1.39,.36,z+1.25);for(let i=0;i<7;i++)add(box(.025,.012,.52,mat(0x0b0a09,.99,0)),side*1.08+i*.008,.78+i*.009,z+1.2);for(let i=0;i<3;i++){const b=cyl(.055,.24,mat(i===0?0x6a4a25:0x3d332d,.65,.08),12);b.position.set(side*1.16,.91,z+1.62+i*.18);scene.add(b)}
// 配管地獄
for(let p=0;p<8;p++){const pipe=cyl(.028+(p%3)*.012,1.7+(p%4)*.32,mat(p%2?0x655148:0x445150,.77,.22));pipe.position.set(side*(1.74+.05*(p%3)),1.48+(p%4)*.38,z-2.45+p*.69);pipe.rotation.z=side*(.05+(p%5)*.05);scene.add(pipe)}
// 紫ネオンと琥珀の店内灯
const nc=0x9a5dff;add(box(.055,.055,1.15,new THREE.MeshStandardMaterial({color:nc,emissive:nc,emissiveIntensity:2.5})),side*1.78,2.54,z+2.0);const np=new THREE.PointLight(nc,.78,5);np.position.set(side*1.48,2.45,z+2.0);np.userData.seed=idx*2.4;scene.add(np);neons.push(np);const amber=new THREE.PointLight(0xffb66a,.58,4.2);amber.position.set(side*1.36,1.75,z-.25);scene.add(amber);
shopCenters.push({z,side,name:'妹字屋',text:'読める。意味は、まだ読めない。'})}
let idx=0;for(let z=18;z>-64;z-=6.7){if(idx===0)imojiShop(-1,z,idx);else rawUnit(-1,z);if(idx===4)imojiShop(1,z,idx+1);else rawUnit(1,z);idx++}
// 地面の割れ、排水溝、濡れた跡
for(let z=19;z>-62;z-=8.6){add(box(.34,.018,2.0,mat(0x101112,.85,.16)),0,.012,z);for(let i=0;i<7;i++)add(box(.32,.022,.035,mat(0x55585a,.72,.3)),0,.026,z-.85+i*.27)}
for(let i=0;i<9;i++){const puddle=new THREE.Mesh(new THREE.PlaneGeometry(.65+(i%3)*.3,1.15+(i%2)*.55),new THREE.MeshStandardMaterial({color:0x1a2021,roughness:.22,metalness:.08,transparent:true,opacity:.52}));puddle.rotation.x=-Math.PI/2;puddle.position.set((i%2?-.75:.82)+(i%3)*.08,.012,14-i*8.3);scene.add(puddle)}
// 無意味な配管とケーブル。意図的に不均等
for(let i=0;i<24;i++){const side=i%2?-1:1;const z=19-i*3.35+(i%4)*.43;const p=cyl(.02+(i%5)*.008,1.1+(i%6)*.3,mat(i%3?0x394143:0x644a42,.8,.2));p.position.set(side*(1.46+(i%4)*.07),1.25+(i%5)*.47,z);p.rotation.z=side*(.04+(i%5)*.052);scene.add(p)}
for(let i=0;i<13;i++){const geo=new THREE.BufferGeometry();const y=3.18-(i%4)*.14,z=18-i*6.15;const pts=new Float32Array([-1.55,y,z, -.55,y-.12-(i%3)*.08,z+.18, .55,y-.04,z-.12, 1.55,y-.18,z+.08]);geo.setAttribute('position',new THREE.BufferAttribute(pts,3));scene.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:i%3===0?0x5f3b43:0x262b2c,transparent:true,opacity:.75})))}
// 壁の謎ステッカー、番号札、配電箱
for(let i=0;i<14;i++){const side=i%2?-1:1,z=16-i*5.1;add(box(.12,.48,.38,mat(0x555757,.82,.16)),side*1.76,1.25+(i%3)*.5,z);if(i%4===0)add(box(.16,.26,.5,mat(0x8b734f,.9,.04)),side*1.72,.38,z+.6)}
let px=0,pz=15,yaw=0,targetYaw=0,pitch=0,targetPitch=0,moving=0,started=false,drag=false,lastX=0,lastY=0,walkT=0,moveBlend=0,currentShop=null;
function nearestShop(){let best=shopCenters[0],d=1e9;for(const q of shopCenters){const dd=Math.hypot(q.z-pz,q.side*SHOP_FRONT-px);if(dd<d){d=dd;best=q}}currentShop=best;document.getElementById('shopName').textContent=best.name;document.getElementById('shopText').textContent=best.text}
function bindHold(id,val){const b=document.getElementById(id);const on=e=>{e.preventDefault();moving=val;b.classList.add('is-held')};const off=e=>{e.preventDefault();if(moving===val)moving=0;b.classList.remove('is-held')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}bindHold('forward',1);bindHold('back',-1);document.getElementById('turnL').onclick=()=>targetYaw+=Math.PI/4;document.getElementById('turnR').onclick=()=>targetYaw-=Math.PI/4;document.getElementById('reset').onclick=()=>{targetYaw=0;targetPitch=0};canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;targetYaw-=(e.clientX-lastX)*.0065;targetPitch-=(e.clientY-lastY)*.0048;targetPitch=THREE.MathUtils.clamp(targetPitch,-1.05,1.05);lastX=e.clientX;lastY=e.clientY});const endDrag=e=>{drag=false;canvas.releasePointerCapture?.(e.pointerId)};canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')moving=1;if(e.key==='s'||e.key==='ArrowDown')moving=-1;if(e.key==='a'||e.key==='ArrowLeft')targetYaw+=.12;if(e.key==='d'||e.key==='ArrowRight')targetYaw-=.12});addEventListener('keyup',e=>{if(['w','s','ArrowUp','ArrowDown'].includes(e.key))moving=0});
const clock=new THREE.Clock();const dir=new THREE.Vector3(),look=new THREE.Vector3();function animate(t){requestAnimationFrame(animate);if(!started)return;const dt=Math.min(clock.getDelta(),.05);yaw=THREE.MathUtils.lerp(yaw,targetYaw,.18);pitch=THREE.MathUtils.lerp(pitch,targetPitch,.18);const movingNow=Math.abs(moving)>0;moveBlend+=(Number(movingNow)-moveBlend)*Math.min(1,dt*7);if(movingNow){const speed=1.02*moving;px+=Math.sin(yaw)*speed*dt;pz-=Math.cos(yaw)*speed*dt;px=THREE.MathUtils.clamp(px,-1.32,1.32);pz=THREE.MathUtils.clamp(pz,-60,20);nearestShop()}walkT+=dt*(5.2+moveBlend);const bobY=Math.abs(Math.sin(walkT))*0.014*moveBlend;const sway=Math.sin(walkT*.5)*0.008*moveBlend;camera.position.set(px+sway,1.72+bobY,pz);dir.set(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));look.copy(camera.position).add(dir);camera.lookAt(look);for(const n of neons)n.intensity=.48+.36*(Math.sin(t*.008+n.userData.seed)>.05?1:.10);for(const l of lights)l.intensity=.18+.08*(Math.sin(t*.004+l.userData.seed)>.92?.25:1);renderer.render(scene,camera)}requestAnimationFrame(animate);document.getElementById('enter').onclick=()=>{document.getElementById('veil').classList.add('off');started=true;clock.start();nearestShop()};
</script>
