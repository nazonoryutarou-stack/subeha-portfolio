<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>不氣屋アーケード WIP 0.2</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#eee6dc;--dim:#95887e;--line:#4a3b35;--bg:#050606;--red:#ff3155;--cyan:#47f3df;--vio:#aa68ff;--serif:'Shippori Mincho B1',serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}body{font-family:var(--serif);touch-action:none}#c{position:fixed;inset:0;width:100%;height:100%;display:block}.grade{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 30%,rgba(0,0,0,.72) 100%),linear-gradient(180deg,rgba(20,4,25,.08),rgba(0,0,0,.28));mix-blend-mode:multiply}.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.11;background-image:radial-gradient(circle,rgba(255,255,255,.22) 0 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}.top{position:fixed;z-index:8;left:0;right:0;top:0;display:flex;gap:10px;align-items:center;padding:calc(9px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(180deg,rgba(4,5,5,.9),transparent);pointer-events:none}.top small{font:500 .48rem var(--mono);letter-spacing:.2em;color:#a99c91}.top b{font-size:.86rem;letter-spacing:.17em}.top .sp{flex:1}.top button{pointer-events:auto;border:1px solid #5d4b43;background:rgba(8,8,8,.78);color:#ddd1c5;padding:7px 9px;font:500 .54rem var(--mono)}.readout{position:fixed;z-index:8;left:12px;top:calc(48px + env(safe-area-inset-top));font:500 .5rem/1.75 var(--mono);letter-spacing:.08em;color:#a79a90;text-shadow:0 1px 6px #000;pointer-events:none}.caption{position:fixed;z-index:8;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));width:min(55vw,350px);padding:10px 12px;border:1px solid rgba(100,85,78,.4);background:rgba(7,7,8,.76);backdrop-filter:blur(5px)}.caption b{font-size:.76rem;letter-spacing:.15em}.caption p{margin:5px 0 0;color:#b9aea4;font-size:.61rem;line-height:1.8}.controls{position:fixed;z-index:10;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px}.controls button{min-height:56px;border:1px solid #4d423c;background:linear-gradient(180deg,rgba(30,21,22,.94),rgba(7,7,8,.94));color:#eee4d8;font:800 .72rem var(--serif);letter-spacing:.08em;touch-action:none}.controls button.is-held{background:#eee4d8;color:#160f10}.veil{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(ellipse at center,#211420,#050606 72%)}.veil.off{display:none}.veil small{font:.52rem var(--mono);letter-spacing:.32em;color:#a18d87}.veil h1{margin:14px 0 8px;font-size:clamp(2.2rem,10vw,4.4rem);letter-spacing:.11em}.veil p{max-width:31em;font-size:.76rem;line-height:2;color:#b9aaa1}.veil button{margin-top:26px;border:1px solid #827168;background:#090808;color:#eee4d8;padding:14px 44px;font:800 .9rem var(--serif);letter-spacing:.24em}.meter{margin-top:16px;font:500 .52rem var(--mono);color:#8f8178;letter-spacing:.08em}.error{color:#ff9aa7}
@media(max-width:700px){.readout{font-size:.46rem}.caption{width:58vw}.controls button{font-size:.66rem}}
</style>
</head>
<body>
<canvas id="c"></canvas><div class="grade"></div><div class="grain"></div>
<div class="top"><small>BUKIYA ARCADE / WIP 0.2</small><b>不氣屋アーケード</b><span class="sp"></span><button id="reset">視点戻</button></div>
<div class="readout" id="readout">実寸基準：1 unit = 1 m<br>人物：185 cm<br>通路幅：約3.6 m<br>天井高：約4.15 m</div>
<div class="caption"><b id="shopName">妹字屋</b><p id="shopText">読める。意味は、まだ読めない。</p></div>
<div class="controls"><button id="back">後退</button><button id="forward">前進</button><button id="turnL">左を見る</button><button id="turnR">右を見る</button></div>
<div class="veil" id="veil"><small>観測所・余興 / 改装中</small><h1>不氣屋アーケード</h1><p>視点と建物を実寸寄りに組み直した。<br>185cmの制作者本人を歩かせて、店の大きさを測る。<br>狭い。汚い。配管は相変わらず意味がない。</p><div class="meter" id="loadState">3Dモデル：約2.4MB</div><button id="enter">入る</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.88;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050607);scene.fog=new THREE.Fog(0x09090b,7,44);
const camera=new THREE.PerspectiveCamera(52,1,.05,100);
const resize=()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()};addEventListener('resize',resize);resize();
const mat=(c,r=.92,m=.03)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
const cyl=(r,h,m)=>new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,8),m);
const add=(o,x,y,z)=>{o.position.set(x,y,z);scene.add(o);return o};
scene.add(new THREE.HemisphereLight(0x87738e,0x171312,.7));
const key=new THREE.DirectionalLight(0x8d6b5d,.65);key.position.set(-3,7,4);scene.add(key);

// 1 unit = 1 metre. Human scale is calibrated to 1.85 m after loading.
const FLOOR_Y=0, PASSAGE_HALF=1.8, SHOP_FRONT=2.0, ROOF_Y=4.15;
add(box(PASSAGE_HALF*2,.08,100,mat(0x282625,.98,0)),0,-.04,-18);
add(box(.16,.12,100,mat(0x55504b,.98,0)),-PASSAGE_HALF,.04,-18);add(box(.16,.12,100,mat(0x55504b,.98,0)),PASSAGE_HALF,.04,-18);
const roof=add(box(4.15,.08,100,new THREE.MeshStandardMaterial({color:0x2e3033,transparent:true,opacity:.35,roughness:.42,metalness:.16})),0,ROOF_Y,-18);
for(let z=-65;z<30;z+=3.4)add(box(4.05,.09,.12,mat(0x3d3d3f,.8,.18)),0,ROOF_Y-.05,z);

function texSign(text,bg,fg){const c=document.createElement('canvas');c.width=600;c.height=180;const g=c.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,600,180);for(let i=0;i<120;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.12})`;g.fillRect(Math.random()*600,Math.random()*180,2+Math.random()*22,1+Math.random()*2)}g.fillStyle=fg;g.font="800 64px 'Shippori Mincho B1',serif";g.textAlign='center';g.textBaseline='middle';g.fillText(text,300,92);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const shops=[['妹字屋','#2c182f','#ffd0f2','読める。意味は、まだ読めない。'],['ヤニヴ','#613423','#ffb986','灰皿の数だけは信用できる。'],['理論堂','#163f42','#a6fff4','説明は増えたが、納得は減った。'],['空店舗','#363332','#aea49d','閉店理由だけが貼られていない。'],['祭祀具','#5b222d','#ff9baa','効能より、置いた時の気配。'],['壊傘','#30375d','#c5d0ff','壊れたものだけが整然と並ぶ。']];
const shopCenters=[];
function storefront(side,z,data,idx){const x=side*3.0;const body=add(box(2.0,4.0,6.0,mat(0x171515,.97,.01)),x,2.0,z);body.castShadow=body.receiveShadow=true;const frontX=side*SHOP_FRONT;const shutter=add(box(.10,2.05,3.25,mat(0x4b4948,.9,.12)),frontX,1.05,z);for(let y=.2;y<2;y+=.21)add(box(.055,.025,3.1,mat(0x232223,.9,.05)),frontX-side*.06,y,z);const sign=add(box(.18,.72,4.4,mat(parseInt(data[1].slice(1),16),.78,.05)),frontX,3.18,z);const face=new THREE.Mesh(new THREE.PlaneGeometry(4.2,.62),new THREE.MeshBasicMaterial({map:texSign(data[0],data[1],data[2]),side:THREE.DoubleSide}));face.position.set(frontX-side*.10,3.18,z);face.rotation.y=side<0?Math.PI/2:-Math.PI/2;scene.add(face);
// dirty crates and bins at actual human scale
for(let j=0;j<2+(idx%3);j++)add(box(.45,.32,.48,mat(0x41342d,.96,.01)),side*1.63,.16+j*.18,z-1.85+j*.48);
// pipes: intentionally excessive, but with plausible diameters 5-9cm
for(let p=0;p<4+(idx%3);p++){const pipe=cyl(.035+(p%2)*.012,2.2+(p%3)*.35,mat(p%2?0x5b5550:0x495957,.78,.22));pipe.position.set(side*(1.92+.08*p),2.25+(p%2)*.38,z-2.3+p*.78);pipe.rotation.z=side*(p%2?.12:-.08);scene.add(pipe)}
if(idx%2===0){const c=[0xff3155,0x47f3df,0xaa68ff][idx%3];const n=add(box(.08,.08,1.25,new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:2.2,roughness:.45})),side*1.87,2.6,z+2.25);n.rotation.x=.18;const pl=new THREE.PointLight(c,.55,4.5);pl.position.set(side*1.5,2.5,z+2.2);pl.userData.seed=idx*3.7;scene.add(pl);neons.push(pl)}
shopCenters.push({z,side,name:data[0],text:data[3]});}
const neons=[];let idx=0;for(let z=18;z>-64;z-=6.7){storefront(-1,z,shops[idx%shops.length],idx);storefront(1,z,shops[(idx+3)%shops.length],idx+1);idx++}
// overhead pipes and cables lower than the roof, forcing a cramped feeling
for(let z=20;z>-64;z-=7.2){for(let k=0;k<3;k++){const p=cyl(.025+k*.008,3.7,mat(k===1?0x58433b:0x30383a,.78,.18));p.rotation.z=Math.PI/2;p.position.set(0,3.55-k*.18,z+k*.18);scene.add(p)}}

let player=new THREE.Group();scene.add(player);player.position.set(0,0,15);let vrmRoot=null,bones={},baseRot={};
const modelUrl=(location.hostname.endsWith('github.io')?'/subeha-portfolio':'')+'/subeha-web-site.vrm';
const loader=new GLTFLoader();
function findBone(root,patterns){let found=null;root.traverse(o=>{if(found)return;const n=(o.name||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(o.isBone&&patterns.some(p=>n.includes(p)))found=o});return found}
async function loadModel(){const gltf=await loader.loadAsync(modelUrl);vrmRoot=gltf.scene;const bounds=new THREE.Box3().setFromObject(vrmRoot),size=bounds.getSize(new THREE.Vector3());const scale=1.85/Math.max(.001,size.y);vrmRoot.scale.setScalar(scale);vrmRoot.updateMatrixWorld(true);const b2=new THREE.Box3().setFromObject(vrmRoot);const min=b2.min;vrmRoot.position.y-=min.y;vrmRoot.rotation.y=Math.PI;player.add(vrmRoot);vrmRoot.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
bones={lUL:findBone(vrmRoot,['jbiplupperleg','leftupperleg']),rUL:findBone(vrmRoot,['jbiprupperleg','rightupperleg']),lLL:findBone(vrmRoot,['jbipllowerleg','leftlowerleg']),rLL:findBone(vrmRoot,['jbiprlowerleg','rightlowerleg']),lUA:findBone(vrmRoot,['jbiplupperarm','leftupperarm']),rUA:findBone(vrmRoot,['jbiprupperarm','rightupperarm']),hips:findBone(vrmRoot,['jbipc hips'.replace(/ /g,''),'hips'])};Object.entries(bones).forEach(([k,b])=>{if(b)baseRot[k]=b.rotation.clone()});document.getElementById('loadState').textContent='185cmに実寸補正済み';}
loadModel().catch(e=>{console.error(e);document.getElementById('loadState').innerHTML='<span class="error">VRM読込失敗。街だけ表示する。</span>'});

let moving=0,lookYaw=0,targetLookYaw=0,pitch=.04,camDist=3.4,walkT=0,started=false,drag=false,lastX=0,lastY=0;
function poseWalk(speed,dt){if(!vrmRoot)return;walkT+=dt*(speed?7.5:2);const a=speed?Math.sin(walkT)*.52:Math.sin(walkT*.35)*.02;const arm=-a*.72;const set=(b,base,x=0,y=0,z=0)=>{if(!b||!base)return;b.rotation.set(base.x+x,base.y+y,base.z+z)};set(bones.lUL,baseRot.lUL,a);set(bones.rUL,baseRot.rUL,-a);set(bones.lLL,baseRot.lLL,Math.max(0,-a)*.62);set(bones.rLL,baseRot.rLL,Math.max(0,a)*.62);set(bones.lUA,baseRot.lUA,arm);set(bones.rUA,baseRot.rUA,-arm);if(bones.hips&&baseRot.hips)bones.hips.position.y=Math.abs(Math.sin(walkT*2))*.018;}
function nearestShop(){let best=shopCenters[0],d=1e9;for(const q of shopCenters){const dd=Math.abs(q.z-player.position.z);if(dd<d){d=dd;best=q}}document.getElementById('shopName').textContent=best.name;document.getElementById('shopText').textContent=best.text;}
function bindHold(id,val){const b=document.getElementById(id);const on=e=>{e.preventDefault();moving=val;b.classList.add('is-held')};const off=e=>{e.preventDefault();if(moving===val)moving=0;b.classList.remove('is-held')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}
bindHold('forward',1);bindHold('back',-1);document.getElementById('turnL').onclick=()=>targetLookYaw=Math.max(-1.1,targetLookYaw-.35);document.getElementById('turnR').onclick=()=>targetLookYaw=Math.min(1.1,targetLookYaw+.35);document.getElementById('reset').onclick=()=>{targetLookYaw=0;pitch=.04;camDist=3.4};
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('pointermove',e=>{if(!drag)return;targetLookYaw+= (e.clientX-lastX)*.006;pitch-= (e.clientY-lastY)*.003;targetLookYaw=THREE.MathUtils.clamp(targetLookYaw,-1.2,1.2);pitch=THREE.MathUtils.clamp(pitch,-.06,.28);lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);addEventListener('wheel',e=>{camDist=THREE.MathUtils.clamp(camDist+e.deltaY*.004,2.6,5.8)},{passive:true});
addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')moving=1;if(e.key==='s'||e.key==='ArrowDown')moving=-1;if(e.key==='a'||e.key==='ArrowLeft')targetLookYaw-=.16;if(e.key==='d'||e.key==='ArrowRight')targetLookYaw+=.16});addEventListener('keyup',e=>{if(['w','s','ArrowUp','ArrowDown'].includes(e.key))moving=0});

const clock=new THREE.Clock();function animate(t){requestAnimationFrame(animate);if(!started)return;const dt=Math.min(clock.getDelta(),.05);if(moving){player.position.z-=moving*1.15*dt;player.position.z=THREE.MathUtils.clamp(player.position.z,-60,20);nearestShop()}poseWalk(moving,dt);lookYaw=THREE.MathUtils.lerp(lookYaw,targetLookYaw,.1);const followZ=player.position.z+camDist;const cx=Math.sin(lookYaw)*camDist*.8;camera.position.lerp(new THREE.Vector3(cx,1.58+Math.sin(pitch)*.55,followZ),.12);camera.lookAt(player.position.x+Math.sin(lookYaw)*1.4,1.20+pitch,player.position.z-1.05);for(const n of neons)n.intensity=.38+.28*(Math.sin(t*.008+n.userData.seed)>.12?1:.12);renderer.render(scene,camera)}requestAnimationFrame(animate);
document.getElementById('enter').onclick=()=>{document.getElementById('veil').classList.add('off');started=true;clock.start();nearestShop()};
</script>
</body>
</html>
