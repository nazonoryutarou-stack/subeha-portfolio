<!doctype html>
<html lang="ja">

<title>不氣屋アーケード WIP 0.7</title>

<style>
:root{--ink:#eee6dc;--dim:#95887e;--bg:#050606;--serif:'Shippori Mincho B1',serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}body{font-family:var(--serif);touch-action:none}#c{position:fixed;inset:0;width:100%;height:100%;display:block}.grade{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 34%,rgba(0,0,0,.66) 100%),linear-gradient(180deg,rgba(20,4,25,.06),rgba(0,0,0,.22));mix-blend-mode:multiply}.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.1;background-image:radial-gradient(circle,rgba(255,255,255,.2) 0 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}.top{position:fixed;z-index:8;left:0;right:0;top:0;display:flex;gap:10px;align-items:center;padding:calc(9px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(180deg,rgba(4,5,5,.86),transparent);pointer-events:none}.top small{font:500 .48rem var(--mono);letter-spacing:.2em;color:#a99c91}.top b{font-size:.86rem;letter-spacing:.17em}.top .sp{flex:1}.top button{pointer-events:auto;border:1px solid #5d4b43;background:rgba(8,8,8,.78);color:#ddd1c5;padding:7px 9px;font:500 .54rem var(--mono)}.readout{position:fixed;z-index:8;left:12px;top:calc(48px + env(safe-area-inset-top));font:500 .48rem/1.75 var(--mono);letter-spacing:.08em;color:#a79a90;text-shadow:0 1px 6px #000;pointer-events:none}.caption{position:fixed;z-index:8;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));width:min(54vw,340px);padding:10px 12px;border:1px solid rgba(100,85,78,.4);background:rgba(7,7,8,.7);backdrop-filter:blur(5px)}.caption b{font-size:.76rem;letter-spacing:.15em}.caption p{margin:5px 0 0;color:#b9aea4;font-size:.61rem;line-height:1.8}.controls{position:fixed;z-index:10;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px}.controls button{min-height:56px;border:1px solid #4d423c;background:linear-gradient(180deg,rgba(30,21,22,.94),rgba(7,7,8,.94));color:#eee4d8;font:800 .72rem var(--serif);letter-spacing:.08em;touch-action:none}.controls button.is-held{background:#eee4d8;color:#160f10}.veil{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(ellipse at center,#211420,#050606 72%)}.veil.off{display:none}.veil small{font:.52rem var(--mono);letter-spacing:.32em;color:#a18d87}.veil h1{margin:14px 0 8px;font-size:clamp(2.2rem,10vw,4.4rem);letter-spacing:.11em}.veil p{max-width:31em;font-size:.76rem;line-height:2;color:#b9aaa1}.veil button{margin-top:26px;border:1px solid #827168;background:#090808;color:#eee4d8;padding:14px 44px;font:800 .9rem var(--serif);letter-spacing:.24em}.cross{position:fixed;z-index:7;left:50%;top:50%;width:5px;height:5px;border:1px solid rgba(230,220,210,.35);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}@media(max-width:700px){.readout{font-size:.44rem}.caption{width:58vw}.controls button{font-size:.66rem}}

<body>
<canvas id="c"></canvas><div class="grade"></div><div class="grain"></div><div class="cross"></div>
<div class="top"><small>BUKIYA ARCADE / WIP 0.7</small><b>不氣屋アーケード</b><span class="sp"></span><button id="reset">正面</button></div>
<div class="readout">一人称視点 / 目線高 約1.72m<br>ドラッグ：見回す<br>前進・後退：向いている方向へ移動</div>
<div class="caption"><b id="shopName">妹字屋</b><p id="shopText">読める。意味は、まだ読めない。</p></div>
<div class="controls"><button id="back">後退</button><button id="forward">前進</button><button id="turnL">左を見る</button><button id="turnR">右を見る</button></div>
<div class="veil" id="veil"><small>観測所・余興 / 改装中</small><h1>不氣屋アーケード</h1><p>人物を眺めるのをやめた。<br>ここからは自分の目で、店とアーケードを見る。</p><button id="enter">入る</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050607);scene.fog=new THREE.Fog(0x09090b,7,44);const camera=new THREE.PerspectiveCamera(62,1,.04,100);const resize=()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()};addEventListener('resize',resize);resize();
const mat=(c,r=.92,m=.03)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);const cyl=(r,h,m)=>new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,8),m);const add=(o,x,y,z)=>{o.position.set(x,y,z);scene.add(o);return o};
scene.add(new THREE.HemisphereLight(0x87738e,0x171312,.8));const key=new THREE.DirectionalLight(0x9b7460,.65);key.position.set(-3,7,4);scene.add(key);
const PASSAGE_HALF=1.8,SHOP_FRONT=2.0,ROOF_Y=4.15;add(box(PASSAGE_HALF*2,.08,100,mat(0x282625,.98,0)),0,-.04,-18);add(box(.16,.12,100,mat(0x55504b,.98,0)),-PASSAGE_HALF,.04,-18);add(box(.16,.12,100,mat(0x55504b,.98,0)),PASSAGE_HALF,.04,-18);add(box(4.15,.08,100,new THREE.MeshStandardMaterial({color:0x2e3033,transparent:true,opacity:.35,roughness:.42,metalness:.16})),0,ROOF_Y,-18);for(let z=-65;z<30;z+=3.4)add(box(4.05,.09,.12,mat(0x3d3d3f,.8,.18)),0,ROOF_Y-.05,z);
function texSign(text,bg,fg){const c=document.createElement('canvas');c.width=600;c.height=180;const g=c.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,600,180);for(let i=0;i<120;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.12})`;g.fillRect(Math.random()*600,Math.random()*180,2+Math.random()*22,1+Math.random()*2)}g.fillStyle=fg;g.font="800 64px 'Shippori Mincho B1',serif";g.textAlign='center';g.textBaseline='middle';g.fillText(text,300,92);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const shopCenters=[],neons=[];
function storefront(side,z,isImoji,idx){const x=side*3.0;add(box(2.0,4.0,6.0,mat(isImoji?0x171515:0x4a4846,.97,.01)),x,2,z);const frontX=side*SHOP_FRONT;if(!isImoji){add(box(.12,3.7,5.7,mat(0x575451,.99,0)),frontX,1.85,z);shopCenters.push({z,side,name:'未施工',text:'まだコンクリートの壁しかない。'});return}
add(box(.10,2.05,3.25,mat(0x4b4948,.9,.12)),frontX,1.05,z);for(let y=.2;y<2;y+=.21)add(box(.055,.025,3.1,mat(0x232223,.9,.05)),frontX-side*.06,y,z);add(box(.18,.72,4.4,mat(0x2c182f,.78,.05)),frontX,3.18,z);const face=new THREE.Mesh(new THREE.PlaneGeometry(4.2,.62),new THREE.MeshBasicMaterial({map:texSign('妹字屋','#2c182f','#ffd0f2'),side:THREE.DoubleSide}));face.position.set(frontX-side*.10,3.18,z);face.rotation.y=side<0?Math.PI/2:-Math.PI/2;scene.add(face);for(let j=0;j<3;j++)add(box(.45,.32,.48,mat(0x41342d,.96,.01)),side*1.63,.16+j*.18,z-1.85+j*.48);for(let p=0;p<6;p++){const pipe=cyl(.035+(p%2)*.012,2.2+(p%3)*.35,mat(p%2?0x5b5550:0x495957,.78,.22));pipe.position.set(side*(1.92+.08*p),2.25+(p%2)*.38,z-2.3+p*.78);pipe.rotation.z=side*(p%2?.12:-.08);scene.add(pipe)}const c=0xaa68ff;add(box(.08,.08,1.25,new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:2.4,roughness:.45})),side*1.87,2.6,z+2.25);const pl=new THREE.PointLight(c,.72,5);pl.position.set(side*1.5,2.5,z+2.2);pl.userData.seed=idx*3.7;scene.add(pl);neons.push(pl);shopCenters.push({z,side,name:'妹字屋',text:'読める。意味は、まだ読めない。'})}
let idx=0;for(let z=18;z>-64;z-=6.7){storefront(-1,z,idx===0,idx);storefront(1,z,idx===4,idx+1);idx++}
for(let z=20;z>-64;z-=7.2){for(let k=0;k<3;k++){const p=cyl(.025+k*.008,3.7,mat(k===1?0x58433b:0x30383a,.78,.18));p.rotation.z=Math.PI/2;p.position.set(0,3.55-k*.18,z+k*.18);scene.add(p)}}
// 意味のない配管とケーブル。均等にしない。
for(let i=0;i<18;i++){const side=i%2?-1:1;const z=17-i*4.3+(i%3)*.4;const p=cyl(.022+(i%4)*.009,1.4+(i%5)*.34,mat(i%3?0x3a4142:0x5d4640,.8,.2));p.position.set(side*(1.58+(i%3)*.08),1.35+(i%5)*.52,z);p.rotation.z=side*(.05+(i%4)*.06);scene.add(p)}
let px=0,pz=15,yaw=0,targetYaw=0,pitch=0,targetPitch=0,moving=0,started=false,drag=false,lastX=0,lastY=0,walkT=0,moveBlend=0,currentShop=null;
function nearestShop(){let best=shopCenters[0],d=1e9;for(const q of shopCenters){const dd=Math.hypot(q.z-pz,q.side*SHOP_FRONT-px);if(dd<d){d=dd;best=q}}currentShop=best;document.getElementById('shopName').textContent=best.name;document.getElementById('shopText').textContent=best.text}
function bindHold(id,val){const b=document.getElementById(id);const on=e=>{e.preventDefault();moving=val;b.classList.add('is-held')};const off=e=>{e.preventDefault();if(moving===val)moving=0;b.classList.remove('is-held')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}
bindHold('forward',1);bindHold('back',-1);document.getElementById('turnL').onclick=()=>targetYaw+=Math.PI/4;document.getElementById('turnR').onclick=()=>targetYaw-=Math.PI/4;document.getElementById('reset').onclick=()=>{targetYaw=0;targetPitch=0};
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;targetYaw-=(e.clientX-lastX)*.0065;targetPitch-=(e.clientY-lastY)*.0048;targetPitch=THREE.MathUtils.clamp(targetPitch,-1.05,1.05);lastX=e.clientX;lastY=e.clientY});const endDrag=e=>{drag=false;canvas.releasePointerCapture?.(e.pointerId)};canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')moving=1;if(e.key==='s'||e.key==='ArrowDown')moving=-1;if(e.key==='a'||e.key==='ArrowLeft')targetYaw+=.12;if(e.key==='d'||e.key==='ArrowRight')targetYaw-=.12});addEventListener('keyup',e=>{if(['w','s','ArrowUp','ArrowDown'].includes(e.key))moving=0});
const clock=new THREE.Clock();const dir=new THREE.Vector3(),look=new THREE.Vector3();function animate(t){requestAnimationFrame(animate);if(!started)return;const dt=Math.min(clock.getDelta(),.05);yaw=THREE.MathUtils.lerp(yaw,targetYaw,.18);pitch=THREE.MathUtils.lerp(pitch,targetPitch,.18);const movingNow=Math.abs(moving)>0;moveBlend+=(Number(movingNow)-moveBlend)*Math.min(1,dt*7);if(movingNow){const speed=1.05*moving;px+=Math.sin(yaw)*speed*dt;pz-=Math.cos(yaw)*speed*dt;px=THREE.MathUtils.clamp(px,-1.38,1.38);pz=THREE.MathUtils.clamp(pz,-60,20);nearestShop()}walkT+=dt*(5.4+moveBlend);const bobY=Math.abs(Math.sin(walkT))*0.018*moveBlend;const sway=Math.sin(walkT*.5)*0.012*moveBlend;camera.position.set(px+sway,1.72+bobY,pz);dir.set(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));look.copy(camera.position).add(dir);camera.lookAt(look);for(const n of neons)n.intensity=.42+.34*(Math.sin(t*.008+n.userData.seed)>.12?1:.12);renderer.render(scene,camera)}requestAnimationFrame(animate);
