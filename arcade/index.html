*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}body{font-family:var(--serif);touch-action:none}#c{position:fixed;inset:0;width:100%;height:100%;display:block}.grade{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 30%,rgba(0,0,0,.72) 100%),linear-gradient(180deg,rgba(20,4,25,.08),rgba(0,0,0,.28));mix-blend-mode:multiply}.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.11;background-image:radial-gradient(circle,rgba(255,255,255,.22) 0 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}.top{position:fixed;z-index:8;left:0;right:0;top:0;display:flex;gap:10px;align-items:center;padding:calc(9px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(180deg,rgba(4,5,5,.9),transparent);pointer-events:none}.top small{font:500 .48rem var(--mono);letter-spacing:.2em;color:#a99c91}.top b{font-size:.86rem;letter-spacing:.17em}.top .sp{flex:1}.top button{pointer-events:auto;border:1px solid #5d4b43;background:rgba(8,8,8,.78);color:#ddd1c5;padding:7px 9px;font:500 .54rem var(--mono)}.readout{position:fixed;z-index:8;left:12px;top:calc(48px + env(safe-area-inset-top));font:500 .5rem/1.75 var(--mono);letter-spacing:.08em;color:#a79a90;text-shadow:0 1px 6px #000;pointer-events:none}.caption{position:fixed;z-index:8;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));width:min(55vw,350px);padding:10px 12px;border:1px solid rgba(100,85,78,.4);background:rgba(7,7,8,.76);backdrop-filter:blur(5px)}.caption b{font-size:.76rem;letter-spacing:.15em}.caption p{margin:5px 0 0;color:#b9aea4;font-size:.61rem;line-height:1.8}.controls{position:fixed;z-index:10;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px}.controls button{min-height:56px;border:1px solid #4d423c;background:linear-grad <body>
<canvas id="c"></canvas><div class="grade"></div><div class="grain"></div>
<div class="top"><small>BUKIYA ARCADE / WIP 0.6</small><b>不氣屋アーケード</b><span class="sp"></span><button id="reset">視点戻</button></div>
<div class="readout">実寸基準：1 unit = 1 m<br>人物：185 cm<br>ドラッグ：人物の周囲を自由に回る<br>視線中心：人物と最寄り店舗の中間</div>
<div class="caption"><b id="shopName">妹字屋</b><p id="shopText">読める。意味は、まだ読めない。</p></div>
<div class="controls"><button id="back">後退</button><button id="forward">前進</button><button id="turnL">視点 左</button><button id="turnR">視点 右</button></div>
<div class="veil" id="veil"><small>観測所・余興 / 改装中</small><h1>不氣屋アーケード</h1><p>妹字屋だけ先に作り込む。<br>ほかの区画はまだコンクリートの箱。歩きと視点を先に整える。</p><div class="meter" id="loadState">3Dモデル：約2.4MB</div><button id="enter">入る</button></div>

<script type="module">

const scene=new THREE.Scene();scene.background=new THREE.Color(0x050607);scene.fog=new THREE.Fog(0x09090b,7,44);const camera=new THREE.PerspectiveCamera(50,1,.05,100);const resize=()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()};addEventListener('resize',resize);resize();
const mat=(c,r=.92,m=.03)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);const cyl=(r,h,m)=>new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,8),m);const add=(o,x,y,z)=>{o.position.set(x,y,z);scene.add(o);return o};scene.add(new THREE.HemisphereLight(0x87738e,0x171312,.78));const key=new THREE.DirectionalLight(0x9b7460,.72);key.position.set(-3,7,4);scene.add(key);
const PASSAGE_HALF=1.8,SHOP_FRONT=2.0,ROOF_Y=4.15;add(box(PASSAGE_HALF*2,.08,100,mat(0x282625,.98,0)),0,-.04,-18);add(box(.16,.12,100,mat(0x55504b,.98,0)),-PASSAGE_HALF,.04,-18);add(box(.16,.12,100,mat(0x55504b,.98,0)),PASSAGE_HALF,.04,-18);add(box(4.15,.08,100,new THREE.MeshStandardMaterial({color:0x2e3033,transparent:true,opacity:.35,roughness:.42,metalness:.16})),0,ROOF_Y,-18);for(let z=-65;z<30;z+=3.4)add(box(4.05,.09,.12,mat(0x3d3d3f,.8,.18)),0,ROOF_Y-.05,z);
function texSign(text,bg,fg){const c=document.createElement('canvas');c.width=600;c.height=180;const g=c.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,600,180);for(let i=0;i<120;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.12})`;g.fillRect(Math.random()*600,Math.random()*180,2+Math.random()*22,1+Math.random()*2)}g.fillStyle=fg;g.font="800 64px 'Shippori Mincho B1',serif";g.textAlign='center';g.textBaseline='middle';g.fillText(text,300,92);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const shops=[['妹字屋','#2c182f','#ffd0f2','読める。意味は、まだ読めない。'],['未施工','#4a4744','#aaa29b','まだ壁しかない。'],['未施工','#4a4744','#aaa29b','まだ壁しかない。'],['未施工','#4a4744','#aaa29b','まだ壁しかない。'],['未施工','#4a4744','#aaa29b','まだ壁しかない。'],['未施工','#4a4744','#aaa29b','まだ壁しかない。']];const shopCenters=[],neons=[];
function storefront(side,z,data,idx){const isImoji=data[0]==='妹字屋';const x=side*3.0;add(box(2.0,4.0,6.0,mat(isImoji?0x171515:0x4a4846,.97,.01)),x,2,z);const frontX=side*SHOP_FRONT;
if(!isImoji){add(box(.12,3.7,5.7,mat(0x575451,.99,0)),frontX,1.85,z);shopCenters.push({z,side,name:'未施工',text:'まだコンクリートの壁しかない。'});return;}
add(box(.10,2.05,3.25,mat(0x4b4948,.9,.12)),frontX,1.05,z);for(let y=.2;y<2;y+=.21)add(box(.055,.025,3.1,mat(0x232223,.9,.05)),frontX-side*.06,y,z);add(box(.18,.72,4.4,mat(parseInt(data[1].slice(1),16),.78,.05)),frontX,3.18,z);const face=new THREE.Mesh(new THREE.PlaneGeometry(4.2,.62),new THREE.MeshBasicMaterial({map:texSign(data[0],data[1],data[2]),side:THREE.DoubleSide}));face.position.set(frontX-side*.10,3.18,z);face.rotation.y=side<0?Math.PI/2:-Math.PI/2;scene.add(face);for(let j=0;j<3;j++)add(box(.45,.32,.48,mat(0x41342d,.96,.01)),side*1.63,.16+j*.18,z-1.85+j*.48);for(let p=0;p<6;p++){const pipe=cyl(.035+(p%2)*.012,2.2+(p%3)*.35,mat(p%2?0x5b5550:0x495957,.78,.22));pipe.position.set(side*(1.92+.08*p),2.25+(p%2)*.38,z-2.3+p*.78);pipe.rotation.z=side*(p%2?.12:-.08);scene.add(pipe)}const c=0xaa68ff;add(box(.08,.08,1.25,new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:2.2,roughness:.45})),side*1.87,2.6,z+2.25);const pl=new THREE.PointLight(c,.55,4.5);pl.position.set(side*1.5,2.5,z+2.2);pl.userData.seed=idx*3.7;scene.add(pl);neons.push(pl);shopCenters.push({z,side,name:data[0],text:data[3]})}
let idx=0;for(let z=18;z>-64;z-=6.7){const leftData=idx===0?shops[0]:shops[1];const rightData=idx===4?shops[0]:shops[1];storefront(-1,z,leftData,idx);storefront(1,z,rightData,idx+1);idx++}for(let z=20;z>-64;z-=7.2){for(let k=0;k<3;k++){const p=cyl(.025+k*.008,3.7,mat(k===1?0x58433b:0x30383a,.78,.18));p.rotation.z=Math.PI/2;p.position.set(0,3.55-k*.18,z+k*.18);scene.add(p)}}
const player=new THREE.Group();scene.add(player);player.position.set(0,0,15);let vrm=null,bones={},base={},walkT=0,walkBlend=0;
const modelUrl=(location.hostname.endsWith('github.io')?'/subeha-portfolio':'')+'/subeha-web-site.vrm';
async function loadModel(){const loader=new GLTFLoader();loader.register(parser=>new VRMLoaderPlugin(parser));const gltf=await loader.loadAsync(modelUrl);vrm=gltf.userData.vrm;if(!vrm)throw new Error('VRM data missing');VRMUtils.removeUnnecessaryVertices?.(vrm.scene);VRMUtils.combineSkeletons?.(vrm.scene);VRMUtils.rotateVRM0?.(vrm);player.add(vrm.scene);vrm.scene.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(vrm.scene),size=b.getSize(new THREE.Vector3());const scale=1.85/Math.max(size.y,.001);vrm.scene.scale.setScalar(scale);vrm.scene.rotation.y=Math.PI;vrm.scene.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(vrm.scene);vrm.scene.position.y+=-b.min.y+0.012;vrm.scene.updateMatrixWorld(true);const bone=n=>vrm.humanoid?.getNormalizedBoneNode?.(n);bones={hips:bone('hips'),spine:bone('spine'),chest:bone('chest'),lUA:bone('leftUpperArm'),rUA:bone('rightUpperArm'),lLA:bone('leftLowerArm'),rLA:bone('rightLowerArm'),lUL:bone('leftUpperLeg'),rUL:bone('rightUpperLeg'),lLL:bone('leftLowerLeg'),rLL:bone('rightLowerLeg'),lF:bone('leftFoot'),rF:bone('rightFoot')};if(bones.lUA)bones.lUA.rotation.z-=1.08;if(bones.rUA)bones.rUA.rotation.z+=1.08;if(bones.lLA)bones.lLA.rotation.z-=.08;if(bones.rLA)bones.rLA.rotation.z+=.08;if(bones.lUA)bones.lUA.rotation.x+=.05;if(bones.rUA)bones.rUA.rotation.x+=.05;for(const [k,node] of Object.entries(bones))if(node)base[k]={r:node.rotation.clone(),p:node.position.clone()};vrm.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});document.getElementById('loadState').textContent='185cm補正・歩行調整・店舗寄りフレーミング';}
loadModel().catch(e=>{console.error(e);document.getElementById('loadState').innerHTML='<span class="error">VRM読込失敗。街だけ表示する。</span>'});
let moving=0,orbitYaw=0,targetOrbitYaw=0,orbitPitch=.08,targetOrbitPitch=.08,orbitDist=3.55,targetOrbitDist=3.55,started=false,drag=false,lastX=0,lastY=0,pinchStart=0,pinchDist=0,currentShop=null;
function setRot(k,x=0,y=0,z=0){const n=bones[k],b=base[k];if(n&&b)n.rotation.set(b.r.x+x,b.r.y+y,b.r.z+z)}
function poseWalk(speed,dt){if(!vrm)return;const movingNow=Math.abs(speed)>0;const target=movingNow?1:0;walkBlend+= (target-walkBlend)*Math.min(1,dt*7);walkT+=dt*(5.6+walkBlend*1.2)*(speed<0?-1:1);const p=Math.sin(walkT),p2=Math.sin(walkT*2);const leg=p*.34*walkBlend;const arm=-p*.28*walkBlend;const kneeL=Math.max(0,-p)*.48*walkBlend,kneeR=Math.max(0,p)*.48*walkBlend;setRot('lUL',leg);setRot('rUL',-leg);setRot('lLL',kneeL);setRot('rLL',kneeR);setRot('lF',-kneeL*.28);setRot('rF',-kneeR*.28);setRot('lUA',arm,0,.015*p2*walkBlend);setRot('rUA',-arm,0,-.015*p2*walkBlend);setRot('lLA',Math.max(0,-arm)*.10);setRot('rLA',Math.max(0,arm)*.10);setRot('spine',.012*walkBlend,-p*.022*walkBlend,0);setRot('chest',-.008*walkBlend,p*.032*walkBlend,0);if(bones.hips&&base.hips){bones.hips.position.copy(base.hips.p);bones.hips.position.y+=Math.abs(p2)*.008*walkBlend;bones.hips.position.x+=p*.008*walkBlend;bones.hips.rotation.set(base.hips.r.x,base.hips.r.y-p*.035*walkBlend,base.hips.r.z);}vrm.update(dt)}

bindHold('forward',1);bindHold('back',-1);document.getElementById('turnL').onclick=()=>targetOrbitYaw-=Math.PI/4;document.getElementById('turnR').onclick=()=>targetOrbitYaw+=Math.PI/4;document.getElementById('reset').onclick=()=>{targetOrbitYaw=0;targetOrbitPitch=.08;targetOrbitDist=3.55};

const clock=new THREE.Clock();const desiredCam=new THREE.Vector3(),targetPoint=new THREE.Vector3();function animate(t){requestAnimationFrame(animate);if(!started)return;const dt=Math.min(clock.getDelta(),.05);if(moving){player.position.z-=moving*1.05*dt;player.position.z=THREE.MathUtils.clamp(player.position.z,-60,20);nearestShop()}poseWalk(moving,dt);orbitYaw=THREE.MathUtils.lerp(orbitYaw,targetOrbitYaw,.12);orbitPitch=THREE.MathUtils.lerp(orbitPitch,targetOrbitPitch,.12);orbitDist=THREE.MathUtils.lerp(orbitDist,targetOrbitDist,.12);const shopSide=currentShop?currentShop.side:1;const shopZ=currentShop?currentShop.z:player.position.z;targetPoint.set(player.position.x+shopSide*.52,1.25,THREE.MathUtils.lerp(player.position.z,shopZ,.18));const horizontal=orbitDist*Math.cos(orbitPitch);desiredCam.set(player.position.x+Math.sin(orbitYaw)*horizontal,1.20+Math.sin(orbitPitch)*orbitDist,player.position.z+Math.cos(orbitYaw)*horizontal);desiredCam.x=THREE.MathUtils.clamp(desiredCam.x,-1.42,1.42);desiredCam.y=THREE.MathUtils.clamp(desiredCam.y,.55,3.70);camera.position.lerp(desiredCam,.18);camera.lookAt(targetPoint);for(const n of neons)n.intensity=.38+.28*(Math.sin(t*.008+n.userData.seed)>.12?1:.12);renderer.render(scene,camera)}requestAnimationFrame(animate);document.getElementById('enter').onclick=()=>{document.getElementById('veil').classList.add('off');started=true;clock.start();nearestShop()};
</script>
