<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>不氣屋アーケード WIP 1.0</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#eee6dc;--dim:#95887e;--bg:#050606;--serif:'Shippori Mincho B1',serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--serif);touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.grade{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,transparent 38%,rgba(0,0,0,.58) 100%),linear-gradient(180deg,rgba(24,4,28,.06),rgba(0,0,0,.22));mix-blend-mode:multiply}
.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.09;background-image:radial-gradient(circle,rgba(255,255,255,.18) 0 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}
.top{position:fixed;z-index:8;left:0;right:0;top:0;display:flex;gap:9px;align-items:center;padding:calc(9px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(180deg,rgba(4,5,5,.9),transparent);pointer-events:none}
.top small{font:500 .48rem var(--mono);letter-spacing:.2em;color:#a99c91}.top b{font-size:.84rem;letter-spacing:.16em}.top .sp{flex:1}
.top button{pointer-events:auto;border:1px solid #5d4b43;background:rgba(8,8,8,.8);color:#ddd1c5;padding:7px 9px;font:500 .53rem var(--mono)}
.readout{position:fixed;z-index:8;left:12px;top:calc(47px + env(safe-area-inset-top));font:500 .44rem/1.72 var(--mono);letter-spacing:.07em;color:#9d9188;text-shadow:0 1px 6px #000;pointer-events:none}
.caption{position:fixed;z-index:8;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));width:min(54vw,340px);padding:10px 12px;border:1px solid rgba(100,85,78,.4);background:rgba(7,7,8,.7);backdrop-filter:blur(5px)}
.caption b{font-size:.76rem;letter-spacing:.15em}.caption p{margin:5px 0 0;color:#b9aea4;font-size:.61rem;line-height:1.8}
.controls{position:fixed;z-index:10;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px}
.controls button{min-height:54px;border:1px solid #4d423c;background:linear-gradient(180deg,rgba(30,21,22,.94),rgba(7,7,8,.94));color:#eee4d8;font:800 .68rem var(--serif);letter-spacing:.06em;touch-action:none}
.controls button.is-held{background:#eee4d8;color:#160f10}
.veil{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(ellipse at center,#241522,#050606 72%)}
.veil.off{display:none}.veil small{font:.52rem var(--mono);letter-spacing:.32em;color:#a18d87}.veil h1{margin:14px 0 8px;font-size:clamp(2.2rem,10vw,4.4rem);letter-spacing:.11em}.veil p{max-width:31em;font-size:.76rem;line-height:2;color:#b9aaa1}.veil button{margin-top:26px;border:1px solid #827168;background:#090808;color:#eee4d8;padding:14px 44px;font:800 .9rem var(--serif);letter-spacing:.24em}
.cross{position:fixed;z-index:7;left:50%;top:50%;width:5px;height:5px;border:1px solid rgba(230,220,210,.28);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
@media(max-width:700px){.caption{width:58vw}.controls button{font-size:.64rem}.top b{font-size:.76rem}}
</style>
</head>
<body>
<canvas id="c"></canvas><div class="grade"></div><div class="grain"></div><div class="cross"></div>
<div class="top"><small>BUKIYA ARCADE / WIP 1.0</small><b>不氣屋アーケード</b><span class="sp"></span><button id="inspect">店全景</button><button id="reset">通路正面</button></div>
<div class="readout">一人称 / 目線高 1.72m<br>ドラッグ：見回す<br>前後：通路方向 / 左右：平行移動</div>
<div class="caption"><b id="shopName">妹字屋</b><p id="shopText">読める。意味は、まだ読めない。</p></div>
<div class="controls"><button id="back">後退</button><button id="forward">前進</button><button id="strafeL">左移動</button><button id="strafeR">右移動</button></div>
<div class="veil" id="veil"><small>観測所・余興 / 改装中</small><h1>不氣屋アーケード</h1><p>狭い商店街を歩く。<br>見る方向と歩く方向は、もう別々になっている。</p><button id="enter">入る</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.98;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050607);scene.fog=new THREE.Fog(0x08090a,8,48);
const camera=new THREE.PerspectiveCamera(88,1,.04,120);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=innerHeight>innerWidth?96:78;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const mat=(c,r=.92,m=.03,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:e?new THREE.Color(c):new THREE.Color(0),emissiveIntensity:e});
const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);const cyl=(r,h,m,seg=10)=>new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),m);const add=(o,x,y,z)=>{o.position.set(x,y,z);scene.add(o);return o};
scene.add(new THREE.HemisphereLight(0x76687d,0x181313,.7));const key=new THREE.DirectionalLight(0xa07865,.42);key.position.set(-3,7,4);scene.add(key);
const PASSAGE_HALF=2.18,SHOP_FRONT=2.38,ROOF_Y=3.78,UNIT_W=4.45;
function texConcrete(){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#555250';g.fillRect(0,0,512,512);for(let i=0;i<1700;i++){const dark=Math.random()<.55;g.fillStyle=`rgba(${dark?25:220},${dark?22:215},${dark?20:205},${.015+Math.random()*.065})`;g.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*15,1+Math.random()*3)}for(let i=0;i<16;i++){g.strokeStyle='rgba(20,18,17,.15)';g.beginPath();let x=Math.random()*512,y=Math.random()*512;g.moveTo(x,y);for(let j=0;j<6;j++){x+=(Math.random()-.5)*38;y+=15+Math.random()*28;g.lineTo(x,y)}g.stroke()}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const concrete=new THREE.MeshStandardMaterial({map:texConcrete(),roughness:.99,metalness:0});
add(box(PASSAGE_HALF*2,.08,122,mat(0x232323,.99,0)),0,-.04,-13);add(box(.14,.11,122,mat(0x514b47,.98,0)),-PASSAGE_HALF,.035,-13);add(box(.14,.11,122,mat(0x514b47,.98,0)),PASSAGE_HALF,.035,-13);
add(box(PASSAGE_HALF*2+.4,.07,122,new THREE.MeshStandardMaterial({color:0x25272a,transparent:true,opacity:.52,roughness:.5,metalness:.1})),0,ROOF_Y,-13);
for(let z=-70;z<36;z+=2.75)add(box(PASSAGE_HALF*2+.34,.08,.10,mat(0x363739,.82,.14)),0,ROOF_Y-.04,z);
const lights=[];for(let z=28;z>-68;z-=6.2){const warm=Math.floor(Math.abs(z))%4===0,c=warm?0xffd1a1:0xd8eee7;add(box(1.0,.035,.08,new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:1.6,roughness:.5})),0,3.50,z);const p=new THREE.PointLight(c,.26,5.2);p.position.set(0,3.28,z);p.userData.seed=z*.71;scene.add(p);lights.push(p)}
function texSign(text,bg,fg,sub=''){const c=document.createElement('canvas');c.width=700;c.height=220;const g=c.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,700,220);for(let i=0;i<180;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.15})`;g.fillRect(Math.random()*700,Math.random()*220,2+Math.random()*28,1+Math.random()*3)}g.strokeStyle='rgba(255,255,255,.08)';g.strokeRect(10,10,680,200);g.fillStyle=fg;g.font="800 76px 'Shippori Mincho B1',serif";g.textAlign='center';g.textBaseline='middle';g.fillText(text,350,104);if(sub){g.font="500 20px 'IBM Plex Mono',monospace";g.fillText(sub,350,174)}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function planeFace(w,h,tex,side,x,y,z){const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide,transparent:true}));p.position.set(x,y,z);p.rotation.y=side<0?Math.PI/2:-Math.PI/2;scene.add(p);return p}
const shopCenters=[],neons=[];
function rawUnit(side,z){const x=side*3.12;add(box(1.55,3.58,UNIT_W+.15,concrete),x,1.79,z);add(box(.10,3.34,UNIT_W,concrete),side*SHOP_FRONT,1.68,z);for(let i=0;i<3;i++)add(box(.025,.8+.25*(i%2),.04,mat(0x665249,.92,.12)),side*(SHOP_FRONT-.07),.65+i*.82,z-1.55+i*1.45);shopCenters.push({z,side,name:'未施工',text:'まだコンクリートの壁しかない。'})}
function imojiShop(side,z,idx){const x=side*3.13,frontX=side*SHOP_FRONT;add(box(1.58,3.66,UNIT_W+.2,mat(0x141313,.98,.01)),x,1.83,z);add(box(.12,3.46,UNIT_W,mat(0x171514,.95,.02)),frontX,1.73,z);
add(box(.10,2.20,2.35,mat(0x050505,.99,0)),frontX-side*.05,1.18,z-.16);
for(const zz of [-1.05,.73])add(box(.07,2.20,.06,mat(0x5d524a,.7,.22)),frontX-side*.12,1.18,z+zz);add(box(.07,.06,2.38,mat(0x5d524a,.7,.22)),frontX-side*.12,2.27,z-.16);add(box(.07,.06,2.38,mat(0x5d524a,.7,.22)),frontX-side*.12,.10,z-.16);
add(box(.22,.78,3.82,mat(0x231321,.78,.04)),frontX,3.02,z);planeFace(3.62,.64,texSign('妹字屋','#241321','#ffd39a','IM0JI / PRIVATE SCRIPT'),side,frontX-side*.13,3.02,z);
add(box(.20,1.38,.58,mat(0x2a171f,.8,.05)),frontX,2.02,z+1.75);planeFace(.48,1.22,texSign('妹字','#2a171f','#ffd39a'),side,frontX-side*.12,2.02,z+1.75);
for(let r=0;r<3;r++){add(box(.38,.05,1.92,mat(0x302723,.9,.03)),side*1.95,.52+r*.57,z-.16);for(let k=0;k<4;k++){add(box(.04,.24,.26,mat(0x0b0a09,.95,.01)),side*1.70,.70+r*.57,z-.82+k*.5);const mark=new THREE.Mesh(new THREE.PlaneGeometry(.20,.18),new THREE.MeshBasicMaterial({color:0xd9ad54,side:THREE.DoubleSide}));mark.position.set(side*1.675,.70+r*.57,z-.82+k*.5);mark.rotation.y=side<0?Math.PI/2:-Math.PI/2;scene.add(mark)}}
add(box(.52,.72,1.00,mat(0x33251f,.93,.02)),side*1.82,.36,z+1.05);for(let i=0;i<7;i++)add(box(.025,.012,.46,mat(0x0b0a09,.99,0)),side*1.54+i*.008,.78+i*.009,z+1.02);
for(let p=0;p<7;p++){const pipe=cyl(.028+(p%3)*.012,1.55+(p%4)*.30,mat(p%2?0x655148:0x445150,.77,.22));pipe.position.set(side*(2.15+.05*(p%3)),1.48+(p%4)*.36,z-1.82+p*.57);pipe.rotation.z=side*(.05+(p%5)*.05);scene.add(pipe)}
const nc=0x9a5dff;add(box(.055,.055,1.05,new THREE.MeshStandardMaterial({color:nc,emissive:nc,emissiveIntensity:2.5})),side*2.15,2.54,z+1.70);const np=new THREE.PointLight(nc,.82,5.5);np.position.set(side*1.78,2.42,z+1.68);np.userData.seed=idx*2.4;scene.add(np);neons.push(np);const amber=new THREE.PointLight(0xffb66a,.66,4.8);amber.position.set(side*1.76,1.72,z-.15);scene.add(amber);
shopCenters.push({z,side,name:'妹字屋',text:'読める。意味は、まだ読めない。'})}
let idx=0;for(let z=18;z>-66;z-=5.35){if(idx===0)imojiShop(-1,z,idx);else rawUnit(-1,z);if(idx===5)imojiShop(1,z,idx+1);else rawUnit(1,z);idx++}
// 床：排水溝、濡れ、補修跡
for(let z=21;z>-65;z-=8.2){add(box(.38,.018,1.75,mat(0x101112,.85,.16)),0,.012,z);for(let i=0;i<6;i++)add(box(.36,.022,.035,mat(0x55585a,.72,.3)),0,.026,z-.68+i*.27)}
for(let i=0;i<10;i++){const puddle=new THREE.Mesh(new THREE.PlaneGeometry(.7+(i%3)*.28,1.0+(i%2)*.55),new THREE.MeshStandardMaterial({color:0x1a2021,roughness:.2,metalness:.08,transparent:true,opacity:.5}));puddle.rotation.x=-Math.PI/2;puddle.position.set((i%2?-.9:.85)+(i%3)*.08,.012,16-i*7.8);scene.add(puddle)}
// 配管とケーブル。配置はわざと不均等
for(let i=0;i<26;i++){const side=i%2?-1:1,z=21-i*3.25+(i%4)*.43;const p=cyl(.02+(i%5)*.008,1.0+(i%6)*.28,mat(i%3?0x394143:0x644a42,.8,.2));p.position.set(side*(1.92+(i%4)*.07),1.20+(i%5)*.47,z);p.rotation.z=side*(.04+(i%5)*.052);scene.add(p)}
for(let i=0;i<14;i++){const geo=new THREE.BufferGeometry();const y=3.18-(i%4)*.14,z=20-i*6.0;const pts=new Float32Array([-2.0,y,z,-.7,y-.12-(i%3)*.08,z+.18,.7,y-.04,z-.12,2.0,y-.18,z+.08]);geo.setAttribute('position',new THREE.BufferAttribute(pts,3));scene.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:i%3===0?0x5f3b43:0x262b2c,transparent:true,opacity:.75})))}
for(let i=0;i<15;i++){const side=i%2?-1:1,z=18-i*4.9;add(box(.12,.48,.38,mat(0x555757,.82,.16)),side*2.12,1.15+(i%3)*.52,z);if(i%4===0)add(box(.16,.26,.5,mat(0x8b734f,.9,.04)),side*2.06,.38,z+.6)}
// 一人称操作。見る方向と歩く方向を分離する。
let px=0,pz=29,yaw=0,targetYaw=0,pitch=0,targetPitch=0,forward=0,strafe=0,started=false,drag=false,lastX=0,lastY=0,walkT=0,moveBlend=0,currentShop=null,inspectMode=false;
function nearestShop(){let best=shopCenters[0],d=1e9;for(const q of shopCenters){const dd=Math.hypot(q.z-pz,q.side*SHOP_FRONT-px);if(dd<d){d=dd;best=q}}currentShop=best;document.getElementById('shopName').textContent=best.name;document.getElementById('shopText').textContent=best.text}
function bindAxis(id,type,val){const b=document.getElementById(id);const on=e=>{e.preventDefault();if(type==='f')forward=val;else strafe=val;b.classList.add('is-held')};const off=e=>{e.preventDefault();if(type==='f'&&forward===val)forward=0;if(type==='s'&&strafe===val)strafe=0;b.classList.remove('is-held')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}
bindAxis('forward','f',1);bindAxis('back','f',-1);bindAxis('strafeL','s',-1);bindAxis('strafeR','s',1);
document.getElementById('reset').onclick=()=>{targetYaw=0;targetPitch=0;inspectMode=false};
document.getElementById('inspect').onclick=()=>{nearestShop();if(!currentShop)return;inspectMode=true;const s=currentShop.side;px=-s*1.82;pz=currentShop.z;targetYaw=s<0?Math.PI/2:-Math.PI/2;targetPitch=.08;camera.fov=innerHeight>innerWidth?102:82;camera.updateProjectionMatrix()};
canvas.addEventListener('pointerdown',e=>{drag=true;inspectMode=false;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture?.(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;targetYaw-=(e.clientX-lastX)*.0052;targetPitch-=(e.clientY-lastY)*.0042;targetPitch=THREE.MathUtils.clamp(targetPitch,-.95,.95);lastX=e.clientX;lastY=e.clientY});
const endDrag=e=>{drag=false;canvas.releasePointerCapture?.(e.pointerId)};canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')forward=1;if(e.key==='s'||e.key==='ArrowDown')forward=-1;if(e.key==='a'||e.key==='ArrowLeft')strafe=-1;if(e.key==='d'||e.key==='ArrowRight')strafe=1});
addEventListener('keyup',e=>{if(['w','s','ArrowUp','ArrowDown'].includes(e.key))forward=0;if(['a','d','ArrowLeft','ArrowRight'].includes(e.key))strafe=0});
const clock=new THREE.Clock(),dir=new THREE.Vector3(),look=new THREE.Vector3();
function animate(t){requestAnimationFrame(animate);if(!started)return;const dt=Math.min(clock.getDelta(),.05);yaw=THREE.MathUtils.lerp(yaw,targetYaw,.17);pitch=THREE.MathUtils.lerp(pitch,targetPitch,.17);const movingNow=Math.abs(forward)+Math.abs(strafe)>0;moveBlend+=(Number(movingNow)-moveBlend)*Math.min(1,dt*8);
if(movingNow){inspectMode=false;const speed=1.25; // 通路前後は視線に影響されない
 pz-=forward*speed*dt;px+=strafe*.95*dt;px=THREE.MathUtils.clamp(px,-1.86,1.86);pz=THREE.MathUtils.clamp(pz,-64,31);nearestShop()}
if(!inspectMode){const targetFov=innerHeight>innerWidth?96:78;camera.fov=THREE.MathUtils.lerp(camera.fov,targetFov,.08);camera.updateProjectionMatrix()}
walkT+=dt*(4.8+moveBlend);const bobY=Math.abs(Math.sin(walkT))*0.010*moveBlend;const sway=Math.sin(walkT*.5)*0.006*moveBlend;camera.position.set(px+sway,1.72+bobY,pz);dir.set(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));look.copy(camera.position).add(dir);camera.lookAt(look);
for(const n of neons)n.intensity=.50+.34*(Math.sin(t*.008+n.userData.seed)>.05?1:.10);for(const l of lights)l.intensity=.20+.07*(Math.sin(t*.004+l.userData.seed)>.92?.25:1);renderer.render(scene,camera)}
requestAnimationFrame(animate);
document.getElementById('enter').onclick=()=>{document.getElementById('veil').classList.add('off');started=true;clock.start();nearestShop()};
</script>
</body>
</html>
