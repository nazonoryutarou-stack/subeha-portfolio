<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>未祓いマップ ── すべての歯が見える</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--void:#050505;--bone:#d8cdb8;--dim:#7d745f;--blood:#a51212;--line:#16140f;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--void);color:var(--bone);font-family:'Shippori Mincho',serif;min-height:100vh;}
  .head{text-align:center;padding:50px 20px 24px;position:relative;z-index:5;}
  .head .k{font-size:.58rem;letter-spacing:.5em;color:var(--blood);margin-bottom:16px;}
  .head h1{font-weight:800;font-size:clamp(1.5rem,6vw,2.4rem);letter-spacing:.22em;}
  .head p{font-size:.66rem;letter-spacing:.3em;color:var(--dim);margin-top:14px;line-height:2;}
  #map{width:100%;height:62vh;min-height:420px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);filter:grayscale(0.6) brightness(0.7) contrast(1.1);}
  .leaflet-container{background:#0a0a0a;}
  .leaflet-popup-content-wrapper{background:#0c0a08;color:var(--bone);border:1px solid var(--blood);border-radius:0;font-family:'Shippori Mincho',serif;}
  .leaflet-popup-tip{background:#0c0a08;border:1px solid var(--blood);}
  .leaflet-popup-content{margin:16px 18px;line-height:1.9;}
  .pop-name{font-size:1.05rem;font-weight:700;letter-spacing:.1em;margin-bottom:6px;}
  .pop-type{font-size:.6rem;letter-spacing:.3em;color:#ff6b6b;margin-bottom:12px;}
  .pop-desc{font-size:.8rem;color:var(--dim);line-height:2.1;}
  .leaflet-popup-close-button{color:var(--dim)!important;}
  .status{text-align:center;font-size:.62rem;color:var(--dim);letter-spacing:.2em;padding:14px;}
  .legend{text-align:center;padding:24px 20px 60px;font-size:.66rem;color:var(--dim);letter-spacing:.1em;line-height:2.2;}
  .legend .blood{color:var(--blood);}
  .back{display:inline-block;margin-top:20px;font-size:.64rem;color:var(--dim);text-decoration:none;letter-spacing:.3em;}
  .back:hover{color:var(--bone);}
  .spot{width:16px;height:16px;background:var(--blood);border:2px solid #ff5555;border-radius:50%;box-shadow:0 0 8px var(--blood),0 0 18px rgba(165,18,18,.7);animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.6}}
</style>
</head>
<body>

  <div class="head">
    <h1>未 祓 い マ ッ プ</h1>
    <p>事情があって祓えていない霊を記録します。同業の方は参考にしてください。<br>正確な場所は記していませんが、除霊に行く際はご連絡ください。同行します。</p>
  </div>

  <div id="map"></div>
  <div class="status" id="status">記録を読み込む…</div>

  <div class="legend">
    <span class="blood">●</span> ＝ 未祓いの地点<br>
    タップで記録が開く。<br>
    <a class="back" href="index.html">← ホームに戻る</a>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =========================================================
   スポットは、Googleフォーム／スプレッドシートに書くだけで
   自動で地図に出る。ソースコードはいじらなくてよい。

   スプレッドシートの列の順番（この通りであること）：
   A:タイムスタンプ  B:スポット名  C:緯度  D:経度  E:種別  F:説明

   ※緯度・経度は必ず「数字」で入れる（例 34.7024 / 135.4959）
   ※全て架空・演出。実在の個人宅や特定物件を名指ししないこと。
   ========================================================= */

/* あなたのスプレッドシートのCSV公開URL */
var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRA1AuFPfz23AiuyNHirTIn8pslZOn8UHyaFzB0SaBWewcErvPV6YIMBy_6tA6MyNTMLjEY11jwDL0w/pub?output=csv";

var map, layer;

function initMap(){
  if (typeof L === 'undefined'){ setTimeout(initMap, 200); return; }
  map = L.map('map',{scrollWheelZoom:false}).setView([34.69,135.50], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:18, attribution:'&copy; OpenStreetMap'
  }).addTo(map);
  layer = L.layerGroup().addTo(map);
  setTimeout(function(){ map.invalidateSize(); }, 300);
  loadSpots();
}

/* CSVを1行ずつに分解（カンマ・改行・引用符に対応した簡易パーサ） */
function parseCSV(text){
  var rows=[], row=[], cur='', inQ=false;
  for (var i=0;i<text.length;i++){
    var c=text[i];
    if (inQ){
      if (c==='"'){ if (text[i+1]==='"'){ cur+='"'; i++; } else { inQ=false; } }
      else { cur+=c; }
    } else {
      if (c==='"'){ inQ=true; }
      else if (c===','){ row.push(cur); cur=''; }
      else if (c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if (c==='\r'){ /* 無視 */ }
      else { cur+=c; }
    }
  }
  if (cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

function loadSpots(){
  var url = CSV_URL + (CSV_URL.indexOf('?')>=0 ? '&' : '?') + 't=' + Date.now(); /* キャッシュ避け */
  fetch(url)
    .then(function(r){ return r.text(); })
    .then(function(text){
      var rows = parseCSV(text);
      var count = 0;
      var bounds = [];
      /* 1行目は見出しなので、2行目(index 1)から */
      for (var i=1;i<rows.length;i++){
        var r = rows[i];
        if (!r || r.length<4) continue;
        var name = (r[1]||'').trim();
        var lat = parseFloat((r[2]||'').trim());
        var lng = parseFloat((r[3]||'').trim());
        var type = (r[4]||'').trim();
        var desc = (r[5]||'').trim();
        /* 緯度経度が数字じゃない行はスキップ */
        if (isNaN(lat) || isNaN(lng)) continue;
        var icon = L.divIcon({className:'', html:'<div class="spot"></div>', iconSize:[14,14], iconAnchor:[7,7]});
        var m = L.marker([lat,lng], {icon}).addTo(layer);
        m.bindPopup(
          '<div class="pop-name">'+escapeHtml(name)+'</div>'+
          (type ? '<div class="pop-type">'+escapeHtml(type)+'</div>' : '')+
          '<div class="pop-desc">'+escapeHtml(desc)+'</div>'
        );
        bounds.push([lat,lng]);
        count++;
      }
      var st = document.getElementById('status');
      if (count>0){
        st.textContent = '未祓い地点：' + count + '件';
        /* 全ピンが入るように表示を調整 */
        if (bounds.length>1){ map.fitBounds(bounds, {padding:[40,40], maxZoom:14}); }
        else if (bounds.length===1){ map.setView(bounds[0], 14); }
      } else {
        st.textContent = '記録なし。';
      }
    })
    .catch(function(e){
      document.getElementById('status').textContent = '記録を読み込めませんでした。';
    });
}

/* 文字列を安全に表示（タグ無効化） */
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

window.addEventListener('load', initMap);
</script>
</body>
</html>
