<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>夕暮れの商店街｜すべての歯が見える</title>
<meta name="robots" content="noindex">

<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#f2eadc;
  --mid:#d0b08d;
  --dim:#8c7763;
  --line:#3b2f25;
  --bg:#11100e;
  --serif:'Shippori Mincho B1',serif;
  --mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  font-family:var(--serif);
  color:var(--ink);
  touch-action:none;
}
#c{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}
.grade{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:
    radial-gradient(ellipse 90% 85% at 50% 40%, transparent 44%, rgba(28,12,8,.52) 100%),
    linear-gradient(180deg, rgba(20,18,35,.09), rgba(255,110,40,.05));
  mix-blend-mode:multiply;
}
.warm{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:rgba(255,155,70,.05);
}
.grain{
  position:fixed;
  inset:0;
  z-index:3;
  pointer-events:none;
  opacity:.12;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.35) 0 1px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(0,0,0,.35) 0 1px, transparent 1px);
  background-size:3px 3px,4px 4px;
  mix-blend-mode:overlay;
}
.top{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:8;
  display:flex;
  gap:10px;
  align-items:center;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px;
  background:linear-gradient(180deg,rgba(10,8,6,.68),transparent);
  pointer-events:none;
}
.top .k{
  font-family:var(--mono);
  font-size:.5rem;
  letter-spacing:.24em;
  color:var(--mid);
}
.top h1{
  font-size:.92rem;
  font-weight:800;
  letter-spacing:.22em;
  text-shadow:0 1px 8px rgba(0,0,0,.6);
}
.top .sp{flex:1;}
.top button{
  pointer-events:auto;
  font-family:var(--mono);
  font-size:.52rem;
  letter-spacing:.12em;
  color:var(--ink);
  background:rgba(12,10,8,.65);
  border:1px solid rgba(210,176,141,.35);
  padding:7px 10px;
  cursor:pointer;
}
.hud{
  position:fixed;
  right:14px;
  top:calc(46px + env(safe-area-inset-top,0px));
  z-index:8;
  font-family:var(--mono);
  font-size:.5rem;
  letter-spacing:.11em;
  line-height:1.8;
  color:var(--mid);
  text-align:right;
  pointer-events:none;
  text-shadow:0 1px 8px rgba(0,0,0,.6);
}
.hud .clock{
  color:#e9d8bd;
}
.caption{
  position:fixed;
  left:50%;
  bottom:calc(100px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  z-index:9;
  width:min(88vw,700px);
  padding:12px 15px 13px;
  border:1px solid rgba(208,176,141,.34);
  background:linear-gradient(180deg,rgba(18,13,10,.84),rgba(10,8,6,.72));
  backdrop-filter:blur(4px);
  box-shadow:0 10px 28px rgba(0,0,0,.28);
  pointer-events:none;
  transition:opacity .38s ease, transform .38s ease;
}
.caption.dim{
  opacity:0;
  transform:translate(-50%,7px);
}
.caption .name{
  font-size:.9rem;
  font-weight:800;
  letter-spacing:.18em;
  color:#f5e7d0;
}
.caption .text{
  margin-top:6px;
  font-size:.73rem;
  line-height:1.9;
  letter-spacing:.08em;
  color:#ddccb8;
}
.controls{
  position:fixed;
  left:0;
  right:0;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  z-index:10;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  padding:0 14px;
}
.controls button{
  min-height:58px;
  border:1px solid rgba(208,176,141,.45);
  color:#f7ebd8;
  background:linear-gradient(180deg,rgba(38,25,17,.84),rgba(14,10,7,.82));
  font-family:var(--serif);
  font-weight:800;
  font-size:.88rem;
  letter-spacing:.18em;
  text-indent:.18em;
  box-shadow:0 8px 22px rgba(0,0,0,.24);
}
.camctl{
  position:fixed;
  left:14px;
  bottom:calc(84px + env(safe-area-inset-bottom,0px));
  z-index:10;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  max-width:min(78vw,520px);
}
.camctl button{
  min-width:60px;
  min-height:42px;
  border:1px solid rgba(208,176,141,.4);
  color:#f6ead6;
  background:rgba(18,13,10,.78);
  font-family:var(--mono);
  font-size:.62rem;
  letter-spacing:.12em;
  box-shadow:0 6px 16px rgba(0,0,0,.22);
}
button:active{
  background:#f6ead6 !important;
  color:#1a120e !important;
}
.veil{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:28px;
  background:radial-gradient(ellipse 100% 80% at 50% 38%,#3a2336 0%,#15100e 72%);
}
.veil.off{display:none;}
.veil .eye{
  font-family:var(--mono);
  font-size:.56rem;
  letter-spacing:.42em;
  color:var(--mid);
  margin-bottom:26px;
}
.veil h2{
  font-size:clamp(2.4rem,12vw,4rem);
  font-weight:800;
  letter-spacing:.14em;
  text-indent:.14em;
  color:#f6ead6;
  text-shadow:0 0 40px rgba(255,170,90,.3);
}
.veil .sub{
  font-family:var(--mono);
  font-size:.6rem;
  letter-spacing:.3em;
  color:var(--mid);
  margin-top:18px;
}
.veil .orn{
  width:min(64vw,320px);
  height:1px;
  background:linear-gradient(90deg,transparent,var(--mid),transparent);
  margin:26px 0;
}
.veil p{
  font-size:.8rem;
  letter-spacing:.12em;
  line-height:2.2;
  color:#e6d2bc;
  max-width:26em;
}
.veil .go{
  margin-top:38px;
  font-family:var(--serif);
  font-weight:800;
  font-size:1rem;
  letter-spacing:.34em;
  text-indent:.34em;
  color:#f6ead6;
  background:rgba(20,12,10,.5);
  border:1px solid var(--mid);
  padding:16px 50px;
  cursor:pointer;
}
.veil .foot{
  margin-top:26px;
  font-family:var(--mono);
  font-size:.5rem;
  letter-spacing:.16em;
  color:var(--dim);
}
.veil .foot a{
  color:var(--mid);
  text-decoration:none;
}
</style>
</head>

<body>
<canvas id="c"></canvas>
<div class="grade"></div>
<div class="warm" id="warmLayer"></div>
<div class="grain"></div>

<div class="top">
  <span class="k">第〇九一號観測所</span>
  <h1>夕暮れの商店街</h1>
  <span class="sp"></span>
  <button id="soundBtn" type="button">音 入</button>
  <button id="resetViewBtn" type="button">視点 戻</button>
</div>

<div class="hud">
  <span class="clock" id="clockHud">観測時刻 17:40</span><br>
  ドラッグ : 視点回転<br>
  ホイール / 寄る引く : ズーム<br>
  注視 : 全体 / 看板 / 入口 / 店先 / 二階
</div>

<div class="caption" id="captionBox">
  <div class="name" id="capName">夕凪酒店</div>
  <div class="text" id="capText">冷えた瓶だけが、まだ日暮れを覚えている。</div>
</div>

<div class="camctl">
  <button id="zoomInBtn" type="button">寄る</button>
  <button id="zoomOutBtn" type="button">引く</button>
  <button id="focusBtn" type="button">注視 全体</button>
</div>

<div class="controls">
  <button id="prevBtn" type="button">前の店</button>
  <button id="sideBtn" type="button">反対側</button>
  <button id="nextBtn" type="button">次の店</button>
</div>

<div class="veil" id="veil">
  <div class="eye">観測所・余興 ／ 其ノ六</div>
  <h2>夕暮れの商店街</h2>
  <div class="sub">— a long summer evening —</div>
  <div class="orn"></div>
  <p>日が傾いている。蝉が鳴いている。<br>誰もいない商店街を、店先に近い目線で見る。<br>日は、ゆっくりと沈む。沈みきるかどうかは、まだ確認されていない。</p>
  <button class="go" id="enterBtn" type="button">見る</button>
  <div class="foot"><a href="index.html">‹‹ 観測所へ戻る</a></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  if(typeof THREE === "undefined"){
    document.getElementById("veil").innerHTML = "3Dの読み込みに失敗した。通信を確認して開き直してくれ。";
    return;
  }

  function boot(){
    var SHOP_DATA = [
      {name:"夕凪酒店", kind:"liquor", wall:"#b99672", sign:"#79342c", text:"#f5e3c8", whisper:"冷えた瓶だけが、まだ日暮れを覚えている。", style:"machiya"},
      {name:"魚辰", kind:"fish", wall:"#91a9a5", sign:"#245a64", text:"#edf6ef", whisper:"氷の匂いが、店を閉めてからも抜けない。", style:"fish"},
      {name:"米屋九番", kind:"rice", wall:"#d1c2a0", sign:"#6f5636", text:"#f4ead4", whisper:"奥で誰かが袋を縫っているような気がする。", style:"kura"},
      {name:"肉の深町", kind:"meat", wall:"#b87964", sign:"#8d2d2d", text:"#fff1df", whisper:"赤い紙だけが妙に新しい。", style:"showcase"},
      {name:"喫茶かげろう", kind:"cafe", wall:"#8f7d6b", sign:"#3f2c22", text:"#f2dfbf", whisper:"椅子の位置が、最後の客のまま止まっている。", style:"cafe"},
      {name:"金物はしもと", kind:"hardware", wall:"#8a8f8a", sign:"#45504a", text:"#eee2ca", whisper:"釘の匂いと、湿った木の匂いが混ざっている。", style:"open"},
      {name:"月見たばこ店", kind:"tobacco", wall:"#c2a875", sign:"#8f6a2d", text:"#271a10", whisper:"ガラス越しに、もう売れない銘柄が眠っている。", style:"booth"},
      {name:"湯乃跡", kind:"bath", wall:"#8fa19d", sign:"#2f5f72", text:"#edf7f0", whisper:"暖簾はないが、濡れた記憶だけが残っている。", style:"bath"},
      {name:"空き店舗", kind:"vacant", wall:"#98908a", sign:"#4e463f", text:"#cfc4b0", whisper:"シャッターの錆だけが、閉めた日を正確に数えている。", whisperNight:"両隣の店は、ここに何の店があったか、それぞれ違う答えを言う。", style:"vacant"},
      {name:"片目文具", kind:"stationery", wall:"#b7a99a", sign:"#5a4a72", text:"#f1e7d0", whisper:"便箋の束が、夕方になると少しだけ傾く。", style:"machiya"},
      {name:"花の残り", kind:"flower", wall:"#a98b78", sign:"#4c6a4f", text:"#f5ead5", whisper:"花が枯れてから値札が付けられた。", style:"flower"},
      {name:"朝焼けパン", kind:"bread", wall:"#d3b890", sign:"#8b5938", text:"#fff0d7", whisper:"もう匂いはしないのに、腹だけが覚えている。", style:"cafe"},
      {name:"氷室商店", kind:"ice", wall:"#9fb8bd", sign:"#2f6b8a", text:"#f0fbff", whisper:"溶けた水の跡だけが、毎日きちんと増えている。", style:"showcase"},
      {name:"骨董みぞれ", kind:"antique", wall:"#7f6f5b", sign:"#3a281e", text:"#e9d6b7", whisper:"売り物より、棚の影の方が古い。", style:"darkwood"},
      {name:"影写真館", kind:"photo", wall:"#766f73", sign:"#2f2b30", text:"#e8dfce", whisper:"飾られた家族写真には、誰も笑っていない。", style:"photo"},
      {name:"爪切屋", kind:"odd", wall:"#a67c76", sign:"#5a2028", text:"#f6e3d8", whisper:"看板にだけ、新しい塗料が使われている。", style:"booth"}
    ];

    /* ============ 夕暮れの状態 ============ */
    var DUSK = {
      phase:0,            /* 0=夕金色 → 1=宵の底。1には漸近するだけで、届かない */
      enterTime:-1,
      visitedMax:0,
      nightText:false,    /* 囁きが夜版に切り替わったか */
      chimeDone:false
    };
    var NIGHT_T = 0.86;   /* 夜の囁きに切り替わる閾値 */

    var lamps = [];        /* 街灯 {head,light,th,t0} */
    var signLights = [];   /* 看板灯 {light,th,buzz,seed} */
    var windowGlows = [];  /* 窓明かり {m,th} */

    function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
    function lerp(a,b,t){ return a+(b-a)*t; }
    function smooth(x,a,b){
      var s = clamp((x-a)/(b-a),0,1);
      return s*s*(3-2*s);
    }

    var canvas = document.getElementById("c");
    var renderer = new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:false});
    renderer.setClearColor(0x11100e,1);
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.physicallyCorrectLights = false;
    if(THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;

    var scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xd38d5d, 24, 155);

    var camera = new THREE.PerspectiveCamera(43,1,0.1,300);

    function resize(){
      var w = innerWidth;
      var h = innerHeight;
      renderer.setSize(w,h,false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();

    function num(hex){ return parseInt(hex.replace("#",""),16); }

    function std(color, rough, metal, extra){
      var m = new THREE.MeshStandardMaterial({
        color:color,
        roughness:rough===undefined ? .92 : rough,
        metalness:metal===undefined ? .04 : metal
      });
      if(extra){ for(var k in extra) m[k] = extra[k]; }
      return m;
    }

    function makeTex(cv){
      var tx = new THREE.CanvasTexture(cv);
      if(THREE.sRGBEncoding) tx.encoding = THREE.sRGBEncoding;
      tx.needsUpdate = true;
      return tx;
    }

    function box(w,h,d,mat){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); }
    function cyl(r1,r2,h,seg,mat){ return new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg||12),mat); }
    function plane(w,h,mat){ return new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat); }

    function applyShadow(obj){
      obj.traverse(function(o){
        if(o.isMesh){
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
    }

    function canvasNoise(g,w,h,n,a1,a2,color){
      for(var i=0;i<n;i++){
        var a = a1 + Math.random()*(a2-a1);
        g.fillStyle = color.replace("__A__", a.toFixed(3));
        g.fillRect(Math.random()*w, Math.random()*h, 1+Math.random()*18, 1+Math.random()*4);
      }
    }

    function dirtyWallTexture(store){
      var cv = document.createElement("canvas");
      cv.width = 1024;
      cv.height = 1024;
      var g = cv.getContext("2d");

      g.fillStyle = store.wall;
      g.fillRect(0,0,1024,1024);

      var grad = g.createLinearGradient(0,0,0,1024);
      grad.addColorStop(0,"rgba(255,240,200,.16)");
      grad.addColorStop(.25,"rgba(255,255,255,.05)");
      grad.addColorStop(.65,"rgba(90,55,28,.07)");
      grad.addColorStop(1,"rgba(35,22,14,.38)");
      g.fillStyle = grad;
      g.fillRect(0,0,1024,1024);

      canvasNoise(g,1024,1024,2200,.012,.08,"rgba(40,25,15,__A__)");

      for(var c=0;c<26;c++){
        var x = Math.random()*980;
        var y = Math.random()*860;
        g.beginPath();
        g.moveTo(x,y);
        for(var q=0;q<6;q++){
          x += (Math.random()-.5)*28;
          y += 10+Math.random()*26;
          g.lineTo(x,y);
        }
        g.strokeStyle = "rgba(42,28,20,.14)";
        g.lineWidth = 1.5;
        g.stroke();
      }

      for(var r=0;r<24;r++){
        var rx = Math.random()*920;
        var ry = 620+Math.random()*320;
        var rw = 12+Math.random()*36;
        var rh = 60+Math.random()*140;
        var grd = g.createLinearGradient(rx,ry,rx,ry+rh);
        grd.addColorStop(0,"rgba(35,22,14,0)");
        grd.addColorStop(1,"rgba(35,22,14,.11)");
        g.fillStyle = grd;
        g.fillRect(rx,ry,rw,rh);
      }

      for(var s=0;s<180;s++){
        g.fillStyle = "rgba(45,28,18,"+(.02+Math.random()*.14)+")";
        g.fillRect(Math.random()*1024,860+Math.random()*150,2+Math.random()*18,1+Math.random()*8);
      }

      return makeTex(cv);
    }

    function tileTexture(base,alt){
      var cv = document.createElement("canvas");
      cv.width = 512;
      cv.height = 512;
      var g = cv.getContext("2d");
      for(var y=0;y<512;y+=64){
        for(var x=0;x<512;x+=64){
          g.fillStyle = ((x+y)/64)%2 ? base : alt;
          g.fillRect(x,y,64,64);
          g.strokeStyle = "rgba(30,30,30,.18)";
          g.strokeRect(x,y,64,64);
        }
      }
      canvasNoise(g,512,512,600,.01,.06,"rgba(0,0,0,__A__)");
      return makeTex(cv);
    }

    function metalTexture(base){
      var cv = document.createElement("canvas");
      cv.width = 512;
      cv.height = 512;
      var g = cv.getContext("2d");
      g.fillStyle = base;
      g.fillRect(0,0,512,512);

      var gr = g.createLinearGradient(0,0,512,0);
      gr.addColorStop(0,"rgba(255,255,255,.14)");
      gr.addColorStop(.5,"rgba(255,255,255,.02)");
      gr.addColorStop(1,"rgba(0,0,0,.16)");
      g.fillStyle = gr;
      g.fillRect(0,0,512,512);

      for(var i=0;i<512;i+=18){
        g.fillStyle = "rgba(255,255,255,.03)";
        g.fillRect(i,0,1,512);
      }
      canvasNoise(g,512,512,700,.01,.06,"rgba(0,0,0,__A__)");
      return makeTex(cv);
    }

    /* 空き店舗のシャッター */
    function shutterTexture(){
      var cv = document.createElement("canvas");
      cv.width = 512;
      cv.height = 512;
      var g = cv.getContext("2d");
      g.fillStyle = "#8d867c";
      g.fillRect(0,0,512,512);

      for(var y=0;y<512;y+=16){
        g.fillStyle = "rgba(0,0,0,.26)";
        g.fillRect(0,y,512,3);
        g.fillStyle = "rgba(255,255,255,.09)";
        g.fillRect(0,y+8,512,2);
      }

      for(var r=0;r<9;r++){
        var rx = Math.random()*470;
        var ry = Math.random()*260;
        var rh = 120+Math.random()*260;
        var grd = g.createLinearGradient(rx,ry,rx,ry+rh);
        grd.addColorStop(0,"rgba(122,62,32,0)");
        grd.addColorStop(.5,"rgba(122,62,32,.16)");
        grd.addColorStop(1,"rgba(84,42,24,.22)");
        g.fillStyle = grd;
        g.fillRect(rx,ry,10+Math.random()*26,rh);
      }

      canvasNoise(g,512,512,900,.01,.07,"rgba(30,22,16,__A__)");

      var grime = g.createLinearGradient(0,360,0,512);
      grime.addColorStop(0,"rgba(30,22,16,0)");
      grime.addColorStop(1,"rgba(30,22,16,.34)");
      g.fillStyle = grime;
      g.fillRect(0,360,512,152);

      return makeTex(cv);
    }

    function glassTexture(lit){
      var cv = document.createElement("canvas");
      cv.width = 512;
      cv.height = 512;
      var g = cv.getContext("2d");

      g.fillStyle = lit ? "#3b3027" : "#161a23";
      g.fillRect(0,0,512,512);

      if(lit){
        var glow = g.createRadialGradient(190,160,20,260,200,260);
        glow.addColorStop(0,"rgba(255,215,145,.7)");
        glow.addColorStop(.45,"rgba(255,165,90,.22)");
        glow.addColorStop(1,"rgba(0,0,0,0)");
        g.fillStyle = glow;
        g.fillRect(0,0,512,512);
      }

      g.fillRect(0,0,768,768);

      glow.addColorStop(0,"rgba(255,185,95,.34)");

      glow.addColorStop(1,"rgba(0,0,0,0)");
      g.fillStyle = glow;
      g.fillRect(0,0,768,768);

      for(var r=0;r<4;r++){
        g.fillStyle = "rgba(110,78,48,.55)";
        g.fillRect(56,110+r*130,656,12);

        for(var i=0;i<15;i++){

            g.fillStyle = "#e7d5ac";
            g.fillRect(x+3,y+h*.56,10,13);

            g.fillStyle = ["#6a5a8a","#8a4f46","#3f5d57","#b07a3a"][i%4];

    function signTexture(text,bg,fg,w,h,size){
      var cv = document.createElement("canvas");

      cv.height = h || 170;
      var g = cv.getContext("2d");

      g.fillStyle = bg;
      g.fillRect(0,0,cv.width,cv.height);

      wood.addColorStop(0,"rgba(255,255,255,.14)");
      wood.addColorStop(.18,"rgba(255,255,255,.04)");
      wood.addColorStop(.52,"rgba(0,0,0,.02)");
      wood.addColorStop(1,"rgba(0,0,0,.2)");
      g.fillStyle = wood;
      g.fillRect(0,0,cv.width,cv.height);

      for(var i=0;i<42;i++){
        g.strokeStyle = "rgba(255,255,255,.035)";
        g.lineWidth = 1+Math.random()*2;
        g.beginPath();
        var y = Math.random()*cv.height;
        g.moveTo(0,y);
        g.lineTo(cv.width,y+(Math.random()-.5)*14);
        g.stroke();
      }

      g.strokeStyle = "rgba(0,0,0,.48)";
      g.lineWidth = 11;
      g.strokeRect(7,7,cv.width-14,cv.height-14);

      var cx = side*(streetHalf+depth/2);

      /* ひさしを少し建物側に引く */
      var eave = frontBox(group,side,.50,3.86,z,1.1,.16,width+.06,std(0x584239,.84,.06));

      var gutter = cyl(.055,.055,width+.15,10,new THREE.MeshStandardMaterial({map:metalTexture("#4d463f"),roughness:.88,metalness:.1}));

    function sphericalToCartesian(target,yaw,pitch,dist){
      var v = new THREE.Vector3();
      var cosP = Math.cos(pitch);
      v.x = target.x + Math.cos(yaw)*dist*cosP;
      v.y = target.y + Math.sin(pitch)*dist;
      v.z = target.z + Math.sin(yaw)*dist*cosP;
      return v;
    }

    var actx = null;

    var higuGain = null;

    function ac(){
      if(!actx){
        try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e){ actx = null; }
      }
      if(actx && actx.state==="suspended") actx.resume();
      return actx;
    }

    function buildAir(c){
      if(airBus) return;
      airMaster = c.createGain();
      airMaster.gain.value = soundOn ? 1 : 0;
      airMaster.connect(c.destination);

      airBus = c.createGain();
      airBus.gain.value = 1;

      var dry = c.createGain();
      dry.gain.value = .85;
      airBus.connect(dry);
      dry.connect(airMaster);

      var dl = c.createDelay(1.2);
      dl.delayTime.value = .31;
      var fb = c.createGain();
      fb.gain.value = .34;
      var wet = c.createGain();
      wet.gain.value = .28;

      airBus.connect(dl);
      dl.connect(fb);
      fb.connect(dl);
      dl.connect(wet);
      wet.connect(airMaster);
    }

    function startSound(){
      var c = ac();
      if(!c || cicadaGain) return;

      buildAir(c);

      /* 油蝉。宵が深まるほど、遠のく */
      var len = Math.floor(c.sampleRate*2);
      var buf = c.createBuffer(1,len,c.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<len;i++) d[i] = Math.random()*2-1;

      var src = c.createBufferSource();
      src.buffer = buf;
      src.loop = true;

      var bp = c.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = 3850;
      bp.Q.value = 4;

      var amp = c.createGain();
      amp.gain.value = .075;

      var lfo = c.createOscillator();
      lfo.frequency.value = 7.4;

      var lg = c.createGain();
      lg.gain.value = .025;

      lfo.connect(lg);
      lg.connect(amp.gain);

      cicadaGain = c.createGain();
      cicadaGain.gain.value = soundOn ? .48 : 0;

      src.connect(bp);
      bp.connect(amp);
      amp.connect(cicadaGain);
      cicadaGain.connect(c.destination);

      src.start();
      lfo.start();

      /* 蜩。宵が深まると鳴き始める */
      higuGain = c.createGain();
      higuGain.gain.value = 0;
      var hlp = c.createBiquadFilter();
      hlp.type = "lowpass";
      hlp.frequency.value = 5200;
      higuGain.connect(hlp);
      hlp.connect(airBus);
      higuStarted = true;

      scheduleFurin();
      scheduleHigurashi();
    }

    function higuPhrase(t0,panV){
      var c = actx;
      var o = c.createOscillator();
      o.type = "sine";
      var g = c.createGain();
      g.gain.value = .0001;

      if(c.createStereoPanner){
        var p = c.createStereoPanner();
        p.pan.value = panV;
        o.connect(g);
        g.connect(p);
        p.connect(higuGain);
      }else{
        o.connect(g);
        g.connect(higuGain);
      }

      var n = 9+Math.floor(Math.random()*6);
      var f0 = 3750+Math.random()*350;

      for(var k=0;k<n;k++){
        var tp = t0+k*.088;
        var drop = k>n-4 ? (k-(n-4))*55 : 0;
        o.frequency.setValueAtTime(f0 - k*16 - drop, tp);
        g.gain.setValueAtTime(.0001,tp);
        g.gain.linearRampToValueAtTime(.5,tp+.014);
        g.gain.exponentialRampToValueAtTime(.0001,tp+.075);
      }

      o.start(t0);
      o.stop(t0+n*.088+.25);
    }

    function scheduleHigurashi(){
      setTimeout(function(){
        if(actx && higuStarted && soundOn && DUSK.phase>0.3){
          var t = actx.currentTime+.05;
          higuPhrase(t,(Math.random()<.5?-1:1)*(.3+Math.random()*.5));
          if(Math.random()<.45){
            higuPhrase(t+.6+Math.random()*1.2,(Math.random()<.5?-1:1)*.6);
          }
        }
        scheduleHigurashi();
      },2800+Math.random()*4200);
    }

    /* 街灯が点く頃、どこか遠くで時報が鳴る。一度だけ */
    function playChime(){
      if(!actx || !airBus) return;
      var c = actx;
      var t = c.currentTime+.4;
      var seq = [659.25,523.25,587.33,392.0, 392.0,587.33,659.25,523.25];

      for(var i=0;i<seq.length;i++){
        var tn = t + i*.92 + (i>3 ? .5 : 0);
        var parts = [1,2.756];
        for(var j=0;j<parts.length;j++){
          var o = c.createOscillator();
          o.type = "sine";
          o.frequency.value = seq[i]*parts[j];
          var g = c.createGain();
          g.gain.setValueAtTime(.0001,tn);
          g.gain.exponentialRampToValueAtTime(j ? .028 : .09, tn+.02);
          g.gain.exponentialRampToValueAtTime(.0001, tn+2.6);
          o.connect(g);
          g.connect(airBus);
          o.start(tn);
          o.stop(tn+2.8);
        }
      }
    }

    function scheduleFurin(){
      if(!actx) return;
      setTimeout(function(){
        if(soundOn && actx && airBus){
          var c = actx;
          var t = c.currentTime;
          [1318,1567].forEach(function(f,i){
            var o = c.createOscillator();
            var g = c.createGain();
            o.type = "sine";
            o.frequency.value = f*(1+i*.002);
            g.gain.setValueAtTime(.0001,t);
            g.gain.exponentialRampToValueAtTime(.11,t+.02);
            g.gain.exponentialRampToValueAtTime(.0001,t+1.7);
            o.connect(g);
            g.connect(airBus);
            o.start(t);
            o.stop(t+1.8);
          });
        }
        scheduleFurin();
      },6000+Math.random()*9000);
    }

    var warmLayer = document.getElementById("warmLayer");

    function animate(now){
      var dt = Math.min(.05,(now-last)/1000);
      last = now;

      /* ---- 夕暮れの進行。時間と、歩いた店の数で深まる ---- */
      var elapsed = DUSK.enterTime>0 ? (now-DUSK.enterTime)/1000 : 0;
      var p = 1 - Math.exp(-(elapsed + DUSK.visitedMax*45)/420);
      DUSK.phase = p;

      redrawSky(p);
      scene.fog.color.copy(cFogA).lerp(cFogB,p);
      scene.fog.near = lerp(24,20,p);
      scene.fog.far = lerp(155,120,p);

      hemi.color.copy(cHemiA).lerp(cHemiB,p);
      hemi.groundColor.copy(cGndA).lerp(cGndB,p);
      hemi.intensity = lerp(.95,.5,p);

      sun.color.copy(cSunA).lerp(cSunB,p);
      sun.intensity = lerp(1.08,.1,p);
      sun.position.set(lerp(-14,-10,p), lerp(22,6.5,p), lerp(28,40,p));

      amb.color.copy(cAmbA).lerp(cAmbB,p);
      amb.intensity = lerp(.34,.3,p);

      sunDisc.position.y = lerp(8.2,-3.5,p);
      sunDisc.material.opacity = .92*(1-smooth(p,.5,.92));
      sunDisc.lookAt(0,sunDisc.position.y,0);

      renderer.toneMappingExposure = lerp(1.1,.98,p);
      warmLayer.style.opacity = (1-p).toFixed(3);

      /* 街灯。閾値を越えた一本ずつが、瞬いてから点く */
      for(var li=0;li<lamps.length;li++){
        var L = lamps[li];
        if(p>=L.th){
          if(L.t0<0) L.t0 = now;
          var e = (now-L.t0)/1200;
          if(e<1){
            var on = Math.random()<Math.min(.92,e+.15);
            L.light.intensity = on ? .5+Math.random()*.15 : .02;
            L.head.material.emissiveIntensity = on ? .9 : .08;
          }else{
            L.light.intensity = .58;
            L.head.material.emissiveIntensity = .95;
          }
        }else{
          L.light.intensity = 0;
          L.head.material.emissiveIntensity = .05;
        }
      }

      /* 看板灯。数本に一本は、切れかけのまま */
      for(var si=0;si<signLights.length;si++){
        var S = signLights[si];
        if(p>=S.th){
          var base = .4*Math.min(1,(p-S.th)*6);
          if(S.buzz){
            var gate = Math.sin(now*.011+S.seed)*Math.sin(now*.0037+S.seed*2);
            S.light.intensity = base*(gate>-.2 ? 1 : .22);
          }else{
            S.light.intensity = base;
          }
        }else{
          S.light.intensity = 0;
        }
      }

      /* 窓明かり。一つずつ灯る */
      for(var wi=0;wi<windowGlows.length;wi++){
        var W = windowGlows[wi];
        W.m.material.opacity = p>W.th ? Math.min(1,(p-W.th)*7)*.3 : 0;
      }

      /* 時報。街灯の頃に、一度だけ */
      if(!DUSK.chimeDone && p>=.5){
        DUSK.chimeDone = true;
        if(soundOn) playChime();
      }

      /* 蝉から蜩へ */
      if(cicadaGain){
        cicadaGain.gain.value = soundOn ? .48*(1-smooth(p,.2,.7)) : 0;
      }
      if(higuGain){
        higuGain.gain.value = smooth(p,.3,.75)*.12;
      }

      /* 囁きが夜版に変わる瞬間 */
      if(!DUSK.nightText && p>NIGHT_T){
        DUSK.nightText = true;
        updateCaption(false);
      }

      updateClock(p);

      var a = getAnchor();
      var mode = focusModes[focusIndex];

      cam.target.copy(a.targets[mode]);
      cam.currentTarget.lerp(cam.target,Math.min(1,dt*4.8));

      var yaw = baseYawForSide(a.side)+cam.yaw;
      var desiredPos = sphericalToCartesian(cam.currentTarget,yaw,cam.pitch,cam.dist);
      cam.currentPos.lerp(desiredPos,Math.min(1,dt*4.0));

      camera.position.copy(cam.currentPos);

      /* わずかな手持ちの揺れ */
      lookTmp.copy(cam.currentTarget);
      lookTmp.x += Math.sin(now*.0006)*.05;
      lookTmp.y += Math.sin(now*.0009+2)*.04;
      camera.lookAt(lookTmp);

      hero.position.x += (a.heroPos.x-hero.position.x)*Math.min(1,dt*4.6);
      hero.position.z += (a.heroPos.z-hero.position.z)*Math.min(1,dt*4.6);
      hero.rotation.y = a.side<0 ? Math.PI*.15 : -Math.PI*.15;

      /* 観測者は薄れていく */
      var heroOp = 1 - smooth(p,.25,.95)*.93;
      hero.traverse(function(o){
        if(o.isMesh) o.material.opacity = heroOp;
      });

      walkPhase += dt*5;
      var sw = Math.sin(walkPhase)*.18;
      hero.userData.legL.rotation.x = sw;
      hero.userData.legR.rotation.x = -sw;
      hero.userData.armL.rotation.x = -sw*.85;
      hero.userData.armR.rotation.x = sw*.85;

      var m = motes.userData;
      for(var i=0;i<m.N;i++){
        m.pos[i*3+1] += dt*.22;
        m.pos[i*3] += dt*.12;
        if(m.pos[i*3+1]>7.5) m.pos[i*3+1] = 0;
        if(m.pos[i*3]>9) m.pos[i*3] = -9;
      }
      motes.geometry.attributes.position.needsUpdate = true;
      motes.position.z = hero.position.z;
      motes.material.opacity = lerp(.42,.16,p);

      renderer.render(scene,camera);
      requestAnimationFrame(animate);
    }

    updateCaption(true);
    resetView(true);

    document.getElementById("enterBtn").addEventListener("click",function(){
      document.getElementById("veil").classList.add("off");
      ac();
      startSound();
      DUSK.enterTime = performance.now();
      last = performance.now();
      requestAnimationFrame(animate);
    });
  }

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(boot);
  }else{
    boot();
  }
})();
</script>
</body>
</html>
