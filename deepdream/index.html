<!doctype html><html lang="ja"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="description" content="画像を動物・昆虫・海洋生物・人体・植物の特徴で反復変換するDeepDream実験ツール。"/><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta http-equiv="Expires" content="0"/><title>DeepDream Lab</title><link rel="stylesheet" href="./style.css?v=20260819v20"/><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script></head><body><main class="app"><section class="stage-wrap"><canvas id="stage" width="1024" height="1024"></canvas><div id="drop" class="drop">画像を選ぶ / ドロップ</div></section><section class="panel"><div class="asset-title">幻覚アセット</div><div class="assets" role="group" aria-label="幻覚アセット"><button type="button" data-asset="animals" class="active">動物</button><button type="button" data-asset="insects">昆虫</button><button type="button" data-asset="marine">海洋生物</button><button type="button" data-asset="human">人体</button><button type="button" data-asset="plants">植物</button></div><div class="toolbar"><label class="file-btn">画像<input id="file" type="file" accept="image/*"/></label><button id="run">夢を見る</button><button id="stop">停止</button><button id="undo">戻す</button><button id="reset">原画</button><button id="download">PNG保存</button></div><p class="note">ASSET DREAM v20。動物・昆虫・海洋生物・人体・植物を固定アセットとして選択し、同じアセットで繰り返し変換できます。各アセットはImageNet分類器から意味系統に反応する特徴チャンネルをビルド時に抽出。入力画像は縮小せず、原画像の実解像度を96×96タイルで処理します。最終出力を低解像度から引き伸ばす処理は行いません。</p><p id="status">起動中… ｜ 2026-08-19 v20</p></section></main><script type="module" src="./main-v20.js?v=20260819v20"></script></body></html>
