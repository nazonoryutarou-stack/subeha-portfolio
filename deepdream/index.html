<!doctype html><html lang="ja"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta http-equiv="Expires" content="0"/><title>DeepDream Lab</title><link rel="stylesheet" href="./style.css?v=20260818v6"/><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script></head><body><main class="app"><section class="stage-wrap"><canvas id="stage" width="1024" height="1024"></canvas><div id="drop" class="drop">画像を選ぶ / ドロップ</div></section><section class="panel"><div class="toolbar"><label class="file-btn">画像<input id="file" type="file" accept="image/*"/></label><button id="run">Dream</button><button id="stop">停止</button><button id="undo">戻す</button><button id="reset">原画</button><button id="download">PNG保存</button></div><details open><summary>夢の設定</summary><div class="grid"><label>モデル <select id="modelProfile"><option value="light" selected>軽量・スマホ</option><option value="balanced">標準</option><option value="quality">高品質・重い</option></select></label><label>強度 <input id="strength" type="range" min="0.1" max="2" step="0.05" value="0.85"><output id="strengthOut">0.85</output></label><label>反復 <input id="steps" type="range" min="1" max="60" step="1" value="24"><output id="stepsOut">24</output></label><label>オクターブ <input id="octaves" type="range" min="1" max="6" step="1" value="4"><output id="octavesOut">4</output></label><label>ズーム <input id="zoom" type="range" min="1" max="1.12" step="0.002" value="1.025"><output id="zoomOut">1.025</output></label><label>ディテール <input id="detail" type="range" min="0" max="1" step="0.01" value="0.72"><output id="detailOut">0.72</output></label><label>色暴走 <input id="color" type="range" min="0" max="1" step="0.01" value="0.08"><output id="colorOut">0.08</output></label><label>ジッター <input id="tile" type="range" min="96" max="320" step="32" value="192"><output id="tileOut">192</output></label><label>夢の深さ <input id="layerDepth" type="range" min="0" max="1" step="0.01" value="0.55"><output id="layerDepthOut">0.55</output></label><label>層ミックス <input id="layerSpread" type="range" min="1" max="3" step="1" value="2"><output id="layerSpreadOut">2</output></label><label>幻覚ノイズ <input id="noise" type="range" min="0" max="0.5" step="0.01" value="0.08"><output id="noiseOut">0.08</output></label><label>夢の種 <input id="seed" type="text" value="subeha"/></label><label>解像度 <select id="size"><option selected>512</option><option>768</option><option>1024</option></select></label></div></details><details open><summary>プリセット</summary><div class="presets"><button data-preset="classic">CLASSIC 2015</button><button data-preset="eyes">EYES</button><button data-preset="fur">FUR</button><button data-preset="architecture">ARCHITECTURE</button><button data-preset="acid">ACID</button><button data-preset="mild">MILD</button></div></details><details><summary>連続夢</summary><div class="grid"><label>フレーム数 <input id="frames" type="number" min="2" max="24" value="8"></label><label>自動ズーム <input id="autoZoom" type="checkbox" checked></label></div><div class="toolbar"><button id="sequence">連続生成</button><button id="exportZip" disabled>フレーム一括保存</button></div></details><details><summary>比較・補助</summary><div class="toolbar"><button id="split">原画比較</button><button id="fit">全体表示</button><button id="random">ランダム化</button></div><label class="full">比較位置 <input id="compare" type="range" min="0" max="1" step="0.01" value="0.5"></label></details><p id="status">起動中… ｜ 2026-08-18 v6</p><p class="note">v6: MobileNetの中間畳み込みノードを自動探索して形の幻覚を増幅。取得できない端末では埋め込み特徴へ自動fallback。色潰れを抑え、浅層〜深層・層ミックス・幻覚ノイズ・seedを追加。</p></section></main><script type="module" src="./main-v4.js?v=20260818v6"></script></body></html>
