<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f0e7">
<title>すべての歯が見える</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f3f0e7;color:#202020}
body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.gate{min-height:100svh;display:grid;place-items:center;padding:32px 24px}
.inner{width:min(100%,420px);text-align:center}
.crest{display:block;width:min(64vw,270px);height:auto;margin:0 auto 22px;object-fit:contain}
.name{margin:0 0 38px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(24px,7vw,34px);font-weight:600;letter-spacing:.16em;text-indent:.16em;color:#171717}
.enter{display:inline-flex;align-items:center;justify-content:center;min-width:180px;min-height:54px;padding:0 34px;border:1.5px solid #202020;border-radius:999px;background:transparent;color:#202020;text-decoration:none;font-size:18px;font-weight:700;letter-spacing:.28em;text-indent:.28em;transition:.18s ease}
.enter:hover,.enter:focus-visible{background:#202020;color:#f3f0e7;transform:translateY(-1px)}
.enter:active{transform:translateY(1px)}
</style>
</head>
<body>
<main class="gate">
  <div class="inner">
    <img class="crest" src="hitotsu-ore-choji.png" alt="一つ折れ丁字">
    <h1 class="name">すべての歯が見える</h1>
    <a class="enter" href="home.html">入場</a>
  </div>
</main>
</body>
</html>
