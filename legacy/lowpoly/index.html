<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3efe4">
<meta name="robots" content="noindex,follow">
<title>旧版コンテンツ | すべての歯が見える</title>
<link rel="stylesheet" href="/assets/home-redesign.css">
<style>
html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column}.site-header{flex:0 0 auto}.content-frame{display:block;flex:1 1 auto;min-height:0;width:100%;border:0;background:#111}.frame-tools{position:absolute;right:92px;top:22px;z-index:80;display:flex;gap:8px}.frame-tools a{display:inline-flex;align-items:center;min-height:36px;padding:0 11px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none;font:700 9px/1 var(--mono);letter-spacing:.1em}@media(max-width:700px){.frame-tools{right:76px;top:20px}.frame-tools a:first-child{display:none}}
</style>
</head>
<body>
<header class="site-header">
  <a class="logo" href="/home.html" aria-label="すべての歯が見える ホーム">
    <img class="brand-crest" src="/hitotsu-ore-choji.png" alt="一つ折れ丁字">
    <span><b>すべての歯が見える</b><small id="legacyLabel">LEGACY ARCHIVE</small></span>
  </a>
  <details class="menu-wrap">
    <summary class="menu-button">MENU</summary>
    <nav class="global-nav" aria-label="主要メニュー"><a href="/home.html">ホーム</a><a href="/contents/">コンテンツ総覧</a><a href="/works/">作品保管庫</a></nav>
  </details>
</header>
<div class="frame-tools"><a href="/contents/">一覧へ戻る</a><a id="solo" href="#" target="_blank" rel="noopener">旧版を単体表示</a></div>
<iframe id="frame" class="content-frame" title="旧版コンテンツ本体" allow="fullscreen; autoplay; clipboard-read; clipboard-write" allowfullscreen></iframe>
<script>
(function(){
  var base=location.hostname.endsWith('github.io')?'/subeha-portfolio':'';
  var parts=location.pathname.split('/').filter(Boolean), key=parts[parts.length-1];
  var map={
    gyogen:{file:'gyogen-rin-v1.0.2.html',label:'魚言・鱗式 / LEGACY'},
    fudasho:{file:'fudasho-observation-091.html',label:'札・観測所 / LEGACY'},
    lowpoly:{file:'lowpoly-kone-uv.html',label:'ローポリ捏ね UV / LEGACY'},
    yaniv:{file:'yaniv.html',label:'ヤニブ / LEGACY'},
    miharai:{file:'miharai-map.html',label:'未祓いマップ / LEGACY'}
  };
  var item=map[key]||map.gyogen;
  var url=base+'/archive/neocities/'+item.file;
  var frame=document.getElementById('frame');
  document.getElementById('solo').href=url;
  document.getElementById('legacyLabel').textContent=item.label;
  frame.addEventListener('load',function(){
    try{
      var doc=frame.contentDocument;
      if(!doc)return;
      doc.querySelectorAll('a[href="index.html"],a[href="./index.html"]').forEach(function(a){
        a.href=base+'/contents/';
        a.target='_top';
      });
    }catch(e){console.warn('legacy link repair skipped',e)}
  });
  frame.src=url;
})();
</script>
</body>
</html>
