.members-page{max-width:1120px;margin:0 auto;padding:60px 24px 120px}.members-hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.6fr);gap:36px;align-items:end;padding-bottom:38px;border-bottom:1px solid var(--line)}.members-hero h1{font-size:clamp(46px,8vw,88px);line-height:.95;margin:8px 0 18px}.members-hero p{max-width:720px;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;line-height:1.9}.member-plan{border:1px solid var(--line);padding:22px;background:var(--paper)}.member-plan b{display:block;font-size:2rem;margin:.2rem 0 .5rem}.member-plan strong{display:block;font-size:1.4rem}.member-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.member-button{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--bone);padding:11px 16px;text-decoration:none;font:700 .92rem/1 system-ui,-apple-system,"Yu Gothic",sans-serif;cursor:pointer}.member-button.secondary{background:transparent;color:var(--ink)}.member-status{min-height:1.5em;margin:16px 0 0;font:600 .82rem/1.5 var(--mono);color:var(--muted)}.archive{margin-top:44px}.archive-toolbar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:20px}.archive-toolbar input{width:min(560px,100%);border:1px solid var(--line);background:var(--paper);padding:13px 14px;font:inherit;color:var(--ink)}.archive-toolbar small{font:700 .78rem/1 var(--mono)}.archive-grid{display:grid;grid-template-columns:minmax(260px,.38fr) minmax(0,.62fr);gap:24px;align-items:start}.report-list{display:grid;gap:10px;max-height:72vh;overflow:auto;padding-right:4px}.report-item{appearance:none;text-align:left;border:1px solid var(--line);background:var(--paper);padding:15px;color:var(--ink);cursor:pointer}.report-item:hover,.report-item:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}.report-item b{display:block;font-size:1rem}.report-item small{display:block;margin-top:6px;color:var(--muted);font:600 .72rem/1.3 var(--mono)}.report-topics{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.report-topics span{border:1px solid var(--line);padding:3px 5px;font-size:.66rem}.report-body{min-height:420px;border:1px solid var(--line);background:var(--paper);padding:clamp(18px,4vw,42px)}.report-placeholder{color:var(--muted);font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}.report-head{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}.report-head small{font:700 .75rem/1 var(--mono)}.report-head h2{font-size:clamp(28px,4vw,48px);margin:8px 0 0}.markdown{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;line-height:1.95}.markdown h2,.markdown h3,.markdown h4{font-family:inherit;line-height:1.35;margin:2.1em 0 .7em}.markdown p{margin:.7em 0}.markdown ul{padding-left:1.4em}.markdown blockquote{margin:1.2em 0;padding:.7em 1em;border-left:3px solid var(--ink);background:rgba(0,0,0,.035)}.markdown code{font-family:var(--mono);font-size:.9em}.empty{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:var(--muted)}[hidden]{display:none!important}@media(max-width:780px){.members-page{padding:40px 16px 90px}.members-hero{grid-template-columns:1fr}.archive-grid{grid-template-columns:1fr}.report-list{max-height:38vh}.archive-toolbar{align-items:stretch;flex-direction:column}}

<main class="members-page">
  <section class="members-hero">

      <p class="section-label">MEMBERS / BROADCAST REPORT ARCHIVE</p>
