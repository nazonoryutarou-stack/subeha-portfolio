<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="観測したが処理を完了していない霊的事例の公開台帳。正確な地点は公開していません。">
<meta name="theme-color" content="#f3efe4">
<title>未祓いマップ｜すべての歯が見える</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bone:#f3efe4;--ink:#161514;--muted:#625d55;--line:#cfc6b7;--rust:#7d2f22;--brown:#4a342b;--paper:#fbf8f0;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html{background:var(--bone)}html,body{margin:0;background:var(--bone);color:var(--ink)}body{font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif}
a{color:inherit}.site-header{position:sticky;top:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:82px;padding:12px 18px;background:rgba(243,239,228,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}.brand-crest{width:72px;height:54px;object-fit:contain}.logo b{display:block;font-size:17px;line-height:1.2;letter-spacing:.06em}.logo small{display:block;margin-top:5px;font:9px/1.2 var(--mono);letter-spacing:.14em;color:var(--muted)}.back{font:700 11px/1 var(--mono);letter-spacing:.1em;text-decoration:none;border:1px solid var(--ink);padding:14px 16px}
main{max-width:1120px;margin:0 auto;padding:0 22px 90px}.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.65fr);gap:40px;padding:72px 0 44px;border-bottom:1px solid var(--line)}.ey{margin:0 0 18px;font:600 11px/1.4 var(--mono);letter-spacing:.17em;color:var(--muted)}h1{margin:0;font-size:clamp(52px,8vw,98px);font-weight:600;line-height:.98;letter-spacing:-.05em}.hero p:last-child{margin:0;align-self:end;font-size:17px;line-height:2;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);margin:30px 0}.sum{padding:18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper)}.sum b{display:block;font:700 28px/1 var(--mono)}.sum span{display:block;margin-top:8px;font:10px/1.4 var(--mono);letter-spacing:.12em;color:var(--muted)}
.map-shell{border:1px solid var(--line);background:var(--paper)}#map{height:64vh;min-height:480px;filter:grayscale(.35) sepia(.08) contrast(.96)}.leaflet-container{background:#d8d1c2}.leaflet-control-attribution{font-size:9px!important}.leaflet-popup-content-wrapper{background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:2px;box-shadow:0 14px 34px rgba(0,0,0,.14);font-family:"Yu Mincho","Hiragino Mincho ProN",serif}.leaflet-popup-tip{background:var(--paper)}.leaflet-popup-close-button{color:var(--muted)!important}.pop-id{font:10px/1.4 var(--mono);letter-spacing:.1em;color:var(--muted)}.pop-name{margin:6px 0 10px;font-size:21px;font-weight:600}.pop-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tag{border:1px solid var(--line);padding:4px 6px;font:10px/1 var(--mono);color:var(--muted)}.tag.red{border-color:var(--rust);color:var(--rust)}.pop-desc{font-size:15px;line-height:1.9}.pop-meta{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font:12px/1.8 system-ui,-apple-system,"Yu Gothic",sans-serif;color:var(--muted)}
.spot{width:16px;height:16px;border-radius:50%;background:var(--rust);border:2px solid #f3efe4;box-shadow:0 0 0 2px var(--rust)}.spot.watch{background:#9a6a25;box-shadow:0 0 0 2px #9a6a25}.spot.done{background:#777067;box-shadow:0 0 0 2px #777067}.status{padding:14px 16px;border-top:1px solid var(--line);font:11px/1.7 var(--mono);letter-spacing:.08em;color:var(--muted)}
.note{display:grid;grid-template-columns:150px 1fr;gap:30px;padding:34px 0;border-bottom:1px solid var(--line)}.note strong{font:600 11px/1.5 var(--mono);letter-spacing:.1em;color:var(--muted)}.note p{margin:0;font-size:16px;line-height:2;color:var(--muted)}.site-footer{background:#151412;color:var(--bone);padding:28px 22px}.footer-brand{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:18px}.site-footer .brand-crest{filter:invert(1) grayscale(1) brightness(1.8);width:86px;height:64px}.footer-brand p{margin:5px 0 0;color:#c9c0b2}
@media(max-width:760px){.site-header{min-height:76px;padding:10px 14px}.brand-crest{width:62px;height:46px}.logo b{font-size:16px}.logo small{display:none}.back{padding:12px 13px}main{padding:0 18px 64px}.hero{grid-template-columns:1fr;gap:24px;padding:48px 0 34px}h1{font-size:clamp(48px,15vw,68px)}.hero p:last-child{font-size:16px}.summary{grid-template-columns:repeat(2,1fr)}#map{height:66vh;min-height:520px}.note{grid-template-columns:1fr;gap:10px}}
</style>
</head>
<body>
<header class="site-header">
  <a class="logo" href="../home.html"><img class="brand-crest" src="../hitotsu-ore-choji.png" alt="一つ折れ丁字"><span><b>すべての歯が見える</b><small>霊能者・祭祀技師</small></span></a>
  <a class="back" href="../home.html">HOME</a>
</header>
<main>
  <section class="hero">
    <div><p class="ey">OBSERVATION LEDGER / PUBLIC</p><h1>未祓い<br>マップ</h1></div>
    <p>観測したが、現在も処理が完了していない霊的事例の公開台帳です。未祓いは「危険」を意味しません。位置は意図的にぼかして公開します。</p>
  </section>
  <section class="summary" aria-label="記録集計">
    <div class="sum"><b id="countAll">0</b><span>総記録</span></div>
    <div class="sum"><b id="countActive">0</b><span>観測中</span></div>
    <div class="sum"><b id="countNoNeed">0</b><span>処理不要</span></div>
    <div class="sum"><b id="countClosed">0</b><span>処理済・消失</span></div>
  </section>
  <section class="map-shell"><div id="map"></div><div class="status" id="status">記録を読み込む…</div></section>
  <section class="note"><strong>公開上の注意</strong><p>正確な位置、個人宅、私人を特定できる情報は公開しません。地点は観測地点の周辺へずらして表示しています。同業者が現場対応を検討する場合は、公開情報だけで勝手に立ち入らず、まず連絡してください。</p></section>
</main>
<footer class="site-footer"><div class="footer-brand"><img class="brand-crest" src="../hitotsu-ore-choji.png" alt="一つ折れ丁字"><div><b>すべての歯が見える</b><p>呪われてても心は錦。</p></div></div></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATA_URL='./data.json';
const map=L.map('map',{scrollWheelZoom:false}).setView([34.69,135.50],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cls(status){if(['処理済','消失'].includes(status))return'done';if(['経過観察','観測中','未確認'].includes(status))return'watch';return''}
function popup(x){return `<div class="pop-id">${esc(x.id)}</div><div class="pop-name">${esc(x.name||x.area||'名称未設定')}</div><div class="pop-tags"><span class="tag red">${esc(x.type||'未分類')}</span><span class="tag">${esc(x.status||'未処理')}</span>${x.risk?`<span class="tag">危険度 ${esc(x.risk)}/5</span>`:''}</div><div class="pop-desc">${esc(x.description||'記録なし').replace(/\n/g,'<br>')}</div><div class="pop-meta">地域：${esc(x.area||'非公開')}<br>未処理理由：${esc(x.reason||'記録なし')}<br>観測：${esc(x.observed||'—')} ／ 更新：${esc(x.updated||x.observed||'—')}</div>`}
async function load(){try{const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();layer.clearLayers();const bounds=[];data.forEach(x=>{if(!Number.isFinite(Number(x.lat))||!Number.isFinite(Number(x.lng)))return;const icon=L.divIcon({className:'',html:`<div class="spot ${cls(x.status)}"></div>`,iconSize:[16,16],iconAnchor:[8,8]});L.marker([x.lat,x.lng],{icon}).addTo(layer).bindPopup(popup(x));bounds.push([x.lat,x.lng])});document.getElementById('countAll').textContent=data.length;document.getElementById('countActive').textContent=data.filter(x=>['観測中','未確認','経過観察','未処理','処理予定'].includes(x.status)).length;document.getElementById('countNoNeed').textContent=data.filter(x=>x.status==='処理不要').length;document.getElementById('countClosed').textContent=data.filter(x=>['処理済','消失'].includes(x.status)).length;document.getElementById('status').textContent=`公開記録：${data.length}件`;if(bounds.length>1)map.fitBounds(bounds,{padding:[38,38],maxZoom:13});else if(bounds.length===1)map.setView(bounds[0],13)}catch(e){document.getElementById('status').textContent='記録を読み込めませんでした。';console.error(e)}}load();
</script>
</body></html>
