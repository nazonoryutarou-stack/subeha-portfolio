<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>未祓いマップ ── すべての歯が見える</title>
<meta name="description" content="観測したが処理を完了していない霊的事例の公開台帳。正確な地点は公開していません。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--void:#050505;--bone:#d8cdb8;--dim:#7d745f;--blood:#a51212;--line:#211d17;--panel:#0b0a08;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--void);color:var(--bone);font-family:'Shippori Mincho',serif}
body{min-height:100vh;background:radial-gradient(circle at 50% 0,#12100c 0,#050505 38%)}
.head{text-align:center;padding:48px 20px 22px}.k{font-family:var(--mono);font-size:.55rem;letter-spacing:.35em;color:var(--blood)}
h1{margin:10px 0 0;font-size:clamp(1.65rem,6vw,2.8rem);letter-spacing:.25em;text-indent:.25em}.head p{margin:16px auto 0;max-width:760px;color:var(--dim);font-size:.72rem;letter-spacing:.13em;line-height:2}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sum{background:#080706;padding:13px 10px;text-align:center}.sum b{display:block;font-family:var(--mono);font-size:1.05rem;color:var(--bone)}.sum span{font-size:.54rem;letter-spacing:.15em;color:var(--dim)}
#map{height:64vh;min-height:440px;filter:grayscale(.55) brightness(.72) contrast(1.1);border-bottom:1px solid var(--line)}.leaflet-container{background:#090909}
.leaflet-popup-content-wrapper{background:#0c0a08;color:var(--bone);border:1px solid var(--blood);border-radius:0;font-family:'Shippori Mincho',serif}.leaflet-popup-tip{background:#0c0a08}.leaflet-popup-close-button{color:var(--dim)!important}
.pop-id{font-family:var(--mono);font-size:.52rem;color:var(--dim);letter-spacing:.12em}.pop-name{font-size:1rem;font-weight:700;letter-spacing:.08em;margin:5px 0}.pop-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.tag{font-family:var(--mono);font-size:.48rem;letter-spacing:.1em;border:1px solid var(--line);padding:3px 5px;color:#c7bfae}.tag.red{border-color:#5f1717;color:#e07a73}.pop-desc,.pop-meta{font-size:.74rem;line-height:1.9;color:#9e9686}.pop-meta{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
.spot{width:15px;height:15px;border-radius:50%;background:var(--blood);border:2px solid #eb5d55;box-shadow:0 0 10px rgba(165,18,18,.8)}.spot.done{background:#57534b;border-color:#8a8377;box-shadow:none}.spot.watch{background:#8c5a16;border-color:#d59a3c;box-shadow:0 0 10px rgba(140,90,22,.65)}
.foot{text-align:center;padding:18px 20px 54px;color:var(--dim);font-size:.64rem;letter-spacing:.1em;line-height:2}.foot a{color:var(--dim);text-decoration:none}.status{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;padding:12px;text-align:center;color:var(--dim)}
@media(max-width:620px){.summary{grid-template-columns:repeat(2,1fr)}#map{min-height:500px;height:68vh}}
</style>
</head>
<body>
<header class="head">
  <div class="k">OBSERVATION LEDGER / PUBLIC</div>
  <h1>未 祓 い マ ッ プ</h1>
  <p>観測したが、現在も処理が完了していない霊的事例の公開台帳です。地点は安全のため意図的にぼかしています。未祓いは「危険」を意味しません。</p>
</header>
<section class="summary">
  <div class="sum"><b id="countAll">0</b><span>総記録</span></div>
  <div class="sum"><b id="countActive">0</b><span>観測中</span></div>
  <div class="sum"><b id="countNoNeed">0</b><span>処理不要</span></div>
  <div class="sum"><b id="countClosed">0</b><span>処理済・消失</span></div>
</section>
<div id="map"></div>
<div class="status" id="status">記録を読み込む…</div>
<footer class="foot">● 赤＝未処理　● 黄＝経過観察　● 灰＝処理済・消失<br>正確な位置情報、個人宅、特定の私人を示す情報は公開しません。<br><a href="../home.html">← ホームへ戻る</a></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATA_URL='./data.json';
const map=L.map('map',{scrollWheelZoom:false}).setView([34.69,135.50],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map);
const layer=L.layerGroup().addTo(map);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cls(status){if(['処理済','消失'].includes(status))return'done';if(['経過観察','観測中','未確認'].includes(status))return'watch';return''}
function popup(x){return `<div class="pop-id">${esc(x.id)}</div><div class="pop-name">${esc(x.name||x.area||'名称未設定')}</div><div class="pop-tags"><span class="tag red">${esc(x.type||'未分類')}</span><span class="tag">${esc(x.status||'未処理')}</span>${x.risk?`<span class="tag">危険度 ${esc(x.risk)}/5</span>`:''}</div><div class="pop-desc">${esc(x.description||'記録なし').replace(/\n/g,'<br>')}</div><div class="pop-meta">地域：${esc(x.area||'非公開')}<br>未処理理由：${esc(x.reason||'記録なし')}<br>観測：${esc(x.observed||'—')} ／ 更新：${esc(x.updated||x.observed||'—')}</div>`}
async function load(){
 try{
  const r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
  const data=await r.json();layer.clearLayers();const bounds=[];
  data.forEach(x=>{if(!Number.isFinite(Number(x.lat))||!Number.isFinite(Number(x.lng)))return;const icon=L.divIcon({className:'',html:`<div class="spot ${cls(x.status)}"></div>`,iconSize:[15,15],iconAnchor:[7,7]});L.marker([x.lat,x.lng],{icon}).addTo(layer).bindPopup(popup(x));bounds.push([x.lat,x.lng])});
  document.getElementById('countAll').textContent=data.length;
  document.getElementById('countActive').textContent=data.filter(x=>['観測中','未確認','経過観察','未処理','処理予定'].includes(x.status)).length;
  document.getElementById('countNoNeed').textContent=data.filter(x=>x.status==='処理不要').length;
  document.getElementById('countClosed').textContent=data.filter(x=>['処理済','消失'].includes(x.status)).length;
  document.getElementById('status').textContent=`公開記録：${data.length}件`;
  if(bounds.length>1)map.fitBounds(bounds,{padding:[38,38],maxZoom:13});else if(bounds.length===1)map.setView(bounds[0],13);
 }catch(e){document.getElementById('status').textContent='記録を読み込めませんでした。';console.error(e)}
}
load();
</script>
</body></html>
