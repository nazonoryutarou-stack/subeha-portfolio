const rooms={shindan:["十六霊感診断","診断室は移設中です。記録が定着するまで、しばらくお待ちください。"],bakemongo:["バケモンGO","捕獲区域は封鎖中です。入口だけ先に移設されました。"],yaniv:["ヤニブ","カード室は調整中です。現在、札の噛み合わせを確認しています。"],kujou:["苦情受付","苦情箱は準備中です。苦情が先に到着した場合は、いったん口内で保管されます。"]};const key=new URLSearchParams(location.search).get("room");if(rooms[key]){document.getElementById("roomTitle").textContent=rooms[key][0];document.getElementById("roomText").textContent=rooms[key][1];document.title=rooms[key][0]+"｜すべての歯が見える";}
