ttom:24%}.stack{padding:18px;display:grid;gap:18px}.feature{min-height:76vh;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:var(--radius);overflow:hidden;background:#ece9df}.feature:nth-child(even){grid-template-columns:1fr 1fr}.feature:nth-child(even) .copy{order:2}.feature .copy{padding:clamp(28px,6vw,82px);display:flex;flex-direction:column;justify-content:space-between}.feature h2{font-size:clamp(56px,9vw,128px);line-height:.86;letter-spacing:-.07em;margin:0;font-weight:900}.feature .go{align-self:flex-start;border-bottom:2px solid currentColor;padding:0 0 5px;font-weight:800}.feature .art{position:relative;min-height:520px;background:#111}.imoji-art{background:#0b0b0b}.imoji-art .paper{position:absolute;inset:12% 16%;background:#111;border:1px solid #353535;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:rotate(-3deg)}.imoji-art svg{position:absolute;inset:20%;width:60%;height:60%;filter:drop-shadow(0 0 18px rgba(217,173,84,.28))}.forest{background:#0a0a09}.forest .trunk{position:absolute;bottom:-4%;width:1px;background:#c8a96a;opacity:.72;transform-origin:bottom}.forest .trunk:after{content:"";position:absolute;top:-7px;left:-3px;width:7px;height:7px;border:1px solid #c8a96a;border-radius:50%}.diagnosis{background:#d8d5cb}.crosses{position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.8%,rgba(16,16,16,.12) 50%,transparent 50.2%),linear-gradient(transparent 49.8%,rgba(16,16,16,.12) 50%,transparent 50.2%);background-size:72px 72px}.orb{position:absolute;border:1px solid #111;border-radius:50%}.arcade{background:#151515}.arcade .lane{position:absolute;left:50%;top:0;bottom:0;width:38%;transform:translateX(-50%);background:linear-gradient(to bottom,#222,#070707)}.arcade .shop{position:absolute;top:10%;bottom:10%;width:25%;border:1px solid #454545;background:#1b1b1b}.arcade .shop.left{left:4%}.arcade .shop.right{right:4%}.arcade .neon{position:absolute;height:5px;background:#ff36e4;box-shadow:0 0 14px #ff36e4,
