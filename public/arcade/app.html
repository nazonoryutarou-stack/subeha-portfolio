<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="不氣屋界隈の、歩けるアーケード。妹字屋、祭祀具、観測記録、作品保管庫。">
  <meta name="theme-color" content="#22271f">
  <title>不氣屋アーケード｜すべての歯が見える</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./arcade.css">
</head>
<body>
  <canvas id="c" tabindex="0" aria-label="不氣屋アーケード。WASDで移動、矢印左右で向きを変更、Eで調べる。"></canvas>
  <div class="grade" aria-hidden="true"></div>
  <header class="top" hidden><span class="name">不氣屋アーケード</span><div class="tools"><button id="sound" aria-pressed="false">音 切</button><button id="help" aria-expanded="false" aria-controls="instructions">操作</button></div></header>
  <div id="location" aria-live="polite"></div><div id="cross" aria-hidden="true"></div>
  <section id="gate" aria-labelledby="title"><div class="gate-inner"><p class="entry-mark">不氣屋界隈</p><h1 id="title">不氣屋アーケード</h1><p id="entry-help">WASDで歩く。マウスで見回す。</p><button id="enter" disabled>準備中…</button><p id="load-error" role="alert" hidden></p></div></section>
  <section id="instructions" role="dialog" aria-label="操作" hidden>
    <div class="help-heading"><b>操作</b><button id="close-help" aria-label="操作を閉じる">閉じる</button></div>
    <p>WASD：移動<br>マウスをドラッグ：見回す<br>↑ ↓：前進・後退　← →：向きを変える<br>E ／ 画面の表示：調べる<br>Esc：マウス固定を解除</p>
    <p>スマートフォンは左下で移動、右側をなぞって見回す。</p>
    <label><input type="checkbox" id="button-mode"> 移動を方向ボタンにする</label>
    <label><input type="checkbox" id="calm"> 点滅・設備の動きを止める</label>
    <label>描画 <select id="quality"><option value="auto">自動</option><option value="low">軽量</option><option value="high">精細</option></select></label>
    <div class="help-actions"><button id="lock-mouse">マウス固定</button><button id="reset">入口に戻る</button><a href="../">通りを出る</a></div>
  </section>
  <div id="touch-controls" hidden>
    <div id="joystick" role="group" aria-label="移動スティック"><span id="stick"></span><small>移動</small></div>
    <div id="dpad" aria-label="方向ボタン" hidden><button data-move="forward" aria-label="前進">↑</button><button data-move="left" aria-label="左へ移動">←</button><button data-move="back" aria-label="後退">↓</button><button data-move="right" aria-label="右へ移動">→</button></div>
    <span id="look-hint">右側をなぞって見回す</span>
  </div>
  <button id="interact" hidden><span id="target-label"></span><small>調べる / E</small></button>
  <p id="notice" role="status" hidden></p><output id="diagnostic" hidden></output>
  <noscript><p class="fallback">この通りを歩くにはJavaScriptが必要です。<a href="../works/">作品保管庫へ</a></p></noscript>
  <script type="module" src="./boot.js"></script>
</body>
</html>
