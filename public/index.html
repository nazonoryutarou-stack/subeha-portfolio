<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="すべての歯が見える。">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#f4e5ec">
<title>すべての歯が見える</title>
<link rel="stylesheet" href="./home.css">
</head>
<body>
<div class="wallpaper" aria-hidden="true"></div>

<div class="cabinet-scene" id="cabinetScene">
  <figure class="doll-card" aria-hidden="true">
    <img src="https://collectionapi.metmuseum.org/api/collection/v1/iiif/17767/25401/main-image" alt="">
  </figure>

  <button class="ephemera bouquet-card mechanical-card" id="mechanicalCard" type="button" aria-label="紙飾りを開く" aria-expanded="false">
    <span class="tape tape-pink" aria-hidden="true"></span>
    <img src="https://collectionapi.metmuseum.org/api/collection/v1/iiif/785070/1892773/main-image" alt="">
    <span class="paper-tab" aria-hidden="true">↟</span>
  </button>

  <button class="ephemera eye-locket" id="eyeLocket" type="button" aria-label="ロケットを開閉する" aria-pressed="false">
    <span class="locket-loop" aria-hidden="true"></span>
    <span class="locket-lid" aria-hidden="true"></span>
    <img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/George%20Engleheart%20-%20A%20Lady%27s%20Right%20Eye%20-%20NMB%202766%20-%20Nationalmuseum.jpg" alt="">
  </button>

  <figure class="ephemera clove-specimen">
    <span class="tape tape-blue" aria-hidden="true"></span>
    <img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Clove%20(PSF).png" alt="">
    <figcaption>SPECIMEN / CLOVE</figcaption>
  </figure>

  <img class="occult-flourish" src="https://fleuron.lib.cam.ac.uk/static/ornament_images/090550010202500_1.png" alt="" aria-hidden="true">

  <button class="paper-tag linda-tag drag-item" type="button"><b>LINDA</b><span>おだいじに</span></button>
  <button class="paper-tag salt-tag drag-item" type="button"><b>祓塩</b><span>非食用</span></button>
  <button class="paper-tag jimotsu-tag drag-item" type="button"><b>持物</b><span>NO.01</span></button>
  <div class="tiny-stickers" aria-hidden="true">♡　✦　☾　✧　♡</div>

  <button class="secret-star" id="secretStar" type="button" aria-label="星のシール">✦</button>
  <div class="secret-eye" aria-hidden="true"><i></i></div>
</div>

<button class="cabinet-reset" id="resetCabinet" type="button">整頓</button>

<main class="entrance">
  <section class="portal-card" aria-label="入口">
    <div class="portal-meta"><span>PERSONAL OCCULT CABINET</span><span class="ok-stamp">異常なし</span></div>
    <h1 class="site-title">すべての歯が見える</h1>

    <div class="crest-stage">
      <div class="crest-cameo">
        <img class="crest-image" src="./hitotsu-ore-choji.png" alt="一つ折れ丁子">
      </div>
      <span class="crest-caption">生活霊具 / 観測記録 / 断章</span>
    </div>

    <div class="enter-wrap">
      <a class="enter-link" href="./thought.html#node-1-1"><span>入場</span><small>OPEN FILE</small></a>
    </div>
  </section>
</main>
<script src="./home.js" defer></script>
</body>
</html>
