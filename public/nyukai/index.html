<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0a">
<meta name="description" content="乳海から、まだこちら側にない概念をひとつ採集する。">
<meta property="og:title" content="乳海採集機">
<meta property="og:description" content="この世界に存在しうる、まだ使われていない概念をひとつ持ち帰る。">
<title>乳海採集機</title>
<style>
:root{--bg:#090a0a;--fg:#f2efe6;--muted:#88877f;--line:rgba(242,239,230,.18);--glow:rgba(196,255,219,.10);--accent:#d7ffe5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
html{font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{min-height:100svh;overflow-x:hidden}
button{font:inherit;color:inherit}.noise{position:fixed;inset:0;pointer-events:none;opacity:.055;z-index:4;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.72'/%3E%3C/svg%3E")}
#sea{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.52}
.shell{position:relative;z-index:2;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:max(20px,env(safe-area-inset-top)) clamp(18px,4vw,52px) max(18px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.18em}.brand img{width:30px;height:30px;filter:invert(1);opacity:.9}.signal{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10px;letter-spacing:.14em}.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent);animation:pulse 2.4s ease-in-out infinite}
.main{display:grid;place-items:center;padding:9svh 0 7svh}.intro,.result{width:min(860px,100%)}
.kicker{margin:0 0 18px;color:var(--muted);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
h1{margin:0;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(54px,12vw,142px);font-weight:400;line-height:.91;letter-spacing:-.075em;text-wrap:balance}
.lead{margin:30px 0 0;max-width:38em;color:#b9b7af;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(16px,2vw,21px);line-height:1.95}
.action{margin-top:38px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.collect,.ghost{appearance:none;border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:999px;padding:13px 19px;cursor:pointer;font-weight:700;letter-spacing:.04em}.collect:hover{transform:translateY(-1px)}.ghost{background:transparent;color:var(--fg);border-color:var(--line);font-weight:500}.ghost:hover{border-color:var(--fg)}
.micro{font-size:10px;color:var(--muted);letter-spacing:.08em}
.result{display:none}.result.show{display:block;animation:appear .72s cubic-bezier(.2,.8,.2,1)}
.specimen{position:relative;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:24px 0 30px}.meta{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}.id{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;color:var(--muted)}.status{font-size:10px;letter-spacing:.16em;color:var(--accent)}
.name{margin:34px 0 18px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(42px,9vw,92px);font-weight:400;line-height:1.03;letter-spacing:-.05em;text-wrap:balance}.property{margin:0;max-width:34em;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(17px,2vw,24px);line-height:1.9;color:#d0cdc4}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-top:34px;border:1px solid var(--line)}.field{background:var(--bg);padding:15px}.field small{display:block;color:var(--muted);font-size:9px;letter-spacing:.16em;margin-bottom:7px}.field strong{font-size:12px;font-weight:500;letter-spacing:.05em}
.result-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.toast{min-height:1.2em;margin-top:12px;color:var(--muted);font-size:11px}
.scanning{display:none;width:min(860px,100%)}.scanning.show{display:block}.scanline{height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 28px var(--accent);animation:sweep 1s linear infinite}.scantext{margin-top:20px;color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}
.foot{display:flex;justify-content:space-between;align-items:end;gap:22px;color:var(--muted);font-size:9px;letter-spacing:.1em}.foot a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}@keyframes sweep{from{transform:translateX(-35%)}to{transform:translateX(35%)}}@keyframes appear{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@media(max-width:680px){.fields{grid-template-columns:1fr}.signal span:last-child{display:none}.lead{max-width:30em}.foot{align-items:flex-start;flex-direction:column-reverse}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}#sea{display:none}}
</style>
</head>
<body>
<canvas id="sea" aria-hidden="true"></canvas><div class="noise" aria-hidden="true"></div>
<div class="shell">
<header class="top">
  <div class="brand"><img src="../hitotsu-ore-choji.png" alt=""><span>乳海採集機</span></div>
  <div class="signal"><i class="dot"></i><span>CONCEPT FIELD / ONLINE</span></div>
</header>
<main class="main">
  <section class="intro" id="intro">
    <p class="kicker">Concept recovery terminal</p>
    <h1>まだ無いものを、<br>ひとつ持ち帰る。</h1>
    <p class="lead">乳海には、この世界に存在しうる全概念がある。大半は役に立たない。ここでは、その中から一つだけ採集する。</p>
    <div class="action"><button class="collect" id="collect">採集する</button><span class="micro">一回につき一概念。</span></div>
  </section>
  <section class="scanning" id="scanning" aria-live="polite"><div class="scanline"></div><p class="scantext" id="scantext">SEARCHING / 0000</p></section>
  <section class="result" id="result" aria-live="polite">
    <article class="specimen">
      <div class="meta"><span class="id" id="specimenId">N-0000</span><span class="status">RECOVERED</span></div>
      <h2 class="name" id="conceptName"></h2>
      <p class="property" id="conceptProperty"></p>
      <div class="fields">
        <div class="field"><small>CLASS</small><strong id="conceptClass"></strong></div>
        <div class="field"><small>UTILITY</small><strong id="conceptUtility"></strong></div>
        <div class="field"><small>STABILITY</small><strong id="conceptStability"></strong></div>
      </div>
    </article>
    <div class="result-actions">
      <button class="collect" id="share">持ち帰る</button>
      <button class="ghost" id="image">画像にする</button>
      <button class="ghost" id="again">もう一つ</button>
    </div>
    <div class="toast" id="toast"></div>
  </section>
</main>
<footer class="foot"><span>すべての歯が見える / 一つ折れ丁子</span><a href="../">戻る</a></footer>
</div>
<script>
const nameA=["北ではない","昨日だけの","誰にも思い出せない","満場一致で言い淀む","鼓膜の外側にある","一度しか存在しない","眠る直前だけ見える","全員が知っている","持ち主より先に帰る","影だけが覚えている","雨の日だけ増える","名前を呼ぶと薄くなる","地図に載ると消える","朝になると古くなる","まだ誰も失っていない","見つけるたび遠ざかる"];
const nameB=["方角","言葉","名曲","物語","階段","街灯","窓","天気","駅","鏡","部屋","合図","記憶","祝日","海岸線","手紙"];
const properties=["存在すること自体には問題がないが、使用すると現在地の説明が少しだけ難しくなる。","誰でも理解できる。しかし理解したことを他人に説明しようとすると、必ず別の話になる。","観測中は完全に普通に見える。記録を見返したときだけ、そこに無かったことが分かる。","役に立つ状況は極端に限られている。その状況が何なのかは、まだ発生していない。","一度経験すると二度目からは初めてではなくなる。にもかかわらず、毎回初めてだと感じる。","複数人で同時に確認すると一致するが、解散した瞬間から全員の説明が食い違う。","人間の感覚器には収まらないため、実際には欠けた部分だけが知覚される。","何かを失くした人だけが短時間利用できる。何を失くしたか思い出すと消える。","記録可能だが保存できない。複製すると内容ではなく、複製したという事実だけが残る。","用途はない。ただし、無いと仮定すると世界のどこか一箇所だけ辻褄が合わなくなる。","毎日同じ時刻に現れるが、その時刻は時計ごとに異なる。","見た人の数だけ細部が増える。誰も見なくなると最初の形に戻る。"];
const classes=["方位系","言語系","聴覚系","記憶系","都市系","時間系","夢系","記録系","未分類"];
const utilities=["用途不明","ほぼ無用","局所的に有用","観賞用","持ち帰り非推奨","一応使える"];
const stabilities=["安定","やや不安定","観測依存","記憶依存","夜間のみ安定","一回限り"];
let currentSeed=null,currentData=null;
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}}
function mulberry32(a){return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function makeSeed(){return (crypto.getRandomValues(new Uint32Array(2))[0].toString(36)+Date.now().toString(36)).slice(-10).toUpperCase()}
function pick(r,a){return a[Math.floor(r()*a.length)]}
function build(seed){const seedFn=xmur3(seed);const r=mulberry32(seedFn());let a=pick(r,nameA),b=pick(r,nameB);return{id:`NY-${seed.slice(0,4)}-${seed.slice(-4)}`,name:`${a}${b}`,property:pick(r,properties),class:pick(r,classes),utility:pick(r,utilities),stability:pick(r,stabilities)}}
function showResult(seed,push=true){currentSeed=seed;currentData=build(seed);document.querySelector('#specimenId').textContent=currentData.id;document.querySelector('#conceptName').textContent=currentData.name;document.querySelector('#conceptProperty').textContent=currentData.property;document.querySelector('#conceptClass').textContent=currentData.class;document.querySelector('#conceptUtility').textContent=currentData.utility;document.querySelector('#conceptStability').textContent=currentData.stability;document.querySelector('#intro').style.display='none';document.querySelector('#scanning').classList.remove('show');document.querySelector('#result').classList.add('show');if(push){const u=new URL(location.href);u.searchParams.set('seed',seed);history.replaceState(null,'',u)}}
function collect(){document.querySelector('#intro').style.display='none';document.querySelector('#result').classList.remove('show');document.querySelector('#scanning').classList.add('show');const seed=makeSeed();let n=0;const el=document.querySelector('#scantext');const timer=setInterval(()=>{n+=Math.floor(Math.random()*811)+73;el.textContent=`SEARCHING / ${String(n%10000).padStart(4,'0')}`},80);setTimeout(()=>{clearInterval(timer);showResult(seed)},900)}
function shareText(){return `乳海から「${currentData.name}」を採集した。\n${currentData.property}\n${location.href}`}
async function share(){const text=shareText();try{if(navigator.share){await navigator.share({title:'乳海採集機',text,url:location.href});toast('共有画面を開いた。');return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(text);toast('結果をコピーした。')}catch{toast('共有できなかった。URLをコピーしてくれ。')}}
function toast(msg){const e=document.querySelector('#toast');e.textContent=msg;clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.textContent='',2600)}
function renderCard(){const c=document.createElement('canvas');c.width=1080;c.height=1350;const g=c.getContext('2d');g.fillStyle='#090a0a';g.fillRect(0,0,c.width,c.height);g.strokeStyle='rgba(242,239,230,.22)';g.strokeRect(70,70,940,1210);g.fillStyle='#88877f';g.font='26px monospace';g.fillText(currentData.id,100,130);g.fillStyle='#d7ffe5';g.font='24px sans-serif';g.textAlign='right';g.fillText('RECOVERED',980,130);g.textAlign='left';g.fillStyle='#f2efe6';g.font='56px serif';wrap(g,currentData.name,100,300,850,72);g.fillStyle='#c9c6bd';g.font='34px serif';wrap(g,currentData.property,100,560,860,54);g.strokeStyle='rgba(242,239,230,.18)';g.beginPath();g.moveTo(100,1010);g.lineTo(980,1010);g.stroke();g.fillStyle='#88877f';g.font='20px sans-serif';g.fillText(`CLASS  ${currentData.class}`,100,1080);g.fillText(`UTILITY  ${currentData.utility}`,100,1135);g.fillText(`STABILITY  ${currentData.stability}`,100,1190);g.fillStyle='#f2efe6';g.font='24px sans-serif';g.fillText('乳海採集機 / すべての歯が見える',100,1250);return c}
function wrap(g,text,x,y,max,line){let s='',yy=y;for(const ch of text){const t=s+ch;if(g.measureText(t).width>max&&s){g.fillText(s,x,yy);s=ch;yy+=line}else s=t}if(s)g.fillText(s,x,yy);return yy}
async function makeImage(){const c=renderCard();c.toBlob(async blob=>{if(!blob)return;const file=new File([blob],`nyukai-${currentSeed}.png`,{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'乳海採集機',text:`乳海から「${currentData.name}」を採集した。`});return}}catch(e){if(e.name==='AbortError')return}const a=document.createElement('a');a.download=file.name;a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('共有画像を保存した。')},'image/png')}
document.querySelector('#collect').addEventListener('click',collect);document.querySelector('#again').addEventListener('click',collect);document.querySelector('#share').addEventListener('click',share);document.querySelector('#image').addEventListener('click',makeImage);
const initial=new URL(location.href).searchParams.get('seed');if(initial&&/^[A-Z0-9]{4,16}$/i.test(initial)){showResult(initial.toUpperCase(),false)}
const canvas=document.querySelector('#sea'),ctx=canvas.getContext('2d');let pts=[],w=0,h=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);pts=Array.from({length:Math.min(80,Math.floor(w*h/16000))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.16,vy:(Math.random()-.5)*.16,r:Math.random()*1.4+.3}))}function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='rgba(215,255,229,.34)';for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}addEventListener('resize',resize,{passive:true});resize();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)draw();
</script>
</body>
</html>
