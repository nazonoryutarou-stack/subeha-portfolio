<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="『すべての歯が見える』が世界をどう捉えているかを、装飾された断章として読むサイト。">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#171114">
<title>すべての歯が見える</title>
<link rel="stylesheet" href="./thought.css">
</head>
<body>
<a class="skip-link" href="#thought">本文へ</a>

<header class="site-header">
  <a class="site-name" href="./">すべての歯が見える</a>
  <div class="site-kicker">WORDS / OCCULT NOTE</div>
  <button class="menu-button" id="mapButton" type="button" aria-expanded="false" aria-controls="utilityPanel" aria-label="記録一覧を開く">
    <span></span><span></span><span></span><small>MENU</small>
  </button>
</header>

<main id="thought" class="journal-shell">
  <div class="outer-ornaments" aria-hidden="true">
    <span class="moon">☾</span>
    <span class="star star-a">✦</span>
    <span class="star star-b">✧</span>
    <span class="star star-c">✦</span>
    <span class="ribbon ribbon-left"></span>
    <span class="ribbon ribbon-right"></span>
    <span class="wax wax-left">歯</span>
    <span class="wax wax-right">丁</span>
  </div>

  <article class="paper" aria-label="思考の断章">
    <div class="paper-top" aria-hidden="true">
      <div class="lace lace-top"></div>
      <div class="paper-crown">♛</div>
      <div class="paper-stars">✦　✧　✦　✧　✦</div>
    </div>

    <div class="margin-collage left-collage" aria-hidden="true">
      <figure class="collage-photo moon-photo">
        <img src="https://collectionapi.metmuseum.org/api/collection/v1/iiif/785070/1892773/main-image" alt="">
      </figure>
      <div class="eye-charm"><span class="eye-iris"></span></div>
      <div class="tooth-charm">♢</div>
      <div class="bow bow-left"></div>
    </div>

    <div class="margin-collage right-collage" aria-hidden="true">
      <figure class="eye-locket">
        <img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/George%20Engleheart%20-%20A%20Lady%27s%20Right%20Eye%20-%20NMB%202766%20-%20Nationalmuseum.jpg" alt="">
      </figure>
      <div class="tiny-ghost"><i></i><i></i></div>
      <div class="crystal-ball"><span></span></div>
      <div class="bow bow-right"></div>
    </div>

    <div class="journal-intro">
      <p class="journal-label">WORDS / OCCULT NOTE</p>
      <div class="ornamental-rule"><span>✦</span></div>
    </div>

    <div id="journalContent" class="journal-content" aria-live="polite"></div>

    <footer class="journal-footer" aria-hidden="true">
      <div class="footer-rule"><span>☾</span><span>✦</span><span>☽</span></div>
      <div class="lace lace-bottom"></div>
    </footer>
  </article>
</main>

<aside class="utility-panel" id="utilityPanel" hidden>
  <div class="panel-inner">
    <div class="panel-head">
      <div><p>記録一覧</p><small>INDEX / OBSERVATION FILE</small></div>
      <button id="closePanel" type="button">閉じる</button>
    </div>
    <div id="nodeIndex" class="node-index"></div>
  </div>
</aside>

<noscript>この閲覧画面にはJavaScriptが必要です。</noscript>
<script src="./thought.js" defer></script>
</body>
</html>
