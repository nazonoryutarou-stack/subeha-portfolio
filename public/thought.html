<!doctype html>
<html lang="ja">

  <img class="mat mat-lace mat-lace-right" src="https://collectionapi.metmuseum.org/api/collection/v1/iiif/212662/446286/main-image" alt="">

<header class="topbar">

  </div>
</main>

<aside class="utility-panel" id="utilityPanel" hidden>
  <div class="utility-inner">
    <div class="utility-head"><div><p>記録一覧</p><small>INDEX / OBSERVATION FILE</small></div><button id="closePanel" type="button">閉じる</button></div>
