<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="『すべての歯が見える』が世界をどう捉えているかを、断章と分岐として読むサイト。">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#f6efe8">
<title>すべての歯が見える</title>
<link rel="stylesheet" href="./thought.css">
</head>
<body>
<a class="skip-link" href="#thought">本文へ</a>

<header class="topbar">
  <a class="crest-home" href="./" aria-label="入口に戻る"><img src="./hitotsu-ore-choji.png" alt=""></a>
  <p class="record-label"><span>生活霊具記録</span><small>SUBETENOHA GA MIERU</small></p>
  <button class="map-button" id="mapButton" type="button" aria-expanded="false" aria-controls="utilityPanel">記録一覧</button>
</header>

<div class="prop-layer" aria-hidden="true">
  <div class="prop prop-linda">
    <span class="prop-kicker">LINDA</span>
    <strong>おだいじに</strong>
    <i></i>
  </div>

  <div class="prop prop-salt">
    <span>祓塩</span>
    <small>非食用</small>
  </div>

  <div class="prop prop-talisman">
    <b>無</b><b>事</b>
    <small>室内用</small>
  </div>

  <div class="prop prop-clove">
    <span>✣</span>
    <small>丁子標本</small>
  </div>

  <div class="prop prop-jimotsu">
    <span>持物</span>
    <i></i>
    <small>NO.01</small>
  </div>

  <div class="prop prop-trumpet">
    <svg viewBox="0 0 120 58" role="presentation" focusable="false">
      <path d="M16 33h39c8 0 14-5 14-12v-2h9v6c0 10-8 18-19 18H16z"/>
      <path d="M78 18h12v26H78z"/>
      <path d="M90 18c8 0 17-7 24-13v52c-7-6-16-13-24-13z"/>
      <path d="M28 28v-7h8v7M40 28v-7h8v7"/>
    </svg>
    <small>持物 / 軍隊ラッパ</small>
  </div>

  <div class="prop prop-seal">検</div>
  <div class="prop prop-thread"><span></span><span></span><span></span></div>
</div>

<main id="thought" class="thought-shell" aria-live="polite">
  <section class="rail-wrap" aria-label="思考の流れ">
    <div class="rail" id="rail"></div>
  </section>

  <nav class="branch-nav" id="branchNav" aria-label="次の分岐"></nav>

  <div class="reader-footer">
    <p class="gesture-note">横へ送る / 記録をめくる</p>
    <p class="system-note"><span class="status-dot" aria-hidden="true"></span>表示に異常がなければ、そのままお読みください。</p>
  </div>
</main>

<aside class="utility-panel" id="utilityPanel" hidden>
  <div class="utility-inner">
    <div class="utility-head">
      <div><p>記録一覧</p><small>INDEX / OBSERVATION FILE</small></div>
      <button id="closePanel" type="button">閉じる</button>
    </div>
    <div id="nodeIndex" class="node-index"></div>
  </div>
</aside>

<noscript>この閲覧画面にはJavaScriptが必要です。</noscript>
<script src="./thought.js" defer></script>
</body>
</html>
