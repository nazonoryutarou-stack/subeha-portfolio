<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="アーケードの操作検証用。製品に同梱しないCPU描画。"><title>アーケード 操作検証</title><style>body{margin:0;background:#181d18;color:#ddd;font:14px system-ui}header{height:56px;display:flex;gap:15px;align-items:center;padding:0 16px}select{font:inherit;padding:8px}main{display:flex;justify-content:center}iframe{border:1px solid #565;width:1280px;height:800px;max-width:100%;flex-shrink:0}</style></head><body><header>CPU操作検証（WebGL性能は測定しません）<label>画面 <select id="size"><option value="1280,800">PC 1280×800</option><option value="390,780">縦 390×780</option><option value="844,390">横 844×390</option></select></label></header><main><iframe id="view" title="通り" src="./scene.html?qa=1"></iframe></main><script>document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split(',');const f=document.getElementById('view');f.style.width=w+'px';f.style.height=h+'px';f.src='./scene.html?qa=1'+(w==='1280'?'':'&touch=1');};</script></body></html>
