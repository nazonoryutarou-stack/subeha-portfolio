<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="description" content="配信音声とVRMから切り抜き動画を作る制作用ツール。字幕・話者・参考画像まで一つの画面で扱う。">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111114">
<title>VRM STUDIO</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app">

  <div id="stage">
    <canvas id="c"></canvas>
    <div class="hud"><span id="hudMode">PORTRAIT 9:16</span><span id="hudRec"></span></div>
    <div id="dropHint"><div><strong>VRMと音声を読み込む</strong>正面・配信姿勢・口パクまで自動で組む。</div></div>
  </div>

  <div id="panel">

    <div class="row">
      <label class="file">VRMを選ぶ<input id="vrmFile" type="file" accept=".vrm,model/gltf-binary"></label>
      <label class="file">音声を選ぶ<input id="audioFile" type="file" accept="audio/*,.m4a,.mp3,.wav"></label>
    </div>

    <div class="meter"><i id="meterBar"></i></div>

    <div class="seekwrap">
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" disabled>
      <div class="seekband"><i id="bandFill"></i></div>
    </div>
    <div class="times"><span id="tNow">0:00</span><span id="tClip">区間 未設定</span><span id="tEnd">0:00</span></div>
    <div class="row3">
      <button id="markA" disabled>始点にする</button>
      <button id="markB" disabled>終点にする</button>
      <button id="clearClip" disabled>区間を消す</button>
    </div>

    <div class="row3">
      <button id="play" class="primary" disabled>再生</button>
      <button id="stop" disabled>停止</button>
      <button id="preview" disabled>区間だけ再生</button>
    </div>

    <hr>

    <label class="lab" id="sizeLab">書き出しの形</label>
    <div class="row3 seg" role="group" aria-labelledby="sizeLab">
      <button id="sizeV" data-w="720" data-h="1280" data-name="PORTRAIT 9:16" aria-pressed="true">縦 9:16</button>
      <button id="sizeS" data-w="900" data-h="900" data-name="SQUARE 1:1" aria-pressed="false">正方 1:1</button>
      <button id="sizeH" data-w="1280" data-h="720" data-name="LANDSCAPE 16:9" aria-pressed="false">横 16:9</button>
    </div>
    <label class="check"><input id="hiRes" type="checkbox"> 高画質で書き出す（1.5倍・端末が重くなる）</label>

    <label class="lab" for="telop">演出テロップ（下）</label>
    <input id="telop" type="text" placeholder="逐語字幕とは別の見出し用" maxlength="60">
    <label class="lab" for="titleTx">見出し（上）</label>
    <input id="titleTx" type="text" placeholder="第◯◯回 / 切り抜き" maxlength="40">

    <hr>

    <div class="row">
      <label class="file">背景画像<input id="bgFile" type="file" accept="image/*"></label>
      <button id="clearBg">背景なし</button>
    </div>
    <div class="zoomrow"><span>寄り</span><input id="zoom" type="range" min="70" max="145" value="108"><span>引き</span></div>
    <div class="row3">
      <button id="portrait">配信構図</button>
      <button id="fullbody">全身</button>
      <button id="flip">向き反転</button>
    </div>

    <hr>

    <div class="row">
      <button id="record" class="rec" disabled>録画開始</button>
      <button id="download" disabled>録画を保存</button>
    </div>

    <div id="status" role="status" aria-live="polite">VRMと音声を選んでください。</div>
    <div class="small">動画用VRMは <b>Subeha.vrm</b> を使用。音声解析後は本人話者を選び、その区間だけ口パクさせます。録画は対応ブラウザでは端末内で生成します。</div>
  </div>

</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
