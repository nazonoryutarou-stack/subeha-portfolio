<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111114" />
  <title>VRM TALKER</title>
  <style>
    html,body{margin:0;background:#111114;color:#f5f5f3;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;height:100%;overflow:hidden}
    #app{height:100%;display:grid;grid-template-rows:1fr auto}
    #stage{position:relative;min-height:0;background:radial-gradient(circle at 50% 34%,#32323b 0,#17171c 52%,#0b0b0e 100%);background-size:cover;background-position:center;overflow:hidden}
    #stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.08),transparent 35%,rgba(0,0,0,.18));z-index:1}
    canvas{position:relative;z-index:2;display:block;width:100%;height:100%;touch-action:none}
    .hud{position:absolute;z-index:3;left:14px;top:14px;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:#ffffffaa;pointer-events:none}
    #dropHint{position:absolute;z-index:3;inset:0;display:grid;place-items:center;text-align:center;padding:40px;color:#ffffffb8;pointer-events:none}
    #dropHint strong{display:block;color:white;font-size:20px;margin-bottom:9px}
    #panel{background:#151519eF;backdrop-filter:blur(18px);border-top:1px solid #ffffff18;padding:12px max(12px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:grid;gap:9px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    button,.file{appearance:none;border:1px solid #ffffff22;background:#25252b;color:#fff;border-radius:10px;min-height:44px;font:700 13px system-ui;display:flex;align-items:center;justify-content:center;padding:0 10px}
    button.primary{background:#f3f3ef;color:#111;border-color:#f3f3ef} button:disabled{opacity:.4}
    input[type=file]{display:none}.meter{height:5px;border-radius:9px;background:#ffffff18;overflow:hidden}.meter>i{display:block;height:100%;width:0%;background:#f5f5f1}
    #status{font-size:12px;color:#ffffff9c;min-height:17px}.small{font-size:11px;color:#ffffff70;line-height:1.45}
    input[type=range]{width:100%;accent-color:white}.zoomrow{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;font-size:11px;color:#ffffff80}
    @media(min-width:800px){#app{max-width:540px;margin:auto;border-left:1px solid #ffffff12;border-right:1px solid #ffffff12}}
  </style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c"></canvas><div class="hud">VRM TALKER / PORTRAIT MODE</div><div id="dropHint"><div><strong>VRMを読み込む</strong>配信用の自然な立ち姿に自動補正します。</div></div></div>
  <div id="panel">
    <div class="row"><label class="file">VRMを選ぶ<input id="vrmFile" type="file" accept=".vrm,model/gltf-binary"></label><label class="file">音声を選ぶ<input id="audioFile" type="file" accept="audio/*,.m4a,.mp3,.wav"></label></div>
    <div class="row"><label class="file">背景画像<input id="bgFile" type="file" accept="image/*"></label><button id="clearBg">背景なし</button></div>
    <div class="meter"><i id="meterBar"></i></div>
    <input id="seek" type="range" min="0" max="1000" value="0" disabled>
    <div class="zoomrow"><span>寄り</span><input id="zoom" type="range" min="70" max="145" value="112"><span>引き</span></div>
    <div class="row3"><button id="play" class="primary" disabled>再生</button><button id="stop" disabled>停止</button><button id="portrait">配信構図</button></div>
    <div class="row"><button id="fullbody">全身</button><button id="reset">正面</button></div>
    <div id="status">VRMと音声を選択してください。</div>
    <div class="small">腕を下ろした自然な待機姿勢、呼吸、瞬き、頭部の微動を自動生成します。背景・VRM・音声は端末内だけで処理します。</div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
